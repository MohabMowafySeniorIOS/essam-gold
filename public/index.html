/* ============================= تأمين الوزن ============================= */
function weightFlows(fromISO, toISO){
  let inW=0, outW=0;
  const inRange = d=>{ d=String(d).slice(0,10); if(fromISO && d<fromISO) return false; if(toISO && d>toISO) return false; return true; };
  const addItems = (items, karatFallback, dir)=>{
    (items||[]).forEach(it=>{ const w = to21(it.weight, it.karat||karatFallback); if(dir>0) inW+=w; else outW+=w; });
  };
  state.purchaseInvoices.forEach(i=>{ if(inRange(i.date)) addItems(i.items, i.karat, +1); });
  state.merchantReturns.forEach(i=>{ if(inRange(i.date)) addItems(i.items, null, +1); });
  state.customerReturns.forEach(i=>{ if(inRange(i.date)) addItems(i.items, null, +1); });
  state.scrapPurchases.forEach(s=>{ if(inRange(s.date)) inW += to21(s.weight, s.karat); });
  state.goldLots.forEach(l=>{ if(!inRange(l.date)) return; if(l.dir==='buy') inW += l.weight21; else outW += l.weight21; });
  state.salesInvoices.forEach(i=>{ if(inRange(i.date)) addItems(i.items, i.karat, -1); });
  state.customerSales.forEach(i=>{ if(inRange(i.date)) addItems(i.items, null, -1); });
  return {inW, outW, net: inW-outW};
}
function cashFlows(fromISO, toISO){
  let cin=0, cout=0;
  cashReportEntries().forEach(e=>{
    if(fromISO && e.date<fromISO) return;
    if(toISO && e.date>toISO) return;
    if(e.kind==='in') cin+=e.amount; else cout+=e.amount;
  });
  return {cin, cout, net:cin-cout};
}

function pieceMovements(piece){
  const rows = [];
  rows.push({date:piece.date, type: piece.origin==='manufacture'? 'تصنيع من الكسر' : 'شراء / إدخال للمخزن',
    party: piece.merchantId? merchantName(piece.merchantId) : (piece.origin==='manufacture'? 'تصنيع داخلي' : '—'), ref:'—'});
  state.purchaseInvoices.forEach(inv=>{ if(inv.id===piece.invoiceId) rows.push({date:inv.date, type:'فاتورة شراء من تاجر', party:merchantName(inv.merchantId), ref:'#'+inv.no}); });
  state.salesInvoices.forEach(inv=>{ if((inv.items||[]).some(i=>i.pieceId===piece.id)) rows.push({date:inv.date, type:'بيع لتاجر', party:merchantName(inv.merchantId), ref:'#'+inv.no}); });
  state.customerSales.forEach(inv=>{ if((inv.items||[]).some(i=>i.pieceId===piece.id)) rows.push({date:inv.date, type:'بيع لعميل', party:customerName(inv.customerId), ref:'#'+inv.no}); });
  state.merchantReturns.forEach(inv=>{ if((inv.items||[]).some(i=>i.pieceId===piece.id)) rows.push({date:inv.date, type:'مرتجع من تاجر', party:merchantName(inv.merchantId), ref:'#'+inv.no}); });
  state.customerReturns.forEach(inv=>{ if((inv.items||[]).some(i=>i.pieceId===piece.id)) rows.push({date:inv.date, type:'مرتجع من عميل', party:customerName(inv.customerId), ref:'#'+inv.no}); });
  return rows.sort((a,b)=> new Date(a.date)-new Date(b.date));
}

let prb = null;

  prb = { mode:'melt', merchantId:null, items:[] };

function pieceOriginalMaking(piece){
  if(!piece.invoiceId) return 0;
  const inv = state.purchaseInvoices.find(x=>x.id===piece.invoiceId);
  if(!inv) return 0;
  let li = (inv.items||[]).find(x=>x.pieceId===piece.id);
  if(!li) li = (inv.items||[]).find(x=> Math.abs((Number(x.weight)||0)-piece.weight)<0.001 && Number(x.karat)===Number(piece.karat));
  return li? Number(li.making)||0 : 0;
}

function addPrbPieceByScan(){
  const input = document.getElementById('prb-scan');
  const raw = input? input.value : '';
  const piece = findPieceByScan(raw);
  if(!piece){ toast('الباركود ده مش موجود في القطع'); if(input){input.value=''; input.focus();} return; }
  if(piece.sold || piece.returned){ toast('القطعة دي مش متاحة (متباعة أو اترجعت قبل كده)'); if(input){input.value=''; input.focus();} return; }
  if(prb.items.some(x=>x.pieceId===piece.id)){ toast('القطعة دي مضافة بالفعل'); if(input){input.value=''; input.focus();} return; }
  const making = pieceOriginalMaking(piece);

function submitPieceReturn(){
  if(!prb.items.length){ toast('امسح قطعة واحدة على الأقل'); return; }
  if(prb.mode==='merchant' && !prb.merchantId){ toast('اختار التاجر الأول'); return; }
  const items = prb.items.slice();
  const isMelt = prb.mode==='melt';
  const merchantId = prb.merchantId;
  mutate(()=>{
    const m = isMelt? null : merchantById(merchantId);
    items.forEach(it=>{
      const pc = state.pieces.find(x=>x.id===it.pieceId);
      if(!pc) return;
      if(isMelt){
        state.scrapStock[it.karat] = (state.scrapStock[it.karat]||0) + it.weight;
        state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) - it.weight;
        if(it.making>0.0005){
          state.goldLosses.push({id:uid('loss'), date:todayStr(), createdAt:new Date().toISOString(),
            pieceId:it.pieceId, code:it.code, itemName:it.itemName, karat:it.karat, weight:it.weight,
            amount:it.making, reason:'تكسير قطعة'});
        }
        pc.returned = true; pc.returnedKind='melt'; pc.returnedDate=todayStr();
      } else {
        state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) - it.weight;
        m.balanceGold[it.karat] = (m.balanceGold[it.karat]||0) + it.weight;
        pc.returned = true; pc.returnedKind='merchant'; pc.returnedDate=todayStr(); pc.returnedToMerchantId=merchantId;
      }
      pc.sold = true; // تخرج من مخزون القطع المتاحة للبيع
    });
  }, isMelt? ('تم تكسير '+items.length+' قطعة ورجعت للكسر') : ('تم إرجاع '+items.length+' قطعة للتاجر'));
  prb = null;
  goto('pieces');
}

  const tab = uiState.pendingTab||'pending';
  const all = [...state.pendingSales].sort((a,b)=> new Date(b.date)-new Date(a.date) || b.no-a.no);
  const rows = all.filter(p=> tab==='all'? true : (p.status||'pending')===tab);
  const openRows = all.filter(p=>(p.status||'pending')==='pending');
  const totCash = openRows.reduce((s,p)=>s+(p.totalCash||0),0);

function setPendingPrice(id, val){
  const p = state.pendingSales.find(x=>x.id===id);
  if(!p || (p.status||'pending')!=='pending') return;
  const v = parseFloat(val)||0;
  if(v<=0){ toast('السعر لازم يكون أكبر من صفر'); render(); return; }
  mutate(()=>{ p.pricePerGram = v; p.totalCash = (Number(p.weight)||0) * v; }, 'اتعدل سعر المربع #'+p.no);
}
function setPendingReturnCode(id, val){
  const p = state.pendingSales.find(x=>x.id===id);
  if(!p || (p.status||'pending')!=='pending') return;
  mutate(()=>{ p.returnCode = String(val||'').trim(); p.note = p.returnCode; }, 'اتسجل كود المرتجع');
}
function sqRecalc(){
  const w=parseFloat((document.getElementById('sq-weight')||{}).value)||0;
  const p=parseFloat((document.getElementById('sq-price')||{}).value)||0;
  const t=document.getElementById('sq-total'); if(t) t.value=(w*p).toFixed(2);
}
function sqScan(){
  const el=document.getElementById('sq-scan');
  const piece = findPieceByScan(el? el.value : '');
  if(!piece){ toast('الباركود ده مش موجود'); if(el){el.value='';el.focus();} return; }
  if(piece.sold){ toast('القطعة دي متباعة قبل كده'); if(el){el.value='';el.focus();} return; }
  uiState.sqPieceId = piece.id;
  document.getElementById('sq-karat').value = piece.karat;
  document.getElementById('sq-weight').value = piece.weight;
  const priceEl = document.getElementById('sq-price');
  const typed = priceEl? (parseFloat(priceEl.value)||0) : 0;
  if(priceEl && !typed) priceEl.value = pieceSellMakingRate(piece).toFixed(2);
  sqRecalc();
  if(el) el.value = '';
  sqAdd();   // بيتسجل على طول من غير خطوة تانية
}
function sqAdd(){
  const party = sqCurrentParty();
  if(!party){ toast(uiState.sqKind==='customer'? 'ضيف عميل الأول' : 'ضيف تاجر الأول'); return; }
  const karat = parseFloat(document.getElementById('sq-karat').value)||BASE_KARAT;
  const weight = parseFloat(document.getElementById('sq-weight').value)||0;
  const price = parseFloat(document.getElementById('sq-price').value)||0;
  const rcEl = document.getElementById('sq-retcode');
  const returnCode = rcEl? rcEl.value.trim() : '';
  if(weight<=0||price<=0){ toast('أدخل الوزن والسعر'); return; }
  const piece = uiState.sqPieceId? state.pieces.find(x=>x.id===uiState.sqPieceId) : null;
  const kind = uiState.sqKind;
  refocusAfterRender('sq-scan');
  mutate(()=>{
    const rec = {id:uid('pd'), no:state.counters.pending++, date: uiState.sqDay||todayStr(),
      partyKind:kind, merchantId: kind==='merchant'? party.id : null, customerId: kind==='customer'? party.id : null,
      karat, weight, pricePerGram:price, totalCash: weight*price, note:returnCode, returnCode, status:'pending',
      pieceId: piece? piece.id : null, barcodeValue: piece? piece.barcodeValue : null,
      code: piece? pieceCode(piece) : null, itemName: piece? pieceLabel(piece) : null,
      classificationId: piece? pieceClassificationId(piece) : null};
    state.pendingSales.push(rec);
  }, 'تمت إضافة المربع');
  uiState.sqPieceId = null;
  render();
  ['sq-scan','sq-weight','sq-price','sq-retcode'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  const t=document.getElementById('sq-total'); if(t) t.value='0.00';
  const s=document.getElementById('sq-scan'); if(s) s.focus();
}

          <td class="center num big total-col" style="color:var(--green);">${fmtW(scrapStock21())}</td>
        </tr></tbody>
      </table>

    <div class="section-title">تأمين الوزن<div class="line"></div></div>
    <div class="grid grid-2">
      ${renderWeightCoverCard('تأمين وزن يومي', 'حركة النهارده '+fmtDateRep(today)+' — الوزن اللي المفروض أشتريه لتغطية اللي اتباع، والمكشوف النقدي', today, today)}
      ${renderWeightCoverCard('تأمين وزن عام', 'كل الفترات من بداية التشغيل لحد النهارده', '', '')}
    </div>
  `;
}


/* ============================= System Code — أسعار الذهب ============================= */
function goldCfg(){
  state.settings = state.settings || {};
  if(!state.settings.gold) state.settings.gold = {buy21:0, sell21:0, overrides:{}, updatedAt:''};
  if(!state.settings.gold.overrides) state.settings.gold.overrides = {};
  return state.settings.gold;
}
/* سعر الجرام لأي عيار: لو فيه سعر يدوي مسجّل بيتاخد، غير كده بيتحسب من عيار 21 */
function goldAutoPrice(base21, karat){ return (Number(base21)||0) * (Number(karat)||BASE_KARAT) / BASE_KARAT; }
/* سعر الشراء اتشال من الشاشة — بيرجع لسعر البيع لو مفيش سعر شراء متسجل */
function goldBuyPrice(karat){
  const g = goldCfg();
  const ov = g.overrides[karat];
  if(ov && ov.buy!=null && ov.buy!=='') return Number(ov.buy)||0;
  const base = Number(g.buy21)||Number(g.sell21)||0;
  return goldAutoPrice(base, karat);
}
function goldSellPrice(karat){
  const g = goldCfg();
  const ov = g.overrides[karat];
  if(ov && ov.sell!=null && ov.sell!=='') return Number(ov.sell)||0;
  return goldAutoPrice(g.sell21, karat);
}
function goldIsManual(karat, field){
  const ov = goldCfg().overrides[karat];
  return !!(ov && ov[field]!=null && ov[field]!=='');
}

function renderSystemCode(){
  const items = [
    {view:'gold-prices', icon:'💰', label:'أسعار الذهب', desc:'سعر بيع الجرام لعيار '+BASE_KARAT+' وباقي العيارات'},
    {view:'backup', icon:'💾', label:'نسخة احتياطية', desc:'نزّل نسخة من كل البيانات أو ارجع لنسخة قديمة'},
  ];
  return `
    <div class="pagehead">
      <div><h1>System Code</h1><p>إعدادات النظام الأساسية</p></div>
    </div>
    <div class="sc-grid">
      ${items.map(i=>`
        <a class="sc-card" href="${viewHref(i.view)}" onclick="return navClick(event,'${i.view}')">
          <span class="sc-ic">${i.icon}</span>
          <span><span class="sc-lbl">${esc(i.label)}</span><br><span class="muted" style="font-size:11.5px;">${esc(i.desc)}</span></span>
        </a>`).join('')}
    </div>`;
}

function renderGoldPrices(){
  const g = goldCfg();
  const karats = [...state.karats].sort((a,b)=>b-a);
  return `
    <div class="pagehead">
      <div><h1>أسعار الذهب</h1><p>حدد سعر بيع الجرام لعيار ${BASE_KARAT} — باقي العيارات بتتحسب تلقائيًا، والسعر بينزل لوحده في الفواتير وفي شاشة شراء الدهب الكسر</p></div>
      ${navBtn('scrap','⛃ شراء دهب كسر')}
    </div>

    <div class="card gp-main" data-enter-scope style="margin-bottom:18px;">
      <div class="gp-head">سعر الجرام — عيار ${BASE_KARAT} (السعر الأساسي)</div>
      <div class="gp-row">
        <div class="gp-box sell" style="grid-column:1 / -1;">
          <label>سعر البيع (سعر الجرام لعيار ${BASE_KARAT})</label>
          <input type="number" step="0.01" id="gp-sell21" value="${Number(g.sell21||0).toFixed(2)}">
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;">
        <button class="btn btn-gold" data-enter-submit onclick="saveGold21()">حفظ الأسعار</button>
        <span class="muted" style="font-size:12px;">
          ${g.updatedAt? ('آخر تحديث: '+fmtDateRep(g.updatedAt)+' — '+new Date(g.updatedAt).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})) : 'لسه مفيش أسعار محفوظة'}
        </span>
      </div>
    </div>

    <div class="section-title">باقي العيارات<div class="line"></div></div>
    <div class="hint" style="margin-bottom:10px;">
      السعر بيتحسب تلقائيًا: <b>سعر عيار ${BASE_KARAT} × (العيار ÷ ${BASE_KARAT})</b>.
      لو عايز عيار معيّن يكون بسعر مختلف اكتبه بإيدك وهيتقفل على القيمة دي لحد ما ترجّعه تلقائي.
    </div>
    <div class="tbl-wrap">
      <table class="grid-table">
        <thead><tr>
          <th style="width:130px;">العيار</th>
          <th class="right" style="width:220px;">سعر البيع</th>
          <th style="width:170px;">الحالة</th>
          <th style="width:130px;"></th>
        </tr></thead>
        <tbody>
        ${karats.map(k=>{
          const sp = goldSellPrice(k);
          const manual = goldIsManual(k,'sell');
          return `<tr ${k===BASE_KARAT?'style="background:#f3f7fc;"':''}>
            <td style="font-weight:800;">عيار ${k}${k===BASE_KARAT?' <span class="pill pill-gold">أساسي</span>':''}</td>
            <td><input type="number" step="0.01" value="${sp.toFixed(2)}" style="text-align:left;color:var(--green);font-weight:700;"
                 onchange="setGoldKaratPrice(${k},'sell',this.value)"></td>
            <td><span class="pill ${manual?'pill-gold':'pill-muted'}">${manual?'سعر يدوي':'تلقائي من ع'+BASE_KARAT}</span></td>
            <td>${manual? `<button class="btn btn-sm btn-ghost" onclick="clearGoldKaratPrice(${k})">رجّع تلقائي</button>` : '<span class="muted" style="font-size:11.5px;">—</span>'}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;
}
function saveGold21(){
  const sell = parseFloat(document.getElementById('gp-sell21').value)||0;
  if(sell<0){ toast('السعر مينفعش يكون بالسالب'); return; }
  mutate(()=>{
    const g = goldCfg();
    g.sell21 = sell; g.buy21 = sell; g.updatedAt = new Date().toISOString();
    // نسيب نسخة في goldPrices القديمة عشان أي حتة تانية بتقرا منها
    state.settings.goldPrices = state.settings.goldPrices || {};
    state.karats.forEach(k=>{ state.settings.goldPrices[k] = goldBuyPrice(k); });
  }, 'تم حفظ أسعار الذهب');
}
function setGoldKaratPrice(karat, field, val){
  mutate(()=>{
    const g = goldCfg();
    const auto = field==='buy'? goldAutoPrice(g.buy21, karat) : goldAutoPrice(g.sell21, karat);
    const v = parseFloat(val)||0;
    if(!g.overrides[karat]) g.overrides[karat] = {};
    // لو الرقم هو نفس الحساب التلقائي مانسجلوش كسعر يدوي
    if(Math.abs(v - auto) < 0.005) delete g.overrides[karat][field];
    else g.overrides[karat][field] = v;
    if(!Object.keys(g.overrides[karat]).length) delete g.overrides[karat];
    state.settings.goldPrices = state.settings.goldPrices || {};
    state.karats.forEach(k=>{ state.settings.goldPrices[k] = goldBuyPrice(k); });
  }, 'تم حفظ سعر عيار '+karat);
}
function clearGoldKaratPrice(karat){
  mutate(()=>{
    const g = goldCfg();
    delete g.overrides[karat];
    state.settings.goldPrices = state.settings.goldPrices || {};
    state.karats.forEach(k=>{ state.settings.goldPrices[k] = goldBuyPrice(k); });
  }, 'رجع عيار '+karat+' للحساب التلقائي');
}


/* ============================= System Code — النسخ الاحتياطي ============================= */
function stateSizeKB(){
  try{ return (new Blob([JSON.stringify(state)]).size/1024).toFixed(1); }catch(e){ return '—'; }
}
function dataCounts(){
  return [
    ['التجار', state.merchants.length],
    ['العملاء', state.customers.length],
    ['القطع', state.pieces.length],
    ['فواتير مشتريات', state.purchaseInvoices.length],
    ['فواتير مبيعات تجار', state.salesInvoices.length],
    ['فواتير مبيعات عملاء', state.customerSales.length],
    ['مرتجعات', state.merchantReturns.length + state.customerReturns.length],
    ['شراء كسر', state.scrapPurchases.length],
    ['قطع ذهب', state.goldLots.length],
    ['تصنيع', state.manufactures.length],
    ['تحصيل وتسديد', state.collections.length + state.payments.length],
  ];
}
function renderBackup(){
  return `
    <div class="pagehead">
      <div><h1>النسخ الاحتياطي واسترجاع البيانات</h1><p>نزّل نسخة من كل بيانات المحل، أو ارجع لنسخة قديمة — مهم جدًا قبل أي تحديث أو رفع على استضافة</p></div>
      ${navBtn('system-code','← رجوع لـ System Code')}
    </div>

    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="card" style="border-top:3px solid var(--green);">
        <div style="font-family:'Almarai';font-weight:800;font-size:15px;margin-bottom:6px;color:var(--green);">⬇ تنزيل نسخة احتياطية</div>
        <div class="muted" style="font-size:12.5px;line-height:1.8;margin-bottom:14px;">
          بينزّل ملف JSON فيه <b>كل</b> بيانات المحل (تجار، عملاء، فواتير، قطع، أسعار، خزينة).
          احفظه في مكان أمان — وده اللي هترجع منه لو حصل أي حاجة.
        </div>
        <button class="btn btn-gold" onclick="downloadBackup()">⬇ نزّل النسخة دلوقتي</button>
      </div>

      <div class="card" style="border-top:3px solid var(--red);">
        <div style="font-family:'Almarai';font-weight:800;font-size:15px;margin-bottom:6px;color:var(--red);">⬆ استرجاع من ملف</div>
        <div class="muted" style="font-size:12.5px;line-height:1.8;margin-bottom:14px;">
          اختار ملف نسخة احتياطية وهيستبدل <b>كل</b> البيانات الحالية بيه.
          <b style="color:var(--red);">تحذير:</b> البيانات الحالية هتتمسح — نزّل نسخة منها الأول.
        </div>
        <input type="file" id="bk-file" accept=".json,application/json" style="margin-bottom:10px;">
        <button class="btn btn-danger" onclick="restoreBackup()">⬆ استرجع البيانات</button>
      </div>
    </div>

    <div class="section-title">حالة البيانات الحالية<div class="line"></div></div>
    <div class="tbl-wrap" style="margin-bottom:18px;">
      <table class="grid-table">
        <tbody>
          ${dataCounts().map(r=>`<tr><td>${esc(r[0])}</td><td class="right num" style="font-weight:700;">${r[1]}</td></tr>`).join('')}
          <tr style="background:#f3f7fc;"><td style="font-weight:800;">حجم ملف البيانات</td><td class="right num" style="font-weight:800;">${stateSizeKB()} كيلوبايت</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" style="border-right:4px solid var(--gold-bright);">
      <div style="font-family:'Almarai';font-weight:800;font-size:14.5px;margin-bottom:10px;">📌 مهم لو رافع البرنامج على Railway أو أي استضافة</div>
      <div class="muted" style="font-size:12.8px;line-height:2;">
        الاستضافات بتمسح ملفات السيرفر مع كل رفع جديد. عشان البيانات تفضل:
        <br>١) في Railway افتح الـ Service → تبويب <b>Variables</b> وضيف متغير:
        <span class="mono" style="background:var(--panel-2);padding:2px 8px;border-radius:5px;">DATA_DIR = /data</span>
        <br>٢) من نفس الصفحة → <b>+ Volume</b> واعمل Volume وحط الـ Mount Path
        <span class="mono" style="background:var(--panel-2);padding:2px 8px;border-radius:5px;">/data</span>
        <br>٣) اعمل Redeploy — وبعد كده أي رفع جديد مش هيمس البيانات.
        <br><b>ولحد ما تظبط ده، نزّل نسخة احتياطية من هنا قبل كل رفع، وارجعها بعده.</b>
      </div>
    </div>`;
}
function downloadBackup(){
  try{
    const a = document.createElement('a');
    a.href = '/api/backup';
    a.download = 'goldshop-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('بيتم تنزيل النسخة الاحتياطية');
  }catch(e){ toast('تعذر التنزيل'); }
}
function restoreBackup(){
  const input = document.getElementById('bk-file');
  const file = input && input.files && input.files[0];
  if(!file){ toast('اختار ملف النسخة الاحتياطية الأول'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed = null;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast('الملف ده مش ملف نسخة احتياطية صالح'); return; }
    // بيقبل الملف الخام أو الشكل اللي بيرجع من /api/state وهو {"state":{...}}
    if(parsed && parsed.state && typeof parsed.state==='object') parsed = parsed.state;
    if(!parsed || typeof parsed!=='object' || !parsed.treasury || !parsed.counters){
      toast('الملف ده مش بيانات دفتر الصائغ'); return;
    }
    const info = 'الملف فيه: '+((parsed.merchants||[]).length)+' تاجر، '+((parsed.customers||[]).length)+' عميل، '
      + ((parsed.pieces||[]).length)+' قطعة، '+((parsed.purchaseInvoices||[]).length)+' فاتورة شراء.';
    showConfirmModal('هيتم استبدال كل البيانات الحالية بالنسخة دي. '+info+' متأكد؟', ()=>{
      state = Object.assign(defaultState(), parsed);
      if(!state.karats || !state.karats.length) state.karats=[...DEFAULT_KARATS];
      state.karats.forEach(k=>{ if(state.treasury.gold[k]===undefined) state.treasury.gold[k]=0; });
      if(!state.scrapStock) state.scrapStock = emptyGoldMap();
      state.counters = Object.assign({}, COUNTERS_DEF, state.counters||{});
      persist();
      closeModal();
      toast('تم استرجاع البيانات بنجاح');
      goto('home');
    }, {confirmLabel:'استرجع واستبدل'});
  };
  reader.readAsText(file);
}

/* ============================= INIT ============================= */
(async function init(){
  document.getElementById('main').innerHTML = '<div class="empty-state"><div class="ic">◆</div>جارِ التحميل...</div>';
  await loadState();
  const v = (location.hash||'').replace(/^#\/?/, '').trim();
  if(v) currentView = v;
  render();
})();
</script>
