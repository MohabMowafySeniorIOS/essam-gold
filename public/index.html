<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الصائغ | إدارة حسابات محل الذهب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root{
    --bg:#f2f5f9;
    --panel:#ffffff;
    --panel-2:#f5f7fa;
    --line:#dfe4ea;
    --gold:#17406e;          /* اللون الأساسي (كحلي) */
    --gold-bright:#1b5aa0;   /* كحلي فاتح للعناوين والأرقام */
    --gold-dim:#9fb4cc;
    --navy:#17406e;
    --navy-dark:#102c4d;
    --text:#1f2937;
    --muted:#5f6b7a;
    --muted-2:#98a2b3;
    --red:#c0392b;
    --red-bg:#fdecea;
    --green:#1e7e46;
    --green-bg:#e7f4ec;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    font-size:14px;
  }
  h1,h2,h3,.disp{font-family:'Almarai',sans-serif;}
  ::selection{background:#cfe0f2;color:#102c4d;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c6d0dc;border-radius:8px;}
  ::-webkit-scrollbar-track{background:#eef1f5;}

  #shell{display:flex;min-height:100vh;}

  /* SIDEBAR */
  #sidebar{
    width:250px;flex:none;
    background:linear-gradient(180deg,#17406e,#102c4d);
    border-left:1px solid #0d2440;
    padding:22px 14px;
    position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:4px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:0 8px 20px 8px;margin-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .brand .mark{
    width:38px;height:38px;border-radius:8px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Almarai',sans-serif;font-weight:800;color:#17406e;font-size:18px;
  }
  .brand .name{font-family:'Almarai',sans-serif;font-weight:800;font-size:16px;color:#fff;line-height:1.1;}
  .brand .sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;}

  .navgroup-label{font-size:10.5px;color:rgba(255,255,255,.45);letter-spacing:.5px;margin:14px 10px 6px;}
  .navitem{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:6px;cursor:pointer;
    color:rgba(255,255,255,.78);font-size:13.5px;font-weight:500;
    transition:.15s;border:1px solid transparent;
    user-select:none;
  }
  .navitem .ic{width:18px;text-align:center;font-size:15px;opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,.09);color:#fff;}
  .navitem.active{
    background:#fff;color:#17406e;border-color:#fff;font-weight:700;
  }
  .navitem .badge{
    margin-inline-start:auto;background:var(--red);color:#fff;font-size:10.5px;
    padding:1px 7px;border-radius:20px;font-weight:700;
  }

  /* MAIN */
  #main{flex:1;padding:26px 30px 60px;max-width:1500px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .pagehead h1{font-size:22px;margin:0 0 4px;color:var(--text);}
  .pagehead p{margin:0;color:var(--muted);font-size:13px;}

  .btn{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    padding:9px 16px;border-radius:8px;font-family:'Tajawal';font-weight:700;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--navy);color:var(--navy);}
  .btn-gold{
    background:var(--navy);color:#fff;border:1px solid var(--navy);
  }
  .btn-gold:hover{background:var(--navy-dark);border-color:var(--navy-dark);}
  .btn-danger{background:var(--red-bg);color:#a5281c;border:1px solid #f0c2bc;}
  .btn-danger:hover{border-color:var(--red);}
  .btn-ghost{background:transparent;border:1px solid var(--line);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* CARDS / GRID */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

  .card{
    background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;
    box-shadow:0 1px 2px rgba(16,44,77,.05);
  }
  .stat .label{color:var(--muted);font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .stat .value{font-family:'Almarai';font-size:24px;font-weight:800;color:var(--gold-bright);}
  .stat .value small{font-size:13px;color:var(--muted);font-weight:400;}
  .stat.neg .value{color:var(--red);}
  .stat.pos .value{color:var(--green);}

  .section-title{font-family:'Almarai';font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;color:var(--text);}
  .section-title .line{flex:1;height:1px;background:var(--line);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:#43536a;font-weight:700;font-size:11.5px;
    padding:10px;border-bottom:1px solid #d3dae3;background:#eef2f7;
  }
  tbody td{padding:10px;border-bottom:1px solid #eef1f5;color:var(--text);}
  tbody tr:hover{background:#f6f9fd;}
  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;box-shadow:0 1px 2px rgba(16,44,77,.05);}
  .empty-row td{text-align:center;color:var(--muted-2);padding:30px;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill-gold{background:#e8f0fa;color:var(--navy);border:1px solid #c3d7ee;}
  .pill-green{background:var(--green-bg);color:var(--green);border:1px solid #bfe0cc;}
  .pill-red{background:var(--red-bg);color:#a5281c;border:1px solid #f0c2bc;}
  .pill-muted{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);}

  .mono{font-family:'Almarai';}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .right{text-align:left;}

  /* FORMS */
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  input,select,textarea{
    width:100%;background:#fff;border:1px solid #cbd3dd;color:var(--text);
    padding:9px 11px;border-radius:6px;font-family:'Tajawal';font-size:13.5px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,64,110,.10);}
  input::placeholder{color:#a9b2be;}
  .field{margin-bottom:13px;}
  .row{display:flex;gap:12px;}
  .row>*{flex:1;}

  .modal-bg{
    position:fixed;inset:0;background:rgba(16,32,52,.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px;
    box-shadow:0 20px 60px rgba(16,44,77,.22);
  }
  .modal.wide{max-width:760px;}
  .modal h2{margin:0 0 4px;font-size:17px;}
  .modal .hint{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

  .item-row{
    display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;
    padding:10px;background:var(--panel-2);border-radius:8px;margin-bottom:8px;border:1px solid var(--line);
  }
  .item-row .rm{color:var(--red);cursor:pointer;font-size:18px;padding:8px;text-align:center;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted-2);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.6;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy);border:1px solid var(--navy-dark);color:#fff;
    padding:11px 20px;border-radius:8px;font-size:13px;z-index:100;
    box-shadow:0 8px 24px rgba(16,44,77,.3);animation:up .25s ease;
  }
  @keyframes up{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .kv-inline{display:flex;gap:6px;flex-wrap:wrap;}
  .kv-chip{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;}
  .kv-chip b{color:var(--navy);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy);border-color:var(--navy);}

  .searchbar{display:flex;gap:10px;margin-bottom:14px;}
  .searchbar input{max-width:280px;}

  /* ============ فلاتر + جداول عريضة ============ */
  .filterbar{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 1px 2px rgba(16,44,77,.05);
  }
  .fb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .filterbar .f{display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .filterbar .f.auto{min-width:auto;flex:0 0 auto;}
  .filterbar .f > span{font-size:10.5px;color:var(--muted-2);letter-spacing:.3px;}
  .filterbar input,.filterbar select{padding:7px 10px;font-size:12.5px;}
  .filterbar .spacer{flex:1;}

  table.tl-table{min-width:900px;}
  table.tl-table td,table.tl-table th{white-space:nowrap;}
  table.tl-table td:nth-child(4){white-space:normal;}
  tfoot td{
    padding:11px 10px;font-weight:800;font-family:'Almarai';font-size:13px;
    border-top:2px solid #cbd5e1;background:#eef2f7;color:var(--navy);
  }

  /* ============ تقرير حسابات النقدية (شكل التقرير الأبيض) ============ */
  #main.sheet-white{background:#fff;padding:0;max-width:none;}
  .report-sheet{
    background:#fff;color:#333;
    padding:24px 30px 60px;min-height:100vh;
    font-family:'Tajawal',sans-serif;direction:rtl;
  }
  .report-sheet .rep-filters{display:flex;flex-direction:column;align-items:flex-start;gap:9px;margin-bottom:20px;}
  .report-sheet .rep-frow{display:flex;align-items:center;gap:12px;}
  .report-sheet .rep-frow > label{
    order:2;width:90px;margin:0;font-size:13.5px;color:#444;font-weight:500;text-align:right;
  }
  .report-sheet .rep-frow > input,
  .report-sheet .rep-frow > select{
    order:1;width:200px;background:#fff;border:1px solid #ccc;border-radius:4px;
    color:#333;font-size:13px;padding:6px 9px;font-family:'Tajawal',sans-serif;
  }
  .report-sheet .rep-frow > input[readonly]{background:#f7f7f7;color:#555;text-align:left;}
  .report-sheet .rep-frow > input:focus,.report-sheet .rep-frow > select:focus{border-color:#17406e;}

  .report-sheet .rep-bar{
    background:#17406e;color:#fff;font-size:14.5px;font-weight:700;
    padding:11px 16px;margin:0 0 10px;font-family:'Almarai',sans-serif;
  }
  .report-sheet .rep-colsbar{position:relative;margin-bottom:8px;}
  .report-sheet .rep-colsbtn{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#777;cursor:pointer;user-select:none;
  }
  .report-sheet .rep-colsbtn:hover{color:#17406e;}
  .report-sheet .rep-colsmenu{
    position:absolute;top:22px;right:0;z-index:20;background:#fff;border:1px solid #ccc;
    border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:8px 10px;min-width:150px;
  }
  .report-sheet .rep-colsmenu label{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:#333;margin:0;padding:4px 0;cursor:pointer;font-weight:400;
  }
  .report-sheet .rep-colsmenu input{width:auto;margin:0;}

  .report-sheet table.rep-table{width:100%;border-collapse:collapse;font-size:13px;}
  .report-sheet table.rep-table thead th{
    background:#fff;color:#555;font-weight:700;font-size:12.5px;text-align:right;
    padding:9px 10px;border-bottom:1px solid #d5d5d5;white-space:nowrap;
  }
  .report-sheet table.rep-table tbody td{
    padding:8px 10px;border-bottom:1px solid #ececec;color:#333;white-space:nowrap;
  }
  .report-sheet table.rep-table tbody td.stmt{white-space:normal;}
  .report-sheet table.rep-table tbody tr:hover{background:#f6f9fd;}
  .report-sheet table.rep-table .no{color:#2563a8;}
  .report-sheet table.rep-table .amt{font-variant-numeric:tabular-nums;text-align:right;}
  .report-sheet .rep-empty{text-align:center;color:#999;padding:34px;font-size:13px;}

  .report-sheet .rep-totals{display:flex;justify-content:flex-start;margin-top:16px;}
  .report-sheet .rep-totbox{display:flex;flex-direction:column;gap:4px;}
  .report-sheet .rep-totrow{display:flex;align-items:center;gap:10px;}
  .report-sheet .rep-totrow > span{order:2;width:95px;font-size:13px;color:#444;text-align:right;}
  .report-sheet .rep-totrow > b{
    order:1;width:190px;border:1px solid #ccc;border-radius:4px;background:#fff;
    padding:5px 9px;font-size:13px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;color:#222;
  }
  @media print{
    .report-sheet{margin:0;padding:0;}
    .report-sheet .rep-filters,.report-sheet .rep-colsbar{display:none;}
  }

  #print-area{position:fixed;left:-99999px;top:0;background:#fff;padding:20px;}
  @media print{
    body > *:not(#print-area){display:none !important;}
    #print-area{position:static;left:0;display:flex !important;flex-wrap:wrap;gap:14px;}
  }
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="save-indicator" style="position:fixed;bottom:14px;left:14px;font-size:11px;color:var(--muted);z-index:60;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;"></div>

<script>
/* ============================= STATE ============================= */
const DEFAULT_KARATS = [24,22,21,18,14,9];
let state = null;
let currentView = 'dashboard';
let uiState = { pendingTab:'pending', txtSearch:'', cpTab:'all', summaryKarat: 21, catalogTab:'classifications', pbShowNewCode:false,
  repFrom:'', repTo:'', repKind:'', repColsOpen:false,
  stmtMerchantId:null, stmtFrom:'', stmtTo:'', stmtOpen:{},
  repCols:{date:true, in:true, out:true, bal:true, kind:true, merchant:true, stmt:true, no:true} };

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function emptyGoldMap(){ const m={}; DEFAULT_KARATS.forEach(k=>m[k]=0); return m; }

function defaultState(){
  return {
    karats: [...DEFAULT_KARATS],
    treasury: { cash:0, gold: emptyGoldMap() },
    merchants: [],
    purchaseInvoices: [],
    salesInvoices: [],
    pendingSales: [],
    settlements: [],
    transfers: [],
    scrapPurchases: [],
    cashMoves: [],
    collections: [],
    payments: [],
    itemTypes: [],
    classifications: [],
    priceCategories: [],
    products: [],
    pieces: [],
    counters: { merchant:1, purchase:1, sale:1, pending:1, settlement:1, transfer:1, scrap:1, collection:1, payment:1, itemType:1, classification:1, priceCategory:1, product:1, piece:1 }
  };
}

async function loadState(){
  try{
    const r = await fetch('/api/state');
    const data = await r.json();
    if(data && data.state){
      const parsed = data.state;
      state = Object.assign(defaultState(), parsed);
      if(!state.karats || !state.karats.length) state.karats=[...DEFAULT_KARATS];
      state.karats.forEach(k=>{ if(state.treasury.gold[k]===undefined) state.treasury.gold[k]=0; });
      if(!state.collections) state.collections=[];
      if(!state.payments) state.payments=[];
      if(!state.itemTypes) state.itemTypes=[];
      if(!state.classifications) state.classifications=[];
      if(!state.priceCategories) state.priceCategories=[];
      if(!state.products) state.products=[];
      if(!state.pieces) state.pieces=[];
      const cdef = { merchant:1, purchase:1, sale:1, pending:1, settlement:1, transfer:1, scrap:1, collection:1, payment:1, itemType:1, classification:1, priceCategory:1, product:1, piece:1 };
      state.counters = Object.assign(cdef, state.counters||{});
    } else {
      state = defaultState();
    }
  }catch(e){
    console.error('load failed, starting fresh', e);
    state = defaultState();
  }
}
let saveTimer=null;
let saveIndicatorTimer=null;
function setSaveIndicator(text){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.textContent = text;
  clearTimeout(saveIndicatorTimer);
  if(text) saveIndicatorTimer = setTimeout(()=>{ el.textContent=''; }, 1600);
}
function persist(){
  clearTimeout(saveTimer);
  setSaveIndicator('جارِ الحفظ...');
  saveTimer=setTimeout(async ()=>{
    try{
      const r = await fetch('/api/state', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state)
      });
      if(!r.ok) throw new Error('save failed: '+r.status);
      setSaveIndicator('تم الحفظ ✓');
    }catch(e){
      console.error('save failed', e);
      setSaveIndicator('تعذر الحفظ! تحقق من تشغيل السيرفر');
    }
  }, 250);
}
function mutate(fn, msg){
  fn();
  persist();
  render();
  if(msg) toast(msg);
}

/* ============================= HELPERS ============================= */
function fmtCash(n){
  n = Number(n)||0;
  const s = Math.abs(n).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'') + s + ' جنيه';
}
function fmtW(n){
  n = Number(n)||0;
  return n.toLocaleString('ar-EG',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' جم';
}
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function merchantById(id){ return state.merchants.find(m=>m.id===id); }
function merchantName(id){ const m=merchantById(id); return m? (m.name+' ('+m.code+')') : '—'; }

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.innerHTML=''; root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2400);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function showConfirmModal(message, onYes, opts){
  opts = opts || {};
  const root=document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:420px;">
        <h2>${esc(opts.title || 'تأكيد العملية')}</h2>
        <div class="hint" style="margin-bottom:0;">${esc(message)}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
          <button class="btn ${opts.danger===false?'btn-gold':'btn-danger'}" id="confirm-yes-btn">${esc(opts.confirmLabel || 'تأكيد')}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirm-yes-btn').onclick = function(){ onYes(); };
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function goldMapTotalsRow(map){
  return state.karats.map(k=>({k, w:map[k]||0})).filter(x=>x.w!==0);
}

/* ============================= NAV ============================= */
const NAV = [
  {group:'الرئيسية', items:[
    {id:'dashboard', label:'الخزينة', icon:'◆'},
    {id:'cash-report', label:'تقرير حسابات النقدية', icon:'▤'},
    {id:'scrap', label:'شراء دهب كسر', icon:'⛃'},
  ]},
  {group:'الأصناف', items:[
    {id:'catalog', label:'الأصناف والمنتجات', icon:'▤'},
    {id:'pieces', label:'باركود القطع', icon:'▥'},
  ]},
  {group:'التجار', items:[
    {id:'merchants', label:'التجار وأكوادهم', icon:'⌘'},
    {id:'merchant-summary', label:'إجمالي أرصدة التجار', icon:'≡'},

  state.payments.forEach(i=>items.push({date:i.date,type:'تسديد لتاجر',desc:merchantName(i.merchantId),amt:i.cash||0,tone:'red'}));
  return items.sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,10);
}

function treasuryLedgerEntries(){
  const items = [];
  state.cashMoves.forEach(i=>{
    if(i.dir==='in') items.push({date:i.date, type:'إيداع نقدية', desc:i.note||'حركة يدوية', in:i.amount, out:0});
    else items.push({date:i.date, type:'سحب نقدية', desc:i.note||'حركة يدوية', in:0, out:i.amount});
  });
  state.purchaseInvoices.forEach(i=>{ if(i.amountPaidNow>0) items.push({date:i.date, type:'دفع فاتورة شراء', desc:merchantName(i.merchantId), in:0, out:i.amountPaidNow}); });
  state.salesInvoices.forEach(i=>{ if(i.amountPaidNow>0) items.push({date:i.date, type:'تحصيل فاتورة بيع', desc:merchantName(i.merchantId), in:i.amountPaidNow, out:0}); });
  state.scrapPurchases.forEach(i=>{ if(i.totalCash>0) items.push({date:i.date, type:'شراء دهب كسر', desc:i.customerName||'عميل', in:0, out:i.totalCash}); });
  state.collections.forEach(i=>{ if(i.cashMode==='treasury' && i.cash>0) items.push({date:i.date, type:'تحصيل من تاجر', desc:merchantName(i.merchantId), in:i.cash, out:0}); });
  state.payments.forEach(i=>{ if(i.cashMode==='treasury' && i.cash>0) items.push({date:i.date, type:'تسديد لتاجر', desc:merchantName(i.merchantId), in:0, out:i.cash}); });
  return items.sort((a,b)=> new Date(b.date)-new Date(a.date));
}

/* ============ تقرير حسابات النقدية ============ */
function fmtDateRep(d){
  const dt = new Date(d);
  if(isNaN(dt)) return '';
  return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+dt.getFullYear();
}
function fmtNum2(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function cashReportEntries(){
  const items = [];
  const add = (date, kind, merchant, statement, amount)=>{
    amount = Number(amount)||0;
    if(amount<=0) return;
    items.push({date:String(date).slice(0,10), kind, merchant:merchant||'', statement, amount});
  };
  state.cashMoves.forEach(i=>{
    if(i.dir==='in') add(i.date,'in','', i.note? ('ايداع نقديه — '+i.note) : 'ايداع نقديه بالخزينه', i.amount);
    else add(i.date,'out','', i.note? ('سحب نقدي — '+i.note) : 'سحب نقدي من الخزينه', i.amount);
  });
  state.salesInvoices.forEach(i=> add(i.date,'in', merchantName(i.merchantId), 'فاتوره بيع مدفوعه كاش رقم '+i.no, i.amountPaidNow));
  state.purchaseInvoices.forEach(i=> add(i.date,'out', merchantName(i.merchantId), 'أجر فاتوره مشتريات رقم '+i.no, i.amountPaidNow));
  state.scrapPurchases.forEach(i=> add(i.date,'out','', 'شراء دهب كسر — '+(i.customerName||'عميل'), i.totalCash));
  state.collections.forEach(i=>{ if(i.cashMode==='treasury') add(i.date,'in', merchantName(i.merchantId), 'تحصيل نقدي من تاجر'+(i.note? ' — '+i.note:''), i.cash); });
  state.payments.forEach(i=>{ if(i.cashMode==='treasury') add(i.date,'out', merchantName(i.merchantId), 'تسديد نقدي لتاجر'+(i.note? ' — '+i.note:''), i.cash); });
  return items
    .map((e,i)=>Object.assign(e,{_i:i}))
    .sort((a,b)=>{ const d=new Date(a.date)-new Date(b.date); return d!==0? d : a._i-b._i; });
}

function recalcScrapTotal(){
  const w = parseFloat(document.getElementById('sc-weight').value)||0;
  const p = parseFloat(document.getElementById('sc-price').value)||0;
  document.getElementById('sc-total').value = (w*p).toFixed(2);
}
document.addEventListener('input', (e)=>{
  if(e.target && e.target.id==='sc-weight') recalcScrapTotal();
});
function submitScrap(){
  const karat = parseFloat(document.getElementById('sc-karat').value);
  const weight = parseFloat(document.getElementById('sc-weight').value)||0;
  const price = parseFloat(document.getElementById('sc-price').value)||0;
  const name = document.getElementById('sc-name').value.trim();
  if(weight<=0 || price<=0){ toast('أدخل الوزن والسعر بشكل صحيح'); return; }
  const total = weight*price;
  mutate(()=>{
    state.treasury.cash -= total;
    state.treasury.gold[karat] = (state.treasury.gold[karat]||0) + weight;
    state.scrapPurchases.push({id:uid('scrap'), no:state.counters.scrap++, date:todayStr(), customerName:name, karat, weight, pricePerGram:price, totalCash:total});
  }, 'تم تسجيل عملية الشراء');
  closeModal();
}

  const pc = state.priceCategories.find(x=>x.id===product.priceCategoryId);
  return [it?it.name:'—', cl?cl.name:'—', pc?pc.name:'—'].join(' / ');

/* تحويل كل أوزان الذهب لعيار 21 المكافئ: وزن × (العيار ÷ 21) */
const BASE_KARAT = 21;
function goldTo21(balanceGold){
  let total = 0;
  state.karats.forEach(k=>{
    const w = Number(balanceGold[k])||0;
    if(w) total += w * (k / BASE_KARAT);
  });
  return total;
}
function renderMerchantSummary(){
  const rows = [...state.merchants].sort((a,b)=> a.name.localeCompare(b.name,'ar'));
  const totalGold = rows.reduce((s,m)=> s + goldTo21(m.balanceGold), 0);
  const totalCash = rows.reduce((s,m)=> s + (m.balanceCash||0), 0);

  function goldCell(v){
    v = v||0;
    if(v===0) return `<span class="pill pill-muted">متزن</span>`;
    const tone = v>0? 'pill-green' : 'pill-red';
    const label = v>0? 'لنا' : 'علينا';
    return `<span class="pill ${tone}">${label} · ${Math.abs(v).toFixed(3)} جم</span>`;
  }
  function cashCell(v){
    v = v||0;
    if(v===0) return `<span class="pill pill-muted">متزن</span>`;
    const tone = v>0? 'pill-green' : 'pill-red';
    const label = v>0? 'لنا' : 'علينا';
    return `<span class="pill ${tone}">${label} · ${fmtCash(Math.abs(v))}</span>`;
  }

  return `

function submitMerchant(id){
  const name = document.getElementById('mc-name').value.trim();
  const code = document.getElementById('mc-code').value.trim();
  const phone = document.getElementById('mc-phone').value.trim();
  const defaultKarat = parseFloat(document.getElementById('mc-karat').value);
  if(!name || !code){ toast('أدخل الاسم والكود'); return; }
  if(state.merchants.some(m=>m.code===code && m.id!==id)){ toast('هذا الكود مستخدم بالفعل'); return; }
  mutate(()=>{
    if(id){
      const m = merchantById(id);
      m.name=name; m.code=code; m.phone=phone; m.defaultKarat=defaultKarat;
    } else {
      state.merchants.push({id:uid('mer'), code, name, phone, defaultKarat, balanceCash:0, balanceGold: emptyGoldMap()});
      state.counters.merchant++;
    }
  }, id?'تم حفظ بيانات التاجر':'تمت إضافة التاجر');
  closeModal();
}
function deleteMerchant(id){
  showConfirmModal('هل تريد حذف هذا التاجر؟ لن يتم حذف الفواتير المرتبطة به.', ()=>{
    mutate(()=>{ state.merchants = state.merchants.filter(m=>m.id!==id); }, 'تم حذف التاجر');
    closeModal();
  }, {confirmLabel:'حذف التاجر'});
}

function goldMapLabel(map){
  const rows = state.karats.map(k=>({k, w:map[k]||0})).filter(x=>x.w!==0);
  if(!rows.length) return '';
  return rows.map(x=>'ع'+x.k+': '+x.w.toFixed(3)).join('، ');
}

/* كل حركة بتأثر على حساب التاجر: cash = التغير في رصيده النقدي، gold = خريطة تغير أوزانه */
function merchantStatementEntries(merchantId){
  const out = [];
  const g = (k,w)=>{ const m={}; if(k && w) m[k]=w; return m; };

  state.purchaseInvoices.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const making = (i.totalMaking!=null? i.totalMaking : i.totalCash)||0;
    const weight = (i.totalWeight!=null? i.totalWeight : (i.items||[]).reduce((s,x)=>s+x.weight,0))||0;
    const byKarat = {};
    (i.items||[]).forEach(x=>{ byKarat[x.karat] = (byKarat[x.karat]||0) - x.weight; });
    out.push({
      date:i.date, kind:'purchase', key:'pi_'+i.id, ref:'#'+i.no,
      type:'فاتورة مشتريات', desc:'شراء بالوزن — '+((i.items||[]).length)+' قطعة، إجمالي '+weight.toFixed(3)+' جم',
      cash: -(making - (i.amountPaidNow||0)),
      gold: i.settleMode==='weight'? byKarat : {},
      inv: i
    });
  });
  state.salesInvoices.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const byKarat = {};
    if(i.settleMode==='weight') (i.items||[]).forEach(x=>{ byKarat[x.karat] = (byKarat[x.karat]||0) + x.weight; });
    const w = (i.totalWeight!=null? i.totalWeight : (i.items||[]).reduce((s,x)=>s+x.weight,0))||0;
    out.push({date:i.date, kind:'sale', key:'si_'+i.id, ref:'#'+i.no, type:'فاتورة مبيعات',
      desc: i.settleMode==='weight'
        ? ('بيع بالوزن — '+((i.items||[]).length)+' قطعة، إجمالي '+w.toFixed(3)+' جم، أجر '+fmtCash(i.totalMaking||i.totalCash||0))
        : ('بيع لتاجر — إجمالي '+fmtCash(i.totalCash)+(i.amountPaidNow? ' · مدفوع '+fmtCash(i.amountPaidNow):'')),
      cash: (i.totalCash||0) - (i.amountPaidNow||0), gold: byKarat, inv:i, isSale:true});
  });
  state.collections.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const gold={}; (i.items||[]).forEach(x=>{ gold[x.karat]=(gold[x.karat]||0)-x.weight; });
    out.push({date:i.date, kind:'collect', key:'co_'+i.id, ref:'#'+i.no, type:'تحصيل من تاجر',
      desc:[(i.cash? 'نقدية '+fmtCash(i.cash)+(i.cashMode==='treasury'?' (خزينة)':' (على الحساب)') : ''), (goldMapLabel(gold)? 'ذهب '+goldMapLabel(gold):''), (i.note||'')].filter(Boolean).join(' · '),
      cash: -(i.cash||0), gold});
  });
  state.payments.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const gold={}; (i.items||[]).forEach(x=>{ gold[x.karat]=(gold[x.karat]||0)+x.weight; });
    out.push({date:i.date, kind:'pay', key:'pa_'+i.id, ref:'#'+i.no, type:'تسديد لتاجر',
      desc:[(i.cash? 'نقدية '+fmtCash(i.cash)+(i.cashMode==='treasury'?' (خزينة)':' (على الحساب)') : ''), (goldMapLabel(gold)? 'ذهب '+goldMapLabel(gold):''), (i.note||'')].filter(Boolean).join(' · '),
      cash: (i.cash||0), gold});
  });
  state.settlements.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const sign = i.type==='debit'? 1 : -1;
    out.push({date:i.date, kind:'settle', key:'st_'+i.id, ref:'#'+i.no, type:'تسوية حساب',
      desc:(i.type==='debit'?'قيد علي التاجر':'قيد لصالح التاجر')+(i.note? ' · '+i.note:''),
      cash: sign*(i.cash||0), gold: g(i.karat, sign*(i.weight||0))});
  });
  state.transfers.filter(i=>i.fromMerchantId===merchantId || i.toMerchantId===merchantId).forEach(i=>{
    const isFrom = i.fromMerchantId===merchantId;
    const sign = isFrom? -1 : 1;
    out.push({date:i.date, kind:'transfer', key:'tr_'+i.id, ref:'#'+i.no, type:'تحويل رصيد',
      desc: isFrom? ('تحويل إلى '+merchantName(i.toMerchantId)) : ('تحويل من '+merchantName(i.fromMerchantId)),
      cash: sign*(i.cash||0), gold: g(i.karat, sign*(i.weight||0))});
  });
  state.pendingSales.filter(p=>p.merchantId===merchantId && p.status==='confirmed').forEach(p=>{
    out.push({date:p.confirmedDate||p.date, kind:'pending', key:'pd_'+p.id, ref:'#'+p.no, type:'قطعة معلّقة مؤكدة',
      desc:'عيار '+p.karat+' · '+p.weight+' جم × '+fmtCash(p.pricePerGram), cash:(p.totalCash||0), gold:{}});
  });

  return out.map((e,i)=>Object.assign(e,{date:String(e.date).slice(0,10), _i:i}))
    .sort((a,b)=>{ const d=new Date(a.date)-new Date(b.date); return d!==0? d : a._i-b._i; });
}

function renderMerchantStatement(){
  if(!state.merchants.length){
    return `<div class="pagehead"><div><h1>كشف حساب تاجر</h1><p>اختر تاجرًا لعرض كل حركاته وتفاصيل فواتيره</p></div></div>

  }
  let m = merchantById(uiState.stmtMerchantId);
  if(!m){ m = state.merchants[0]; uiState.stmtMerchantId = m.id; }

  const from = uiState.stmtFrom||'', to = uiState.stmtTo||'';
  const all = merchantStatementEntries(m.id);

  let openCash = 0; const openGold = {};
  if(from) all.forEach(e=>{ if(e.date < from){ openCash += e.cash; Object.entries(e.gold).forEach(([k,v])=>openGold[k]=(openGold[k]||0)+v); } });

  let bal = openCash; const gbal = Object.assign({}, openGold);
  const rows = [];
  all.forEach(e=>{
    if(from && e.date < from) return;
    if(to && e.date > to) return;
    bal += e.cash;
    Object.entries(e.gold).forEach(([k,v])=>gbal[k]=(gbal[k]||0)+v);
    rows.push(Object.assign({}, e, {bal, gbal21: goldTo21(gbal)}));
  });

  const totalDr = rows.reduce((s,r)=> s + (r.cash>0? r.cash:0), 0);
  const totalCr = rows.reduce((s,r)=> s + (r.cash<0? -r.cash:0), 0);
  const totalGoldIn = rows.reduce((s,r)=> s + Object.entries(r.gold).reduce((a,[k,v])=> a + (v>0? v*(k/BASE_KARAT):0),0), 0);
  const totalGoldOut = rows.reduce((s,r)=> s + Object.entries(r.gold).reduce((a,[k,v])=> a + (v<0? -v*(k/BASE_KARAT):0),0), 0);

  const cashNow = m.balanceCash||0, gold21Now = goldTo21(m.balanceGold);
  const tone = v => v>0? 'pos' : v<0? 'neg' : '';
  const owe = v => v===0? 'متزن' : (v>0? 'لنا: ' : 'علينا: ');

  return `
    <div class="pagehead">
      <div><h1>كشف حساب تاجر</h1><p>كل حركات التاجر بالترتيب مع الرصيد بعد كل حركة — وتفاصيل كل فاتورة مشتريات بالقطع</p></div>

    </div>

      <div class="fb-row">

          <select onchange="uiState.stmtMerchantId=this.value;uiState.stmtOpen={};render();">
            ${state.merchants.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)} (${esc(x.code)})</option>`).join('')}
          </select>
        </div>
        <div class="f"><span>من تاريخ</span><input type="date" value="${esc(from)}" onchange="uiState.stmtFrom=this.value;render();"></div>
        <div class="f"><span>إلى تاريخ</span><input type="date" value="${esc(to)}" onchange="uiState.stmtTo=this.value;render();"></div>
        <div class="spacer"></div>
        <div class="f auto"><span>&nbsp;</span><button class="btn btn-ghost btn-sm" onclick="uiState.stmtFrom='';uiState.stmtTo='';render();">↺ كل الفترات</button></div>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="card stat ${tone(cashNow)}"><div class="label"><span>الرصيد النقدي الحالي</span></div>
        <div class="value">${cashNow===0?'متزن': owe(cashNow)+fmtCash(Math.abs(cashNow))}</div></div>
      <div class="card stat ${tone(gold21Now)}"><div class="label"><span>رصيد الذهب الحالي (بعيار ${BASE_KARAT})</span></div>
        <div class="value">${gold21Now===0?'متزن': owe(gold21Now)+Math.abs(gold21Now).toFixed(3)+' جم'}</div></div>
      <div class="card stat"><div class="label"><span>إجمالي مدين (لنا)</span></div><div class="value">${fmtCash(totalDr)}</div></div>
      <div class="card stat"><div class="label"><span>إجمالي دائن (علينا)</span></div><div class="value">${fmtCash(totalCr)}</div></div>
    </div>

    <div class="kv-inline" style="margin-top:12px;">
      <div class="kv-chip">عدد الحركات: <b>${rows.length}</b></div>
      <div class="kv-chip">رصيد أول المدة: <b>${openCash===0?'متزن': owe(openCash)+fmtCash(Math.abs(openCash))}</b></div>
      <div class="kv-chip">ذهب داخل لنا (ع${BASE_KARAT}): <b>${totalGoldIn.toFixed(3)} جم</b></div>
      <div class="kv-chip">ذهب علينا (ع${BASE_KARAT}): <b>${totalGoldOut.toFixed(3)} جم</b></div>
    </div>

    <div class="section-title">حركات الحساب<div class="line"></div></div>

      <table class="tl-table">

            <th style="width:80px;"></th>
          </tr>
        </thead>
        <tbody>
          ${rows.length? rows.map(r=>{
            const goldTxt = goldMapLabel(r.gold);
            const opened = !!uiState.stmtOpen[r.key];
            return `
            <tr>
              <td class="muted num">${fmtDateRep(r.date)}</td>

              <td class="num" style="font-size:12px;color:${goldTxt?'var(--text)':'var(--muted-2)'};">${goldTxt||'—'}</td>
              <td>${(r.kind==='purchase' || (r.kind==='sale' && r.inv && r.inv.settleMode==='weight'))? `<button class="btn btn-sm btn-ghost" onclick="stmtToggle('${r.key}')">${opened?'إخفاء':'تفاصيل'}</button>`:''}</td>

function printMerchantStatement(){
  const m = merchantById(uiState.stmtMerchantId);
  if(!m){ toast('اختر تاجرًا أولاً'); return; }
  const from = uiState.stmtFrom||'', to = uiState.stmtTo||'';
  const all = merchantStatementEntries(m.id);
  let openCash = 0;
  if(from) all.forEach(e=>{ if(e.date<from) openCash += e.cash; });
  let bal = openCash; const rows=[];
  all.forEach(e=>{
    if(from && e.date<from) return;
    if(to && e.date>to) return;
    bal += e.cash;
    rows.push(Object.assign({},e,{bal}));
  });
  if(!rows.length){ toast('لا توجد حركات لطباعتها'); return; }
  const nf = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const period = (!from && !to)? 'كل الفترات' : ('من '+(from? fmtDateRep(from):'البداية')+' إلى '+(to? fmtDateRep(to):'اليوم'));
  const totalDr = rows.reduce((s,r)=>s+(r.cash>0?r.cash:0),0);
  const totalCr = rows.reduce((s,r)=>s+(r.cash<0?-r.cash:0),0);
  const area = document.getElementById('report-print-area');
  area.innerHTML = `
    <div class="rp">

        <div class="rp-card"><b>إجمالي دائن</b><span>${nf(totalCr)}</span></div>
        <div class="rp-card"><b>الرصيد آخر المدة</b><span>${nf(Math.abs(bal))} ${bal>=0?'(لنا)':'(علينا)'}</span></div>
      </div>
      <table>
        <thead><tr><th>التاريخ</th><th>رقم</th><th>نوع الحركة</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th><th>حركة الذهب</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td>${fmtDateRep(r.date)}</td><td>${esc(r.ref)}</td><td>${esc(r.type)}</td><td>${esc(r.desc)}</td>
            <td>${r.cash>0? nf(r.cash):'—'}</td><td>${r.cash<0? nf(-r.cash):'—'}</td>
            <td>${nf(Math.abs(r.bal))} ${r.bal>=0?'(لنا)':'(علينا)'}</td>
            <td>${esc(goldMapLabel(r.gold)||'—')}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr><td colspan="4">الإجمالي</td><td>${nf(totalDr)}</td><td>${nf(totalCr)}</td><td>${nf(Math.abs(bal))} ${bal>=0?'(لنا)':'(علينا)'}</td><td></td></tr></tfoot>
      </table>
      <div class="rp-foot"><span>دفتر الصائغ — كشف حساب تاجر</span><span>التوقيع: ................................</span></div>
    </div>`;
  document.body.classList.add('print-report');
  setTimeout(()=>{ window.print(); setTimeout(()=>{ document.body.classList.remove('print-report'); area.innerHTML=''; },500); }, 80);
}

/* ============================= فواتير مشتريات / مبيعات (مشترك) ============================= */
function invoiceItemsTemplate(prefix, items){
  items = items && items.length? items : [{karat:state.karats[0], weight:'', price:'', making:'', productId:''}];
  const withProduct = prefix==='purchase';
  const cols = withProduct? '1.3fr .8fr 1fr 1fr 1fr auto' : '1fr 1fr 1fr 1fr auto';
  return items.map((it,idx)=>`
    <div class="item-row" data-idx="${idx}" style="grid-template-columns:${cols};">
      ${withProduct? `
      <div><label>المنتج (اختياري)</label>
        <select class="${prefix}-product">
          <option value="">بدون منتج محدد</option>
          ${state.products.map(p=>`<option value="${p.id}" ${it.productId===p.id?'selected':''}>${esc(productLabel(p))}</option>`).join('')}
        </select>
      </div>` : ''}
      <div><label>العيار</label>
        <select class="${prefix}-karat">${state.karats.map(k=>`<option value="${k}" ${it.karat==k?'selected':''}>ع${k}</option>`).join('')}</select>
      </div>
      <div><label>الوزن (جم)</label><input type="number" step="0.001" class="${prefix}-weight" value="${it.weight||''}" oninput="recalcInvoiceTotal('${prefix}')"></div>
      <div><label>سعر الجرام</label><input type="number" step="0.01" class="${prefix}-price" value="${it.price||''}" oninput="recalcInvoiceTotal('${prefix}')"></div>
      <div><label>مصنعية</label><input type="number" step="0.01" class="${prefix}-making" value="${it.making||''}" oninput="recalcInvoiceTotal('${prefix}')"></div>
      <div class="rm" onclick="removeItemRow('${prefix}', this)">✕</div>
    </div>
  `).join('');
}
function addItemRow(prefix){
  const wrap = document.getElementById(prefix+'-items');
  const div = document.createElement('div');
  div.innerHTML = invoiceItemsTemplate(prefix, [{karat:state.karats[0]}]);
  wrap.appendChild(div.firstElementChild);
}
function removeItemRow(prefix, el){
  const wrap = document.getElementById(prefix+'-items');
  if(wrap.children.length>1) el.closest('.item-row').remove();
  recalcInvoiceTotal(prefix);
}
function collectItems(prefix){
  const rows = document.querySelectorAll('#'+prefix+'-items .item-row');
  const items=[];
  rows.forEach(r=>{
    const karat = parseFloat(r.querySelector('.'+prefix+'-karat').value);
    const weight = parseFloat(r.querySelector('.'+prefix+'-weight').value)||0;
    const price = parseFloat(r.querySelector('.'+prefix+'-price').value)||0;
    const making = parseFloat(r.querySelector('.'+prefix+'-making').value)||0;
    const productSel = r.querySelector('.'+prefix+'-product');
    const productId = productSel && productSel.value? productSel.value : null;
    if(weight>0 && price>0) items.push({karat, weight, price, making, total: weight*price+making, productId});
  });
  return items;
}
function recalcInvoiceTotal(prefix){
  const items = collectItems(prefix);
  const total = items.reduce((s,i)=>s+i.total,0);
  const totalEl = document.getElementById(prefix+'-total');
  if(totalEl) totalEl.value = total.toFixed(2);
  const paidEl = document.getElementById(prefix+'-paid');
  if(paidEl && paidEl.dataset.auto==='1') paidEl.value = total.toFixed(2);
}

  goto('merchants');

function openPurchaseBuilder(){
  if(!state.merchants.length){ toast('ضيف تاجر الأول — فتحتلك شاشة إضافة تاجر'); goToAddMerchant(); return; }
  resetPurchaseBuilder();

function filteredCatalogProducts(){
  const q = (pb.search||'').trim().toLowerCase();
  return state.products.filter(p=>{
    if(pb.classFilter && p.classificationId!==pb.classFilter) return false;
    if(!q) return true;
    const it = state.itemTypes.find(x=>x.id===p.itemTypeId);
    const name = (it? it.name:'') + ' ' + p.code;
    return name.toLowerCase().includes(q);
  });
}

function deletePBProduct(productId){
  const prod = state.products.find(p=>p.id===productId);

  showConfirmModal('حذف الكود "'+prod.code+'" من الكتالوج؟ القطع المضافة للفاتورة مش هتتأثر.', ()=>{
    mutate(()=>{
      state.products = state.products.filter(p=>p.id!==productId);
      if(pb && pb.selectedProductId===productId) pb.selectedProductId = null;
    }, 'تم حذف الكود من الكتالوج');
    closeModal();
  });

function submitPurchaseBuilderInvoice(){
  if(!pb.items.length){ toast('أضف قطعة واحدة على الأقل'); return; }
  if(!pb.merchantId){ toast('اختر التاجر'); return; }
  const totalWeight = pb.items.reduce((s,i)=>s+i.weight,0);
  const totalMaking = pb.items.reduce((s,i)=>s+(i.making||0),0);
  let paid = parseFloat(document.getElementById('pb-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalMaking));
  const items = pb.items;
  const karat = pb.karat;
  const merchantId = pb.merchantId;
  const finalSerialCursor = pb.serialCursor;

  mutate(()=>{
    const m = merchantById(merchantId);
    // الذهب: يدخل مخزون الخزينة، ويتقيد للتاجر (سالب = ليه علينا)
    state.treasury.gold[karat] = (state.treasury.gold[karat]||0) + totalWeight;
    m.balanceGold[karat] = (m.balanceGold[karat]||0) - totalWeight;
    // الأجر: اللي مدفوع دلوقتي يخرج من الخزينة، والباقي يتقيد فلوس للتاجر
    state.treasury.cash -= paid;
    m.balanceCash -= (totalMaking - paid);

    const invItems = items.map(it=>({karat:it.karat, weight:it.weight, price:it.price, makingPerGram:it.price, making:it.making, total:it.lineTotal, itemTypeId:it.itemTypeId, classificationId:it.classificationId, priceCategoryId:it.priceCategoryId, productCode:it.code}));
    const rec = {id:uid('purchase'), no: state.counters.purchase++, date:todayStr(), merchantId, karat, items:invItems,
      totalCash: totalMaking, totalMaking, totalWeight, settleMode:'weight', amountPaidNow:paid};
    state.purchaseInvoices.push(rec);

    items.forEach(it=>{
      state.pieces.push({id:uid('pc'), no:it.serial, date:todayStr(), invoiceId:rec.id, merchantId, productId:it.productId, itemTypeId:it.itemTypeId, classificationId:it.classificationId, priceCategoryId:it.priceCategoryId, karat:it.karat, weight:it.weight, barcodeValue:it.barcodeValue});
    });
    state.counters.piece = finalSerialCursor;
  }, 'تم حفظ فاتورة الشراء');
  pb = null;
  goto('purchases');
}

function submitInvoice(kind){
  const isPurchase = kind==='purchase';
  const prefix = kind;
  const merchantId = document.getElementById(prefix+'-merchant').value;
  const items = collectItems(prefix);
  if(!items.length){ toast('أضف صنفًا واحدًا على الأقل بوزن وسعر صحيحين'); return; }
  const totalCash = items.reduce((s,i)=>s+i.total,0);
  let paid = parseFloat(document.getElementById(prefix+'-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalCash));

  let generatedPieces = [];
  mutate(()=>{
    const m = merchantById(merchantId);
    items.forEach(it=>{
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + (isPurchase? it.weight : -it.weight);
    });
    state.treasury.cash += isPurchase? -paid : paid;
    const remainder = totalCash - paid;
    m.balanceCash += isPurchase? -remainder : remainder;

    const rec = {id:uid(prefix), no: isPurchase? state.counters.purchase++ : state.counters.sale++, date:todayStr(), merchantId, items, totalCash, amountPaidNow:paid};
    if(isPurchase){
      state.purchaseInvoices.push(rec);
      items.forEach(it=>{
        const serial = state.counters.piece++;
        const piece = {id:uid('pc'), no:serial, date:todayStr(), invoiceId:rec.id, merchantId, productId: it.productId||null, karat:it.karat, weight:it.weight, barcodeValue: buildBarcodeValue(it.karat, it.weight, serial)};
        state.pieces.push(piece);
        generatedPieces.push(piece);
      });
    } else {
      state.salesInvoices.push(rec);
    }
  }, 'تم حفظ الفاتورة');
  closeModal();
  if(isPurchase && generatedPieces.length){
    showPiecesBarcodeModal(generatedPieces);
  }
}

function submitCPTransaction(kind){
  const isCollect = kind==='collect';
  const merchantId = document.getElementById('cp-merchant').value;
  const items = collectGoldItems('cp');
  const cash = parseFloat(document.getElementById('cp-cash').value)||0;
  const cashMode = document.getElementById('cp-cashmode').value; // 'treasury' | 'account'
  const note = document.getElementById('cp-note').value.trim();
  if(cash<=0 && !items.length){ toast('أدخل مبلغًا نقديًا أو وزن ذهب بعيار واحد على الأقل'); return; }

  mutate(()=>{
    const m = merchantById(merchantId);
    const balSign = isCollect? -1 : 1;   // collect reduces what merchant owes us; pay reduces what we owe merchant
    const treasurySign = isCollect? 1 : -1; // collect = cash/gold in; pay = cash/gold out

    if(cash>0){
      m.balanceCash += balSign*cash;
      if(cashMode==='treasury') state.treasury.cash += treasurySign*cash;
    }
    items.forEach(it=>{
      m.balanceGold[it.karat] = (m.balanceGold[it.karat]||0) + balSign*it.weight;
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + treasurySign*it.weight;
    });

    const rec = {id:uid(kind), no: isCollect? state.counters.collection++ : state.counters.payment++, date:todayStr(), merchantId, cash, cashMode, items, note};
    if(isCollect) state.collections.push(rec); else state.payments.push(rec);
  }, isCollect? 'تم تسجيل التحصيل من التاجر' : 'تم تسجيل التسديد للتاجر');
  closeModal();
}

let sb = null;

function pieceMakingRate(piece){
  const pc = piece.priceCategoryId? state.priceCategories.find(x=>x.id===piece.priceCategoryId) : null;
  if(pc) return pc.price||0;
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  if(prod){ const p2 = state.priceCategories.find(x=>x.id===prod.priceCategoryId); if(p2) return p2.price||0; }
  return 0;
}
function pieceLabel(piece){
  const it = piece.itemTypeId? state.itemTypes.find(x=>x.id===piece.itemTypeId) : null;
  if(it) return it.name;
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  if(prod){ const i2 = state.itemTypes.find(x=>x.id===prod.itemTypeId); if(i2) return i2.name; }
  return '—';
}
function pieceCode(piece){
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  return prod? prod.code : '—';
}
function findPieceByScan(code){
  code = String(code||'').trim();
  if(!code) return null;
  let p = state.pieces.find(x=> String(x.barcodeValue)===code);
  if(p) return p;
  const asNo = parseInt(code, 10);
  if(!isNaN(asNo)) p = state.pieces.find(x=> Number(x.no)===asNo);
  return p||null;
}

function addSalePieceByScan(){
  const input = document.getElementById('sb-scan');

  const piece = findPieceByScan(raw);
  if(!piece){ toast('الباركود ده مش موجود في القطع'); if(input){input.value=''; input.focus();} return; }

  const rate = pieceMakingRate(piece);
  sb.items.push({
    pieceId: piece.id, no: piece.no, code: pieceCode(piece), itemName: pieceLabel(piece),
    karat: piece.karat, weight: piece.weight, rate, making: piece.weight*rate,
    barcodeValue: piece.barcodeValue

  render();

      عند الحفظ: <b style="color:var(--gold-bright);">${totalWeight.toFixed(3)} جم</b> هتخرج من مخزون الخزينة وتتقيد على التاجر (ليه علينا يقل / عليه لنا يزيد)،
      و<b style="color:var(--gold-bright);">${fmtCash(totalMaking)}</b> أجر هيتقيد لنا على التاجر — يخصم منه اللي هتحصّله دلوقتي.
    </div>
    <div class="row">
      <div class="field"><label>المحصّل نقداً الآن (من الأجر)</label><input type="number" step="0.01" id="sb-paid" value="${totalMaking.toFixed(2)}"></div>
      <div class="field" style="display:flex;align-items:flex-end;">
        <button class="btn btn-gold" style="width:100%;" onclick="submitSaleBuilderInvoice()">حفظ الفاتورة</button>
      </div>
    </div>
  `;
}

function submitSaleBuilderInvoice(){
  if(!sb.items.length){ toast('امسح قطعة واحدة على الأقل'); return; }
  if(!sb.merchantId){ toast('اختر التاجر'); return; }
  const totalWeight = sb.items.reduce((s,i)=>s+i.weight,0);
  const totalMaking = sb.items.reduce((s,i)=>s+i.making,0);
  let paid = parseFloat(document.getElementById('sb-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalMaking));
  const items = sb.items, merchantId = sb.merchantId;

  mutate(()=>{
    const m = merchantById(merchantId);
    items.forEach(it=>{
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) - it.weight;
      m.balanceGold[it.karat] = (m.balanceGold[it.karat]||0) + it.weight;
      const pc = state.pieces.find(x=>x.id===it.pieceId);
      if(pc){ pc.sold = true; pc.soldDate = todayStr(); pc.soldToMerchantId = merchantId; }
    });
    state.treasury.cash += paid;
    m.balanceCash += (totalMaking - paid);

    const invItems = items.map(it=>({pieceId:it.pieceId, pieceNo:it.no, karat:it.karat, weight:it.weight,
      price:it.rate, makingPerGram:it.rate, making:it.making, total:it.making, productCode:it.code, barcodeValue:it.barcodeValue}));
    state.salesInvoices.push({id:uid('sale'), no: state.counters.sale++, date:todayStr(), merchantId, items:invItems,
      totalCash: totalMaking, totalMaking, totalWeight, settleMode:'weight', amountPaidNow:paid});
  }, 'تم حفظ فاتورة البيع');
  sb = null;
  goto('sales');
}

/* ============================= الأنجراره (المعلّقة) ============================= */
function renderPending(){
  const all = [...state.pendingSales].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const filtered = all.filter(p=> uiState.pendingTab==='all' ? true : p.status===uiState.pendingTab);
  const tabs = [['pending','معلّقة'],['confirmed','مؤكدة'],['deleted','محذوفة'],['all','الكل']];
  return `
    <div class="pagehead">
      <div><h1>الأنجراره</h1><p>بيع قطعة معلّقة على تاجر — لا تدخل حسابه إلا بعد التأكيد، ويمكن حذفها بلا أثر</p></div>
      <button class="btn btn-gold" onclick="openPendingModal()" ${state.merchants.length?'':'disabled'}>+ قطعة معلّقة جديدة</button>
    </div>
    <div class="tabs">
      ${tabs.map(([k,l])=>`<div class="tab ${uiState.pendingTab===k?'active':''}" onclick="uiState.pendingTab='${k}';render();">${l}</div>`).join('')}
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>رقم</th><th>التاريخ</th><th>التاجر</th><th>العيار</th><th>الوزن</th><th class="right">الإجمالي</th><th>الحالة</th><th></th></tr></thead>
        <tbody>
        ${filtered.length? filtered.map(p=>`
          <tr>
            <td class="mono">#${p.no}</td>
            <td class="muted num">${fmtDate(p.date)}</td>
            <td>${esc(merchantName(p.merchantId))}</td>
            <td><span class="pill pill-gold">ع${p.karat}</span></td>
            <td class="num">${fmtW(p.weight)}</td>
            <td class="right num">${fmtCash(p.totalCash)}</td>
            <td><span class="pill ${p.status==='pending'?'pill-gold':p.status==='confirmed'?'pill-green':'pill-red'}">${p.status==='pending'?'معلّقة':p.status==='confirmed'?'مؤكدة':'محذوفة'}</span></td>
            <td>
              ${p.status==='pending'? `
                <div style="display:flex;gap:6px;">
                  <button class="btn btn-sm btn-gold" onclick="confirmPending('${p.id}')">✓ تأكيد</button>
                  <button class="btn btn-sm btn-danger" onclick="deletePending('${p.id}')">✕ حذف</button>
                </div>` : '<span class="muted">—</span>'}
            </td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="8">لا توجد عناصر في هذا التصنيف</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function openPendingModal(){
  if(!state.merchants.length){ toast('أضف تاجرًا أولاً'); return; }
  const root=document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>قطعة معلّقة (انجراره) جديدة</h2>
        <div class="hint">لن تؤثر على المخزون أو حساب التاجر إلا بعد الضغط على "تأكيد" لاحقًا</div>
        <div class="field"><label>التاجر</label>
          <select id="pd-merchant">${state.merchants.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.code)})</option>`).join('')}</select>
        </div>
        <div class="row">
          <div class="field"><label>العيار</label>
            <select id="pd-karat">${state.karats.map(k=>`<option value="${k}">عيار ${k}</option>`).join('')}</select>
          </div>
          <div class="field"><label>الوزن (جم)</label><input type="number" step="0.001" id="pd-weight" oninput="recalcPendingTotal()"></div>
        </div>
        <div class="row">
          <div class="field"><label>سعر الجرام</label><input type="number" step="0.01" id="pd-price" oninput="recalcPendingTotal()"></div>
          <div class="field"><label>الإجمالي</label><input id="pd-total" readonly value="0.00"></div>
        </div>
        <div class="field"><label>ملاحظة (اختياري)</label><input id="pd-note" placeholder="وصف القطعة"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
          <button class="btn btn-gold" onclick="submitPending()">تعليق القطعة</button>
        </div>
      </div>
    </div>`;
}
function recalcPendingTotal(){
  const w=parseFloat(document.getElementById('pd-weight').value)||0;
  const p=parseFloat(document.getElementById('pd-price').value)||0;
  document.getElementById('pd-total').value=(w*p).toFixed(2);
}
function submitPending(){
  const merchantId = document.getElementById('pd-merchant').value;
  const karat = parseFloat(document.getElementById('pd-karat').value);
  const weight = parseFloat(document.getElementById('pd-weight').value)||0;
  const price = parseFloat(document.getElementById('pd-price').value)||0;
  const note = document.getElementById('pd-note').value.trim();
  if(weight<=0||price<=0){ toast('أدخل الوزن والسعر بشكل صحيح'); return; }
  mutate(()=>{
    state.pendingSales.push({id:uid('pd'), no:state.counters.pending++, date:todayStr(), merchantId, karat, weight, pricePerGram:price, totalCash:weight*price, note, status:'pending'});
  }, 'تم تعليق القطعة على التاجر');
  closeModal();
}
function confirmPending(id){
  showConfirmModal('تأكيد هذه القطعة سيخصمها من المخزون ويقيدها على حساب التاجر. متابعة؟', ()=>{
    mutate(()=>{
      const p = state.pendingSales.find(x=>x.id===id);
      const m = merchantById(p.merchantId);
      state.treasury.gold[p.karat] = (state.treasury.gold[p.karat]||0) - p.weight;
      m.balanceCash += p.totalCash;
      p.status='confirmed';
      p.confirmedDate = todayStr();
    }, 'تم تأكيد القطعة وقيدها على حساب التاجر');
    closeModal();
  }, {confirmLabel:'تأكيد القطعة', danger:false});
}
function deletePending(id){
  showConfirmModal('حذف هذه القطعة نهائيًا بدون أي أثر على الحسابات؟', ()=>{
    mutate(()=>{
      const p = state.pendingSales.find(x=>x.id===id);
      p.status='deleted';
    }, 'تم حذف القطعة');
    closeModal();
  }, {confirmLabel:'حذف القطعة'});
}

/* ============================= تسوية الحسابات ============================= */
function renderSettlements(){
  const list = [...state.settlements].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `
    <div class="pagehead">
      <div><h1>تسوية الحسابات</h1><p>تسويات دائنة أو مدينة يدوية لتصحيح رصيد نقدي أو وزن ذهب لتاجر</p></div>
      <button class="btn btn-gold" onclick="openSettlementModal()" ${state.merchants.length?'':'disabled'}>+ تسوية جديدة</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>رقم</th><th>التاريخ</th><th>التاجر</th><th>النوع</th><th>نقدية</th><th>ذهب</th><th>ملاحظة</th></tr></thead>
        <tbody>
        ${list.length? list.map(s=>`
          <tr>
            <td class="mono">#${s.no}</td>
            <td class="muted num">${fmtDate(s.date)}</td>
            <td>${esc(merchantName(s.merchantId))}</td>
            <td><span class="pill ${s.type==='debit'?'pill-green':'pill-red'}">${s.type==='debit'?'مدين على التاجر':'دائن لصالح التاجر'}</span></td>
            <td class="num">${s.cash? fmtCash(s.cash):'—'}</td>
            <td class="num">${s.karat && s.weight? 'ع'+s.karat+' · '+fmtW(s.weight) : '—'}</td>
            <td class="muted">${esc(s.note||'—')}</td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="7">لا توجد تسويات بعد</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function openSettlementModal(){
  if(!state.merchants.length){ toast('أضف تاجرًا أولاً'); return; }
  const root=document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>تسوية حساب تاجر</h2>
        <div class="hint">"مدين على التاجر" يزيد ما لنا عنده — "دائن لصالح التاجر" يزيد ما علينا له</div>
        <div class="field"><label>التاجر</label>
          <select id="st-merchant">${state.merchants.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.code)})</option>`).join('')}</select>
        </div>
        <div class="field"><label>نوع التسوية</label>
          <select id="st-type">
            <option value="debit">مدين على التاجر (له علينا أقل / لنا عليه أكثر)</option>
            <option value="credit">دائن لصالح التاجر (لنا عليه أقل / له علينا أكثر)</option>
          </select>
        </div>
        <div class="row">
          <div class="field"><label>مبلغ نقدي (اختياري)</label><input type="number" step="0.01" id="st-cash" value="0"></div>
          <div class="field"><label>العيار (اختياري)</label>
            <select id="st-karat"><option value="">بدون</option>${state.karats.map(k=>`<option value="${k}">عيار ${k}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field"><label>وزن الذهب (جم، اختياري)</label><input type="number" step="0.001" id="st-weight" value="0"></div>
        <div class="field"><label>سبب التسوية</label><input id="st-note" placeholder="مثال: فرق جرد، خطأ فاتورة سابقة..."></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
          <button class="btn btn-gold" onclick="submitSettlement()">تنفيذ التسوية</button>
        </div>
      </div>
    </div>`;
}
function submitSettlement(){
  const merchantId = document.getElementById('st-merchant').value;
  const type = document.getElementById('st-type').value;
  const cash = parseFloat(document.getElementById('st-cash').value)||0;
  const karatVal = document.getElementById('st-karat').value;
  const karat = karatVal? parseFloat(karatVal) : null;
  const weight = parseFloat(document.getElementById('st-weight').value)||0;
  const note = document.getElementById('st-note').value.trim();
  if(cash<=0 && (!karat || weight<=0)){ toast('أدخل مبلغًا نقديًا أو وزن ذهب للتسوية'); return; }
  mutate(()=>{
    const m = merchantById(merchantId);
    const sign = type==='debit'? 1 : -1;
    if(cash>0) m.balanceCash += sign*cash;
    if(karat && weight>0) m.balanceGold[karat] = (m.balanceGold[karat]||0) + sign*weight;
    state.settlements.push({id:uid('st'), no:state.counters.settlement++, date:todayStr(), merchantId, type, cash, karat, weight, note});
  }, 'تم تنفيذ التسوية');
  closeModal();
}

/* ============================= تحويل أرصدة بين التجار ============================= */
function renderTransfers(){
  const list = [...state.transfers].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `
    <div class="pagehead">
      <div><h1>تحويل أرصدة بين التجار</h1><p>نقل رصيد نقدي و/أو أوزان ذهب بالعيار من تاجر إلى تاجر آخر</p></div>
      <button class="btn btn-gold" onclick="openTransferModal()" ${state.merchants.length>1?'':'disabled'}>+ تحويل جديد</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>رقم</th><th>التاريخ</th><th>من</th><th>إلى</th><th>نقدية</th><th>ذهب</th><th>ملاحظة</th></tr></thead>
        <tbody>
        ${list.length? list.map(t=>`
          <tr>
            <td class="mono">#${t.no}</td>
            <td class="muted num">${fmtDate(t.date)}</td>
            <td>${esc(merchantName(t.fromMerchantId))}</td>
            <td>${esc(merchantName(t.toMerchantId))}</td>
            <td class="num">${t.cash? fmtCash(t.cash):'—'}</td>
            <td class="num">${t.karat && t.weight? 'ع'+t.karat+' · '+fmtW(t.weight) : '—'}</td>
            <td class="muted">${esc(t.note||'—')}</td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="7">لا توجد تحويلات بعد</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function openTransferModal(){
  if(state.merchants.length<2){ toast('تحتاج تاجرين على الأقل لإجراء تحويل'); return; }
  const root=document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>تحويل رصيد بين تاجرين</h2>
        <div class="hint">يُخصم من رصيد التاجر الأول ويُضاف لرصيد التاجر الثاني بنفس القيم — لا يؤثر على الخزينة</div>
        <div class="row">
          <div class="field"><label>من (التاجر المحوِّل)</label>
            <select id="tr-from">${state.merchants.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.code)})</option>`).join('')}</select>
          </div>
          <div class="field"><label>إلى (التاجر المستفيد)</label>
            <select id="tr-to">${state.merchants.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.code)})</option>`).join('')}</select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>مبلغ نقدي (اختياري)</label><input type="number" step="0.01" id="tr-cash" value="0"></div>
          <div class="field"><label>العيار (اختياري)</label>
            <select id="tr-karat"><option value="">بدون</option>${state.karats.map(k=>`<option value="${k}">عيار ${k}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field"><label>وزن الذهب (جم، اختياري)</label><input type="number" step="0.001" id="tr-weight" value="0"></div>
        <div class="field"><label>ملاحظة (اختياري)</label><input id="tr-note" placeholder="سبب التحويل"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
          <button class="btn btn-gold" onclick="submitTransfer()">تنفيذ التحويل</button>
        </div>
      </div>
    </div>`;
}
function submitTransfer(){
  const fromId = document.getElementById('tr-from').value;
  const toId = document.getElementById('tr-to').value;
  if(fromId===toId){ toast('اختر تاجرين مختلفين'); return; }
  const cash = parseFloat(document.getElementById('tr-cash').value)||0;
  const karatVal = document.getElementById('tr-karat').value;
  const karat = karatVal? parseFloat(karatVal): null;
  const weight = parseFloat(document.getElementById('tr-weight').value)||0;
  const note = document.getElementById('tr-note').value.trim();
  if(cash<=0 && (!karat || weight<=0)){ toast('أدخل مبلغًا نقديًا أو وزن ذهب للتحويل'); return; }
  mutate(()=>{
    const from = merchantById(fromId), to = merchantById(toId);
    if(cash>0){ from.balanceCash -= cash; to.balanceCash += cash; }
    if(karat && weight>0){
      from.balanceGold[karat] = (from.balanceGold[karat]||0) - weight;
      to.balanceGold[karat] = (to.balanceGold[karat]||0) + weight;
    }
    state.transfers.push({id:uid('tr'), no:state.counters.transfer++, date:todayStr(), fromMerchantId:fromId, toMerchantId:toId, cash, karat, weight, note});
  }, 'تم تنفيذ التحويل بين التجار');
  closeModal();
}

(async function init(){
  document.getElementById('main').innerHTML = '<div class="empty-state"><div class="ic">◆</div>جارِ التحميل...</div>';
  await loadState();
  render();
})();
</script>
