function submitPurchaseBuilderInvoice(){
  if(!pb.items.length){ toast('أضف قطعة واحدة على الأقل'); return; }
  if(!pb.merchantId){ toast('اختر التاجر'); return; }
  const totalWeight = pb.items.reduce((s,i)=>s+i.weight,0);
  const totalMaking = pb.items.reduce((s,i)=>s+(i.making||0),0);
  let paid = parseFloat(document.getElementById('pb-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalMaking));
  const items = pb.items;
  const karat = pb.karat;
  const merchantId = pb.merchantId;
  const finalSerialCursor = pb.serialCursor;

  let generatedPieceIds = [];
  mutate(()=>{
    const m = merchantById(merchantId);
    // الذهب: يدخل مخزون الخزينة، ويتقيد للتاجر (سالب = ليه علينا)
    state.treasury.gold[karat] = (state.treasury.gold[karat]||0) + totalWeight;
    m.balanceGold[karat] = (m.balanceGold[karat]||0) - totalWeight;
    // الأجر: اللي مدفوع دلوقتي يخرج من الخزينة، والباقي يتقيد فلوس للتاجر
    state.treasury.cash -= paid;
    m.balanceCash -= (totalMaking - paid);

    const pieceIds = items.map(()=>uid('pc'));
    const invItems = items.map((it,i)=>({pieceId:pieceIds[i], karat:it.karat, weight:it.weight, price:it.price, makingPerGram:it.price, making:it.making, total:it.lineTotal, itemTypeId:it.itemTypeId, classificationId:it.classificationId, priceCategoryId:it.priceCategoryId, productCode:it.code}));
    const editing = !!pbEditId;
    const rec = {id: editing? pbEditId : uid('purchase'),
      no: editing? pbEditNo : state.counters.purchase++,
      date: editing? (pbEditDate||todayStr()) : todayStr(),
      createdAt: editing? pbEditCreatedAt : new Date().toISOString(),
      merchantId, karat, items:invItems,
      totalCash: totalMaking, totalMaking, totalWeight, settleMode:'weight', amountPaidNow:paid};
    state.purchaseInvoices.push(rec);

    items.forEach((it,i)=>{
      const pieceId = pieceIds[i];
      state.pieces.push({id:pieceId, uid:it.uid||newPieceUid(), no:it.serial, date:todayStr(), invoiceId:rec.id, merchantId, productId:it.productId, itemTypeId:it.itemTypeId, classificationId:it.classificationId, priceCategoryId:it.priceCategoryId, karat:it.karat, weight:it.weight, barcodeValue:it.barcodeValue});
      generatedPieceIds.push(pieceId);
    });
    state.counters.piece = finalSerialCursor;
  }, pbEditId? ('تم حفظ تعديل الفاتورة #'+pbEditNo) : 'تم حفظ فاتورة الشراء');
  pb = null; pbEditId=null; pbEditNo=null; pbEditDate=null; pbEditCreatedAt=null;
  goto('purchases');
  if(generatedPieceIds.length) setTimeout(()=>showPieceQRModal(generatedPieceIds), 150);
}

function submitInvoice(kind){
  const isPurchase = kind==='purchase';
  const prefix = kind;
  const merchantId = document.getElementById(prefix+'-merchant').value;
  const items = collectItems(prefix);
  if(!items.length){ toast('أضف صنفًا واحدًا على الأقل بوزن وسعر صحيحين'); return; }
  const totalCash = items.reduce((s,i)=>s+i.total,0);
  let paid = parseFloat(document.getElementById(prefix+'-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalCash));

  let generatedPieces = [];
  mutate(()=>{
    const m = merchantById(merchantId);
    items.forEach(it=>{
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + (isPurchase? it.weight : -it.weight);
    });
    state.treasury.cash += isPurchase? -paid : paid;
    const remainder = totalCash - paid;
    m.balanceCash += isPurchase? -remainder : remainder;

    const rec = {id:uid(prefix), no: isPurchase? state.counters.purchase++ : state.counters.sale++, date:todayStr(), merchantId, items, totalCash, amountPaidNow:paid};
    if(isPurchase){
      state.purchaseInvoices.push(rec);
      items.forEach(it=>{
        const serial = state.counters.piece++;
        const piece = {id:uid('pc'), uid:newPieceUid(), no:serial, date:todayStr(), invoiceId:rec.id, merchantId, productId: it.productId||null, karat:it.karat, weight:it.weight, barcodeValue: buildBarcodeValue(it.karat, it.weight, serial)};
        state.pieces.push(piece);
        generatedPieces.push(piece);
      });
    } else {
      state.salesInvoices.push(rec);
    }
  }, 'تم حفظ الفاتورة');
  closeModal();
  if(isPurchase && generatedPieces.length){
    showPieceQRModal(generatedPieces.map(p=>p.id));
  }
}

function submitCPTransaction(kind){
  const isCollect = kind==='collect';
  const merchantId = document.getElementById('cp-merchant').value;
  const items = collectGoldItems('cp');
  const cash = parseFloat(document.getElementById('cp-cash').value)||0;
  const cashMode = document.getElementById('cp-cashmode').value; // 'treasury' | 'account'
  const note = document.getElementById('cp-note').value.trim();
  if(cash<=0 && !items.length){ toast('أدخل مبلغًا نقديًا أو وزن ذهب بعيار واحد على الأقل'); return; }

  mutate(()=>{
    const m = merchantById(merchantId);
    const balSign = isCollect? -1 : 1;   // collect reduces what merchant owes us; pay reduces what we owe merchant
    const treasurySign = isCollect? 1 : -1; // collect = cash/gold in; pay = cash/gold out

    if(cash>0){
      m.balanceCash += balSign*cash;
      if(cashMode==='treasury') state.treasury.cash += treasurySign*cash;
    }
    items.forEach(it=>{
      m.balanceGold[it.karat] = (m.balanceGold[it.karat]||0) + balSign*it.weight;
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + treasurySign*it.weight;
    });

    const rec = {id:uid(kind), no: isCollect? state.counters.collection++ : state.counters.payment++, date:todayStr(), partyKind:'merchant', merchantId, cash, cashMode, items, note};
    if(isCollect) state.collections.push(rec); else state.payments.push(rec);
  }, isCollect? 'تم تسجيل التحصيل من التاجر' : 'تم تسجيل التسديد للتاجر');
  closeModal();
}



/* ---------- تعديل / حذف حركات التحصيل والتسديد (تجار + عملاء) ---------- */
function cpFind(kind, id){
  const arr = kind==='collect'? state.collections : state.payments;
  return arr.find(x=>x.id===id) || null;
}
function cpParty(rec){
  return rec.partyKind==='customer'? customerById(rec.customerId) : merchantById(rec.merchantId);
}
function applyCPEffect(kind, rec, sign){
  const isCollect = kind==='collect';
  const party = cpParty(rec);
  const balSign = isCollect? -1 : 1;
  const trSign  = isCollect? 1 : -1;
  const cash = rec.cash||0;
  if(cash>0){
    if(party) party.balanceCash += sign*balSign*cash;
    if(rec.cashMode==='treasury') state.treasury.cash += sign*trSign*cash;
  }
  (rec.items||[]).forEach(it=>{
    if(party) party.balanceGold[it.karat] = (party.balanceGold[it.karat]||0) + sign*balSign*it.weight;
    state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + sign*trSign*it.weight;
  });
}
function deleteCPRecord(kind, id){
  const rec = cpFind(kind, id);
  if(!rec) return;
  const label = kind==='collect'? 'التحصيل' : 'التسديد';
  showConfirmModal('حذف حركة '+label+' رقم #'+rec.no+'؟ هيتعكس قيدها بالكامل من الخزينة ومن حساب '+(rec.partyKind==='customer'?'العميل':'التاجر')+'.', ()=>{
    mutate(()=>{
      applyCPEffect(kind, rec, -1);
      if(kind==='collect') state.collections = state.collections.filter(x=>x.id!==id);
      else state.payments = state.payments.filter(x=>x.id!==id);
    }, 'تم حذف الحركة وعكس قيدها');

  }, {confirmLabel:'حذف الحركة'});
}

function submitCPEdit(kind, id){
  const rec = cpFind(kind, id);
  if(!rec) return;
  const isCust = rec.partyKind==='customer';
  const partyId = document.getElementById('cpe-party').value;
  const date = document.getElementById('cpe-date').value || rec.date;
  const items = collectGoldItems('cpe');
  const cash = parseFloat(document.getElementById('cpe-cash').value)||0;
  const cashMode = document.getElementById('cpe-cashmode').value;
  const note = document.getElementById('cpe-note').value.trim();
  if(cash<=0 && !items.length){ toast('أدخل مبلغًا نقديًا أو وزن ذهب'); return; }
  mutate(()=>{
    applyCPEffect(kind, rec, -1);
    rec.date = date; rec.cash = cash; rec.cashMode = cashMode; rec.items = items; rec.note = note;
    if(isCust) rec.customerId = partyId; else rec.merchantId = partyId;
    applyCPEffect(kind, rec, +1);
  }, 'تم حفظ تعديل الحركة');
  closeModal();
}

/* ============================= فاتورة مبيعات لتاجر (بالباركود) ============================= */
let sb = null;

function pieceMakingRate(piece){
  const pc = piece.priceCategoryId? state.priceCategories.find(x=>x.id===piece.priceCategoryId) : null;
  if(pc) return pc.price||0;
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  if(prod){ const p2 = state.priceCategories.find(x=>x.id===prod.priceCategoryId); if(p2) return p2.price||0; }
  return 0;
}
function pieceLabel(piece){
  const it = piece.itemTypeId? state.itemTypes.find(x=>x.id===piece.itemTypeId) : null;
  if(it) return it.name;
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  if(prod){ const i2 = state.itemTypes.find(x=>x.id===prod.itemTypeId); if(i2) return i2.name; }
  return '—';
}
function pieceCode(piece){
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  return prod? prod.code : '—';
}
function findPieceByScan(code){
  code = String(code||'').trim();
  if(!code) return null;
  let p = findPieceByUid(code);          // الكود الفريد من الـ QR
  if(p) return p;
  p = state.pieces.find(x=> String(x.barcodeValue)===code);
  if(p) return p;
  const asNo = parseInt(code, 10);
  if(!isNaN(asNo)) p = state.pieces.find(x=> Number(x.no)===asNo);
  return p||null;
}

function addSalePieceByScan(){
  const input = document.getElementById('sb-scan');
  const raw = input? input.value : '';
  const piece = findPieceByScan(raw);
  if(!piece){ toast('الباركود ده مش موجود في القطع'); if(input){input.value=''; input.focus();} return; }
  if(piece.sold){ toast('القطعة دي متباعة قبل كده'); if(input){input.value=''; input.focus();} return; }
  if(sb.items.some(x=>x.pieceId===piece.id)){ toast('القطعة دي مضافة في الفاتورة بالفعل'); if(input){input.value=''; input.focus();} return; }
  const rate = pieceMakingRate(piece);
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  sb.items.push({
    pieceId: piece.id, no: piece.no, code: pieceCode(piece), itemName: pieceLabel(piece),
    classificationId: piece.classificationId || (prod? prod.classificationId : null),
    itemTypeId: piece.itemTypeId || (prod? prod.itemTypeId : null),
    karat: piece.karat, weight: piece.weight, rate, making: piece.weight*rate,
    barcodeValue: piece.barcodeValue
  });
  if(input) input.value='';
  refocusAfterRender('sb-scan');
  render();
}
function removeSaleLine(pieceId){
  sb.items = sb.items.filter(x=>x.pieceId!==pieceId);
  refocusAfterRender('sb-scan');
  render();
}
function setSaleRate(pieceId, val){
  const it = sb.items.find(x=>x.pieceId===pieceId);
  if(!it) return;
  it.rate = parseFloat(val)||0;
  it.making = it.weight * it.rate;
  render();
}

function submitSaleBuilderInvoice(){
  if(!sb.items.length){ toast('امسح قطعة واحدة على الأقل'); return; }
  if(!sb.merchantId){ toast('اختر التاجر'); return; }
  const totalWeight = sb.items.reduce((s,i)=>s+i.weight,0);
  const totalMaking = sb.items.reduce((s,i)=>s+i.making,0);
  let paid = parseFloat(document.getElementById('sb-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalMaking));
  const items = sb.items, merchantId = sb.merchantId;

  mutate(()=>{
    const m = merchantById(merchantId);
    items.forEach(it=>{
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) - it.weight;
      m.balanceGold[it.karat] = (m.balanceGold[it.karat]||0) + it.weight;
      const pc = state.pieces.find(x=>x.id===it.pieceId);
      if(pc){ pc.sold = true; pc.soldDate = todayStr(); pc.soldToMerchantId = merchantId; }
    });
    state.treasury.cash += paid;
    m.balanceCash += (totalMaking - paid);

    const invItems = items.map(it=>({pieceId:it.pieceId, pieceNo:it.no, karat:it.karat, weight:it.weight,
      price:it.rate, makingPerGram:it.rate, making:it.making, total:it.making, productCode:it.code, barcodeValue:it.barcodeValue,
      classificationId:it.classificationId||null, itemTypeId:it.itemTypeId||null}));
    state.salesInvoices.push({id:uid('sale'), no: state.counters.sale++, date:todayStr(), merchantId, items:invItems,
      totalCash: totalMaking, totalMaking, totalWeight, settleMode:'weight', amountPaidNow:paid});
  }, 'تم حفظ فاتورة البيع');
  sb = null;
  goto('sales');
}

function submitPending(){
  const merchantId = document.getElementById('pd-merchant').value;
  const karat = parseFloat(document.getElementById('pd-karat').value);
  const weight = parseFloat(document.getElementById('pd-weight').value)||0;
  const price = parseFloat(document.getElementById('pd-price').value)||0;
  const note = document.getElementById('pd-note').value.trim();
  if(weight<=0||price<=0){ toast('أدخل الوزن والسعر بشكل صحيح'); return; }
  mutate(()=>{
    state.pendingSales.push({id:uid('pd'), no:state.counters.pending++, date:todayStr(), merchantId, karat, weight, pricePerGram:price, totalCash:weight*price, note, status:'pending'});
  }, 'تم تعليق القطعة على التاجر');
  closeModal();

function confirmPending(id){
  const p = state.pendingSales.find(x=>x.id===id);
  if(!p) return;
  showConfirmModal('حفظ المربع ده هيخصمه من المخزون ويقيده على حساب '+(p.partyKind==='customer'?'العميل':'التاجر')+'. متابعة؟', ()=>{
    mutate(()=>{
      const party = p.partyKind==='customer'? customerById(p.customerId) : merchantById(p.merchantId);
      state.treasury.gold[p.karat] = (state.treasury.gold[p.karat]||0) - p.weight;
      if(party){
        party.balanceGold[p.karat] = (party.balanceGold[p.karat]||0) + p.weight;
        party.balanceCash += p.totalCash;
      }
      if(p.pieceId){
        const pc = state.pieces.find(x=>x.id===p.pieceId);
        if(pc){ pc.sold=true; pc.soldDate=todayStr();
          if(p.partyKind==='customer') pc.soldToCustomerId=p.customerId; else pc.soldToMerchantId=p.merchantId; }
      }
      p.status='confirmed';
      p.confirmedDate = todayStr();
    }, 'تم حفظ المربع وقيده على الحساب');
    closeModal();
  }, {confirmLabel:'حفظ المربع', danger:false});
}
function deletePending(id){
  showConfirmModal('رد المربع ده وحذفه بدون أي أثر على الحسابات؟', ()=>{
    mutate(()=>{
      const p = state.pendingSales.find(x=>x.id===id);
      if(p) p.status='deleted';
    }, 'تم رد المربع');
    closeModal();
  }, {confirmLabel:'رد المربع'});
}

function applySettlementEffect(rec, sign){
  const party = rec.partyKind==='customer'? customerById(rec.customerId) : merchantById(rec.merchantId);
  if(!party) return;
  const s2 = rec.type==='debit'? 1 : -1;
  if(rec.cash>0) party.balanceCash += sign*s2*rec.cash;
  if(rec.karat && rec.weight>0) party.balanceGold[rec.karat] = (party.balanceGold[rec.karat]||0) + sign*s2*rec.weight;
}
function submitSettlement(kind){
  kind = kind || 'merchant';
  const partyId = document.getElementById('st-party').value;
  const type = document.getElementById('st-type').value;
  const cash = parseFloat(document.getElementById('st-cash').value)||0;
  const karatVal = document.getElementById('st-karat').value;
  const karat = karatVal? parseFloat(karatVal) : null;
  const weight = parseFloat(document.getElementById('st-weight').value)||0;
  const note = document.getElementById('st-note').value.trim();
  if(cash<=0 && (!karat || weight<=0)){ toast('أدخل مبلغًا نقديًا أو وزن ذهب للتسوية'); return; }
  mutate(()=>{
    const rec = {id:uid('st'), no:state.counters.settlement++, date:todayStr(), partyKind:kind,
      merchantId: kind==='merchant'? partyId : null, customerId: kind==='customer'? partyId : null,
      type, cash, karat, weight, note};
    state.settlements.push(rec);
    applySettlementEffect(rec, +1);
  }, 'تم تنفيذ التسوية');
  closeModal();
}
function deleteSettlement(id){
  const rec = state.settlements.find(x=>x.id===id);
  if(!rec) return;

function submitTransfer(kind){
  kind = kind || 'merchant';
  const byId = id => kind==='customer'? customerById(id) : merchantById(id);
  const fromId = document.getElementById('tr-from').value;
  const toId = document.getElementById('tr-to').value;
  if(fromId===toId){ toast('اختر طرفين مختلفين'); return; }
  const cash = parseFloat(document.getElementById('tr-cash').value)||0;
  const karatVal = document.getElementById('tr-karat').value;
  const karat = karatVal? parseFloat(karatVal): null;
  const weight = parseFloat(document.getElementById('tr-weight').value)||0;
  const note = document.getElementById('tr-note').value.trim();
  if(cash<=0 && (!karat || weight<=0)){ toast('أدخل مبلغًا نقديًا أو وزن ذهب للتحويل'); return; }
  mutate(()=>{
    const from = byId(fromId), to = byId(toId);
    if(cash>0){ from.balanceCash -= cash; to.balanceCash += cash; }
    if(karat && weight>0){
      from.balanceGold[karat] = (from.balanceGold[karat]||0) - weight;
      to.balanceGold[karat] = (to.balanceGold[karat]||0) + weight;
    }
    state.transfers.push({id:uid('tr'), no:state.counters.transfer++, date:todayStr(), partyKind:kind,
      fromMerchantId:fromId, toMerchantId:toId, cash, karat, weight, note});
  }, 'تم تنفيذ التحويل');
  closeModal();
}

/* ============================= مولّد QR داخلي (بدون أي مكتبة خارجية) ============================= */
const QR_L_BLOCKS = {1:[[1,19]],2:[[1,34]],3:[[1,55]],4:[[1,80]],5:[[1,108]],6:[[2,68]],7:[[2,78]],8:[[2,97]],9:[[2,116]],10:[[2,68],[2,69]]};
const QR_L_ECC = {1:7,2:10,3:15,4:20,5:26,6:18,7:20,8:24,9:30,10:18};
const QR_ALIGN = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
let QR_EXP=null, QR_LOG=null;
function qrInitGF(){
  if(QR_EXP) return;
  QR_EXP=new Array(512); QR_LOG=new Array(256);
  let x=1;
  for(let i=0;i<255;i++){ QR_EXP[i]=x; QR_LOG[x]=i; x<<=1; if(x&0x100) x^=0x11D; }
  for(let i=255;i<512;i++) QR_EXP[i]=QR_EXP[i-255];
}
function qrMul(a,b){ if(a===0||b===0) return 0; qrInitGF(); return QR_EXP[QR_LOG[a]+QR_LOG[b]]; }
function qrGenPoly(n){
  qrInitGF();
  let poly=[1];
  for(let i=0;i<n;i++){
    const np=new Array(poly.length+1).fill(0);
    for(let j=0;j<poly.length;j++){
      np[j] ^= poly[j];
      np[j+1] ^= qrMul(poly[j], QR_EXP[i]);
    }
    poly=np;
  }
  return poly;
}
function qrRS(data, ecLen){
  const gen=qrGenPoly(ecLen);
  const res=new Array(ecLen).fill(0);
  for(let i=0;i<data.length;i++){
    const factor = data[i] ^ res[0];
    res.shift(); res.push(0);
    if(factor!==0) for(let j=0;j<ecLen;j++) res[j] ^= qrMul(gen[j+1], factor);
  }
  return res;
}
function qrEncodeData(text){
  qrInitGF();
  let utf8='';
  try{ utf8 = unescape(encodeURIComponent(String(text))); }catch(e){ utf8 = String(text); }
  const bytes=[]; for(let i=0;i<utf8.length;i++) bytes.push(utf8.charCodeAt(i)&0xff);
  let ver=0, totalData=0;
  for(let v=1;v<=10;v++){
    const td = QR_L_BLOCKS[v].reduce((s,b)=>s+b[0]*b[1],0);
    const cclen = v<10? 8:16;
    const cap = Math.floor((td*8 - 4 - cclen)/8);
    if(bytes.length<=cap){ ver=v; totalData=td; break; }
  }
  if(!ver) return null;
  const cclen = ver<10? 8:16;
  const bits=[];
  const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  put(4,4); put(bytes.length,cclen);
  bytes.forEach(b=>put(b,8));
  const capBits = totalData*8;
  for(let i=0;i<4 && bits.length<capBits;i++) bits.push(0);
  while(bits.length%8) bits.push(0);
  const dataCw=[];
  for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; dataCw.push(b); }
  const pads=[0xEC,0x11]; let pi=0;
  while(dataCw.length<totalData) dataCw.push(pads[pi++%2]);
  const ecLen = QR_L_ECC[ver];
  const blocks=[]; let idx=0;
  QR_L_BLOCKS[ver].forEach(pair=>{
    const cnt=pair[0], dlen=pair[1];
    for(let i=0;i<cnt;i++){ const d=dataCw.slice(idx, idx+dlen); idx+=dlen; blocks.push({d:d, e:qrRS(d, ecLen)}); }
  });
  const maxD = Math.max.apply(null, blocks.map(b=>b.d.length));
  const final=[];
  for(let i=0;i<maxD;i++) blocks.forEach(b=>{ if(i<b.d.length) final.push(b.d[i]); });
  for(let i=0;i<ecLen;i++) blocks.forEach(b=> final.push(b.e[i]));
  return {ver:ver, cw:final};
}
function qrFormatBits(mask){
  let data = (1<<3)|mask; // ECC L = 01
  let rem = data;
  for(let i=0;i<10;i++) rem = (rem<<1) ^ ((rem>>>9)*0x537);
  return ((data<<10)|rem) ^ 0x5412;
}
function qrMaskFn(k,r,c){
  switch(k){
    case 0: return (r+c)%2===0;
    case 1: return r%2===0;
    case 2: return c%3===0;
    case 3: return (r+c)%3===0;
    case 4: return (Math.floor(r/2)+Math.floor(c/3))%2===0;
    case 5: return ((r*c)%2 + (r*c)%3)===0;
    case 6: return ((((r*c)%2) + ((r*c)%3))%2)===0;
    default: return ((((r+c)%2) + ((r*c)%3))%2)===0;
  }
}
function qrPenalty(m){
  const n=m.length; let p=0;
  const runScore = line=>{
    let s=0, run=1;
    for(let i=1;i<n;i++){
      if(line[i]===line[i-1]) run++;
      else { if(run>=5) s += 3 + (run-5); run=1; }
    }
    if(run>=5) s += 3 + (run-5);
    return s;
  };
  for(let r=0;r<n;r++) p += runScore(m[r]);
  for(let c=0;c<n;c++){ const col=[]; for(let r=0;r<n;r++) col.push(m[r][c]); p += runScore(col); }
  for(let r=0;r<n-1;r++) for(let c=0;c<n-1;c++){
    const v=m[r][c];
    if(v===m[r][c+1] && v===m[r+1][c] && v===m[r+1][c+1]) p += 3;
  }
  const pat=[1,0,1,1,1,0,1,0,0,0,0];
  const match=(arr,i)=>{ for(let k=0;k<11;k++) if(arr[i+k]!==pat[k]) return false; return true; };
  const matchR=(arr,i)=>{ for(let k=0;k<11;k++) if(arr[i+k]!==pat[10-k]) return false; return true; };
  for(let r=0;r<n;r++) for(let i=0;i+11<=n;i++){ if(match(m[r],i)||matchR(m[r],i)) p += 40; }
  for(let c=0;c<n;c++){ const col=[]; for(let r=0;r<n;r++) col.push(m[r][c]);
    for(let i=0;i+11<=n;i++){ if(match(col,i)||matchR(col,i)) p += 40; } }
  let dark=0; for(let r=0;r<n;r++) for(let c=0;c<n;c++) dark+=m[r][c];
  const pct = dark*100/(n*n);
  p += Math.floor(Math.abs(pct-50)/5)*10;
  return p;
}
function qrBuild(text){
  const enc = qrEncodeData(text);
  if(!enc) return null;
  const ver=enc.ver, size=17+4*ver;
  const m=[], res=[];
  for(let i=0;i<size;i++){ m.push(new Array(size).fill(0)); res.push(new Array(size).fill(false)); }
  const setF=(r,c,v)=>{ if(r<0||c<0||r>=size||c>=size) return; m[r][c]=v; res[r][c]=true; };
  const finder=(r0,c0)=>{
    for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){
      const rr=r0+r, cc=c0+c;
      if(rr<0||cc<0||rr>=size||cc>=size) continue;
      const inside = r>=0&&r<=6&&c>=0&&c<=6;
      let v=0;
      if(inside) v = (r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4))?1:0;
      setF(rr,cc,v);
    }
  };
  finder(0,0); finder(0,size-7); finder(size-7,0);
  for(let i=8;i<size-8;i++){ setF(6,i,(i%2===0)?1:0); setF(i,6,(i%2===0)?1:0); }
  const al=QR_ALIGN[ver];
  for(let i=0;i<al.length;i++) for(let j=0;j<al.length;j++){
    const r=al[i], c=al[j];
    if((r<=7&&c<=7)||(r<=7&&c>=size-8)||(r>=size-8&&c<=7)) continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++)
      setF(r+dr,c+dc, (Math.max(Math.abs(dr),Math.abs(dc))!==1)?1:0);
  }
  setF(size-8,8,1);
  for(let i=0;i<9;i++){ if(!res[8][i]) setF(8,i,0); if(!res[i][8]) setF(i,8,0); }
  for(let i=0;i<8;i++){ if(!res[8][size-1-i]) setF(8,size-1-i,0); if(!res[size-1-i][8]) setF(size-1-i,8,0); }
  if(ver>=7){
    let rem = ver;
    for(let i=0;i<12;i++) rem = (rem<<1) ^ ((rem>>>11)*0x1F25);
    const vbits = (ver<<12)|rem;
    for(let i=0;i<18;i++){
      const bit=(vbits>>i)&1;
      setF(Math.floor(i/3), size-11+(i%3), bit);
      setF(size-11+(i%3), Math.floor(i/3), bit);
    }
  }
  const cw=enc.cw;
  let bitIdx=0;
  const getBit=()=>{ if(bitIdx>=cw.length*8) return 0; const b=cw[bitIdx>>3]; const v=(b>>>(7-(bitIdx&7)))&1; bitIdx++; return v; };
  let upward=true;
  for(let col=size-1; col>=1; col-=2){
    if(col===6) col--;
    for(let i=0;i<size;i++){
      const row = upward? size-1-i : i;
      for(let k=0;k<2;k++){
        const c=col-k;
        if(c>=0 && !res[row][c]) m[row][c]=getBit();
      }
    }
    upward=!upward;
  }
  let best=null;
  for(let mask=0;mask<8;mask++){
    const t=[]; for(let r=0;r<size;r++) t.push(m[r].slice());
    for(let r=0;r<size;r++) for(let c=0;c<size;c++)
      if(!res[r][c] && qrMaskFn(mask,r,c)) t[r][c]^=1;
    const f=qrFormatBits(mask);
    const bit=i=>(f>>i)&1;
    // النسخة الأولى — (عمود، صف) بترتيب المواصفة
    for(let i=0;i<=5;i++) t[i][8]=bit(i);
    t[7][8]=bit(6); t[8][8]=bit(7); t[8][7]=bit(8);
    for(let i=9;i<15;i++) t[8][14-i]=bit(i);
    // النسخة التانية
    for(let i=0;i<8;i++) t[8][size-1-i]=bit(i);
    for(let i=8;i<15;i++) t[size-15+i][8]=bit(i);
    t[size-8][8]=1;
    const pen=qrPenalty(t);
    if(!best || pen<best.pen) best={pen:pen, m:t};
  }
  return {size:size, modules:best.m};
}
function qrSVG(text, opts){
  opts = opts||{};
  const scale = opts.scale||4, quiet = opts.quiet!=null? opts.quiet : 4;
  const q = qrBuild(text);
  if(!q) return '';
  const total = (q.size + quiet*2) * scale;
  let path='';
  for(let r=0;r<q.size;r++) for(let c=0;c<q.size;c++){
    if(q.modules[r][c]) path += 'M'+((c+quiet)*scale)+' '+((r+quiet)*scale)+'h'+scale+'v'+scale+'h-'+scale+'z';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+total+'" height="'+total+'" viewBox="0 0 '+total+' '+total+'" shape-rendering="crispEdges">'
    + '<rect width="'+total+'" height="'+total+'" fill="#fff"/><path d="'+path+'" fill="#000"/></svg>';
}

let pendingCustomerCb = null;
function submitCustomer(id){
  const name = document.getElementById('cu-name').value.trim();
  const code = document.getElementById('cu-code').value.trim();
  const phone = document.getElementById('cu-phone').value.trim();
  const defaultKarat = parseFloat(document.getElementById('cu-karat').value)||BASE_KARAT;
  if(!name){ toast('أدخل اسم العميل'); return; }
  if(!code){ toast('الكود مطلوب'); return; }
  if(state.customers.some(c=>c.code===code && c.id!==id)){ toast('الكود ده مستخدم بالفعل'); return; }
  let newId=null;
  mutate(()=>{
    if(id){
      const c = customerById(id);
      c.name=name; c.code=code; c.phone=phone; c.defaultKarat=defaultKarat;
    } else {
      newId = uid('cus');
      state.customers.push({id:newId, code, name, phone, defaultKarat, balanceCash:0, balanceGold: emptyGoldMap()});
      state.counters.customer++;
    }
  }, id?'تم حفظ بيانات العميل':'تمت إضافة العميل وتكويده تلقائيًا');
  closeModal();
  if(!id && newId && pendingCustomerCb){ const cb=pendingCustomerCb; pendingCustomerCb=null; cb(newId); }
}
function deleteCustomer(id){
  showConfirmModal('هل تريد حذف هذا العميل؟ لن يتم حذف الفواتير المرتبطة به.', ()=>{
    mutate(()=>{ state.customers = state.customers.filter(c=>c.id!==id); }, 'تم حذف العميل');
    closeModal();
  }, {confirmLabel:'حذف العميل'});
}

function submitCCPTransaction(kind){
  const isCollect = kind==='collect';
  const partyId = document.getElementById('ccp-party').value;
  const items = collectGoldItems('ccp');
  const cash = parseFloat(document.getElementById('ccp-cash').value)||0;
  const cashMode = document.getElementById('ccp-cashmode').value;
  const note = document.getElementById('ccp-note').value.trim();
  if(cash<=0 && !items.length){ toast('أدخل مبلغًا نقديًا أو وزن ذهب'); return; }
  mutate(()=>{
    const c = customerById(partyId);
    const balSign = isCollect? -1 : 1;
    const trSign  = isCollect? 1 : -1;
    if(cash>0){ c.balanceCash += balSign*cash; if(cashMode==='treasury') state.treasury.cash += trSign*cash; }
    items.forEach(it=>{
      c.balanceGold[it.karat] = (c.balanceGold[it.karat]||0) + balSign*it.weight;
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + trSign*it.weight;
    });
    const rec = {id:uid(kind), no: isCollect? state.counters.collection++ : state.counters.payment++, date:todayStr(),
      partyKind:'customer', customerId:partyId, merchantId:null, cash, cashMode, items, note};
    if(isCollect) state.collections.push(rec); else state.payments.push(rec);
  }, isCollect? 'تم تسجيل التحصيل من العميل' : 'تم تسجيل التسديد للعميل');
  closeModal();
}

        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
          <button class="btn btn-gold" onclick="submitLot('${l? l.dir : dir}', ${l?`'${l.id}'`:'null'})">${l?'حفظ التعديل':(dir==='buy'?'تسجيل الشراء':'تسجيل البيع')}</button>
        </div>
      </div>
    </div>`;
  recalcLot();
  const w=document.getElementById('lot-weight'); if(w) w.focus();
}
function recalcLot(){
  const kEl=document.getElementById('lot-karat'); if(!kEl) return;
  const k=parseFloat(kEl.value)||BASE_KARAT;
  const w=parseFloat(document.getElementById('lot-weight').value)||0;
  const p=parseFloat(document.getElementById('lot-price').value)||0;
  const w21=to21(w,k);
  document.getElementById('lot-w21').value = w21.toFixed(3);
  document.getElementById('lot-value').value = (w21*p).toFixed(2);
  document.getElementById('lot-priceK').value = (p*BASE_KARAT/k).toFixed(2);
}
function applyLotEffect(l, sign){
  // sign = +1 لتطبيق القيد، -1 لعكسه
  const party = lotPartyObj(l);
  const dirSign = l.dir==='buy'? 1 : -1;   // شراء: ذهب داخل
  const w = l.weight, k = l.karat;
  state.treasury.gold[k] = (state.treasury.gold[k]||0) + sign*dirSign*w;
  if(party) party.balanceGold[k] = (party.balanceGold[k]||0) - sign*dirSign*w;
  const cash = l.cashNow||0, rest = (l.value||0) - cash;
  state.treasury.cash += sign*(l.dir==='buy'? -cash : cash);
  if(party) party.balanceCash += sign*(l.dir==='buy'? -rest : rest);
}
function submitLot(dir, editId){
  const partyKind = document.getElementById('lot-kind').value;
  const partyId = document.getElementById('lot-party').value;
  const karat = parseFloat(document.getElementById('lot-karat').value)||BASE_KARAT;
  const weight = parseFloat(document.getElementById('lot-weight').value)||0;
  const price21 = parseFloat(document.getElementById('lot-price').value)||0;
  const employee = document.getElementById('lot-emp').value.trim();
  const note = document.getElementById('lot-note').value.trim();
  let cashNow = parseFloat(document.getElementById('lot-cash').value)||0;
  if(weight<=0){ toast('أدخل وزن القطع'); return; }
  if(price21<=0){ toast('أدخل سعر الجرام بعيار '+BASE_KARAT); return; }
  if(!partyId){ toast('اختر الجهة'); return; }
  const weight21 = to21(weight, karat);
  const value = weight21*price21;
  cashNow = Math.max(0, Math.min(cashNow, value));
  mutate(()=>{
    if(editId){
      const old = state.goldLots.find(x=>x.id===editId);
      if(old) applyLotEffect(old, -1);
      Object.assign(old, {partyKind, partyId, karat, weight, weight21, pricePerGram21:price21, value, cashNow, employee, note});
      applyLotEffect(old, +1);
    } else {
      const rec = {id:uid('lot'), no:state.counters.lot++, date:todayStr(), createdAt:new Date().toISOString(),
        dir, partyKind, partyId, karat, weight, weight21, pricePerGram21:price21, value, cashNow, employee, note};
      state.goldLots.push(rec);
      applyLotEffect(rec, +1);
    }
    if(employee){ state.employees = state.employees||[]; if(!state.employees.includes(employee)) state.employees.push(employee); }
  }, editId? 'تم حفظ تعديل حركة القطع' : (dir==='buy'? 'تم تسجيل شراء القطع' : 'تم تسجيل بيع القطع'));
  closeModal();
}
function editLot(id){
  const l = state.goldLots.find(x=>x.id===id);
  if(!l) return;
  uiState.lotPartyKind = l.partyKind;
  openLotModal(l.dir, id);
}
function deleteLot(id){
  const l = state.goldLots.find(x=>x.id===id);
  if(!l) return;
  showConfirmModal('حذف حركة القطع #'+l.no+'؟ هيتعكس قيدها بالكامل من الخزينة ومن حساب '+(l.partyKind==='customer'?'العميل':'التاجر')+'.', ()=>{
    mutate(()=>{
      applyLotEffect(l, -1);
      state.goldLots = state.goldLots.filter(x=>x.id!==id);
    }, 'تم حذف الحركة وعكس قيدها');
    closeModal();
  }, {confirmLabel:'حذف الحركة'});
}

function invoiceQRPayload(kind, inv){
  // kind: CS = فاتورة مبيعات عميل، CR = مرتجع عميل، MS = مبيعات تاجر، MR = مرتجع تاجر
  return 'GS|'+kind+'|'+inv.no+'|'+inv.id;
}
function findInvoiceByQR(text){
  text = String(text||'').trim();
  if(!text) return null;
  let kind=null, no=null, id=null;
  if(text.indexOf('|')>=0){
    const p = text.split('|');
    if(p[0]==='GS'){ kind=p[1]; no=parseInt(p[2],10); id=p[3]||null; }
  } else {
    no = parseInt(text,10);
  }
  const buckets = [
    {k:'CS', arr:state.customerSales, label:'فاتورة مبيعات عميل'},
    {k:'CR', arr:state.customerReturns, label:'فاتورة مرتجعات عميل'},
    {k:'MS', arr:state.salesInvoices, label:'فاتورة مبيعات لتاجر'},
    {k:'MR', arr:state.merchantReturns, label:'فاتورة مرتجعات من تاجر'},
  ];
  for(const b of buckets){
    if(kind && b.k!==kind) continue;
    let inv = id? b.arr.find(x=>x.id===id) : null;
    if(!inv && !isNaN(no)) inv = b.arr.find(x=>Number(x.no)===no);
    if(inv) return {kind:b.k, label:b.label, inv:inv};
  }
  return null;
}

function openCustomerSaleBuilder(force){
  if(force || !csb) csb = { customerId: null, items: [] };
  saveCsbDraft();
  goto('customer-sale-builder');
}
function resumeCustomerSaleBuilder(){ goto('customer-sale-builder'); }
function saveCsbDraft(){
  state.drafts = state.drafts || {};
  state.drafts.customerSale = csb? JSON.parse(JSON.stringify(csb)) : null;
  persist();
}
function discardCsbDraft(){
  showConfirmModal('تلغي الفاتورة المفتوحة وتبدأ من الأول؟', ()=>{
    csb = null; saveCsbDraft(); closeModal(); render();
  }, {confirmLabel:'إلغاء الفاتورة'});
}
function addCustomerSalePieceByScan(){
  const input = document.getElementById('csb-scan');
  const raw = input? input.value : '';
  const piece = findPieceByScan(raw);
  if(!piece){ toast('الباركود ده مش موجود في القطع'); if(input){input.value=''; input.focus();} return; }
  if(piece.sold){ toast('القطعة دي متباعة قبل كده'); if(input){input.value=''; input.focus();} return; }
  if(csb.items.some(x=>x.pieceId===piece.id)){ toast('القطعة دي مضافة في الفاتورة بالفعل'); if(input){input.value=''; input.focus();} return; }
  const rate = pieceSellMakingRate(piece);
  const goldRate = goldSellPrice(piece.karat);
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  csb.items.push({
    pieceId:piece.id, no:piece.no, code:pieceCode(piece), itemName:pieceLabel(piece),
    classificationId: piece.classificationId || (prod? prod.classificationId : null),
    itemTypeId: piece.itemTypeId || (prod? prod.itemTypeId : null),
    karat:piece.karat, weight:piece.weight, origWeight:piece.weight,
    goldRate, rate, minRate: rate,
    goldValue: piece.weight*goldRate,
    making: piece.weight*rate,
    lineTotal: piece.weight*(goldRate+rate),
    barcodeValue:piece.barcodeValue
  });
  if(input) input.value='';
  saveCsbDraft();
  refocusAfterRender('csb-scan');
  render();
}
function removeCustomerSaleLine(pieceId){ csb.items = csb.items.filter(x=>x.pieceId!==pieceId); saveCsbDraft(); refocusAfterRender('csb-scan'); render(); }
function pieceSellMakingRate(piece){
  const pc = piece.priceCategoryId? state.priceCategories.find(x=>x.id===piece.priceCategoryId) : null;
  if(pc) return pcSellPrice(pc);
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  if(prod){ const p2 = state.priceCategories.find(x=>x.id===prod.priceCategoryId); if(p2) return pcSellPrice(p2); }
  return pieceMakingRate(piece);
}
function recalcCsbLine(it){
  it.goldValue = it.weight * (Number(it.goldRate)||0);
  it.making    = it.weight * (Number(it.rate)||0);
  it.lineTotal = it.goldValue + it.making;
}
function setCustomerSaleWeight(pieceId, val){
  const it = csb.items.find(x=>x.pieceId===pieceId);
  if(!it) return;
  let v = parseFloat(val)||0;
  const max = Number(it.origWeight!=null? it.origWeight : it.weight)||0;
  if(v<=0){ toast('الوزن لازم يكون أكبر من صفر'); render(); return; }
  if(v > max + 0.0005){ v = max; toast('الوزن مينفعش يكون أكبر من وزن القطعة المكودة ('+fmtW(max)+')'); }
  it.weight = v; recalcCsbLine(it); saveCsbDraft(); render();
}
function csbMinRate(it){ return Number(it.minRate!=null? it.minRate : 0)||0; }
function setCustomerSaleRate(pieceId, val){
  const it = csb.items.find(x=>x.pieceId===pieceId);
  if(!it) return;
  let v = parseFloat(val)||0;
  const mn = csbMinRate(it);
  if(v < mn - 0.0001){ v = mn; toast('أجر الجرام مينفعش يقل عن السعر التلقائي ('+fmtCash(mn)+')'); }
  it.rate = v; recalcCsbLine(it); saveCsbDraft(); render();
}
function setCustomerSaleLineTotal(pieceId, val){
  const it = csb.items.find(x=>x.pieceId===pieceId);
  if(!it) return;
  const target = parseFloat(val)||0;
  const gold = it.weight * (Number(it.goldRate)||0);
  let making = target - gold;
  let rate = it.weight? making/it.weight : 0;
  const mn = csbMinRate(it);
  if(rate < mn - 0.0001){ rate = mn; toast('الإجمالي ده بيخلي أجر الجرام أقل من السعر التلقائي ('+fmtCash(mn)+')'); }
  it.rate = rate; recalcCsbLine(it); csb.manualTotal = null; saveCsbDraft(); render();
}
function csbSetPrice21(val){
  const v = parseFloat(val)||0;
  csb.price21 = v;
  csb.items.forEach(it=>{ it.goldRate = v * (Number(it.karat)||BASE_KARAT) / BASE_KARAT; recalcCsbLine(it); });
  saveCsbDraft(); render();
}
function csbSetNote(val){ if(!csb) return; csb.note = String(val||''); saveCsbDraft(); }
function csbSetManualTotal(val){
  const v = (val===''||val==null)? null : (parseFloat(val)||0);
  csb.manualTotal = v; saveCsbDraft(); render();
}
function csbEffectiveTotal(){
  const auto = csb.items.reduce((s,i)=>s+(i.lineTotal||0),0);
  return (csb.manualTotal!=null && csb.manualTotal!=='')? Number(csb.manualTotal)||0 : auto;
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
/* الرقم اللي بتكتبه في التوزيع هو إجمالي الفاتورة بالظبط:
   بنطرح منه قيمة الذهب، والباقي (الأجر) بيتوزع على القطع بنسبة الوزن،
   وآخر سطر بياخد فرق التقريب عشان المجموع يطلع مساوي للرقم للقرش. */
function csbDistribute(){
  const el = document.getElementById('csb-distribute');
  const amount = round2(parseFloat(el? el.value : '')||0);
  if(!csb.items.length){ toast('مفيش قطع في الفاتورة'); return; }
  if(amount<=0){ toast('اكتب إجمالي الفاتورة الأول'); return; }
  const totalW = csb.items.reduce((s,i)=>s+i.weight,0);
  if(totalW<=0){ toast('وزن الفاتورة صفر'); return; }
  csb.items.forEach(it=>{ it.goldValue = it.weight*(Number(it.goldRate)||0); });
  const goldTotal = round2(csb.items.reduce((s,i)=>s+i.goldValue,0));
  let pool = round2(amount - goldTotal);
  let belowGold = false, belowMin = false;
  if(pool < 0){ pool = 0; belowGold = true; }
  let acc = 0;
  const last = csb.items.length - 1;
  csb.items.forEach((it,idx)=>{
    let making;
    if(idx===last){ making = round2(pool - acc); }
    else { making = round2(pool * (it.weight/totalW)); acc = round2(acc + making); }
    it.making   = making;
    it.rate     = it.weight? making/it.weight : 0;
    it.lineTotal= round2(it.goldValue + making);
    if(it.rate < csbMinRate(it) - 0.0001) belowMin = true;
  });
  csb.distribute = amount;
  csb.manualTotal = amount;
  saveCsbDraft(); render();
  if(belowGold) toast('الرقم ده أقل من قيمة الذهب نفسها — الأجر اتصفّر، راجع سعر الجرام');
  else if(belowMin) toast('اتوزع على '+csb.items.length+' قطعة — لاحظ إن أجر بعض القطع نزل تحت السعر التلقائي');
  else toast('اتوزع على '+csb.items.length+' قطعة — إجمالي الفاتورة '+fmtCash(amount));
}

  const it = csb.items.find(x=>x.pieceId===pieceId);
  if(!it) return;
  it.goldRate = parseFloat(val)||0; recalcCsbLine(it); saveCsbDraft(); render();
}

function submitCustomerSale(){
  if(!csb.items.length){ toast('امسح قطعة واحدة على الأقل'); return; }
  if(!csb.customerId){ toast('اختر العميل الأول من فوق'); return; }
  const totalWeight = csb.items.reduce((s,i)=>s+i.weight,0);
  const totalMaking = csb.items.reduce((s,i)=>s+i.making,0);
  const totalGoldValue = csb.items.reduce((s,i)=>s+(i.goldValue||0),0);
  const totalAll = csbEffectiveTotal();
  const effMaking = totalAll - totalGoldValue;
  const noteEl = document.getElementById('csb-note');
  if(noteEl) csb.note = noteEl.value||'';
  const note = csb.note||'';
  const paidEl = document.getElementById('csb-paid');
  let paid = paidEl? (parseFloat(paidEl.value)||0) : totalAll;
  paid = Math.max(0, Math.min(paid, totalAll));
  const items = csb.items, customerId = csb.customerId;
  let savedId = null;
  mutate(()=>{
    const c = customerById(customerId);
    items.forEach(it=>{
      const orig = Number(it.origWeight!=null? it.origWeight : it.weight)||it.weight;
      const remainder = Math.max(0, orig - it.weight);
      state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) - it.weight;
      c.balanceGold[it.karat] = (c.balanceGold[it.karat]||0) + it.weight;
      const pc = state.pieces.find(x=>x.id===it.pieceId);
      if(pc){ pc.sold=true; pc.soldDate=todayStr(); pc.soldToCustomerId=customerId; pc.soldKind='customer'; }
      if(remainder>0.0005){ state.scrapStock[it.karat] = (state.scrapStock[it.karat]||0) + remainder; it.remainderToScrap = remainder; }
    });
    state.treasury.cash += paid;
    c.balanceCash += (totalAll - paid);
    const invItems = items.map(it=>({pieceId:it.pieceId, pieceNo:it.no, karat:it.karat, weight:it.weight, origWeight:it.origWeight||it.weight, remainderToScrap:it.remainderToScrap||0,
      goldRate:it.goldRate, goldValue:it.goldValue,
      price:it.rate, makingPerGram:it.rate, making:it.making, total:it.lineTotal, productCode:it.code,
      itemName:it.itemName, barcodeValue:it.barcodeValue, classificationId:it.classificationId||null, itemTypeId:it.itemTypeId||null}));
    savedId = uid('csale');
    state.customerSales.push({id:savedId, no:state.counters.custSale++, date:todayStr(), createdAt:new Date().toISOString(),
      customerId, items:invItems, note, totalCash:totalAll, totalMaking:effMaking, totalGoldValue, totalAll, totalWeight, amountPaidNow:paid});
  }, 'تم حفظ فاتورة العميل');
  csb = null; saveCsbDraft();
  goto('customer-sales');
  if(savedId) setTimeout(()=>showInvoiceQR('CS', savedId), 120);
}
function deleteCustomerSale(id){
  const inv = state.customerSales.find(x=>x.id===id);
  if(!inv) return;
  showConfirmModal('حذف فاتورة العميل #'+inv.no+'؟ هيترجع الوزن للمخزون، وتتلغي قيود الحساب، والقطع هترجع متاحة للبيع.', ()=>{
    mutate(()=>{
      const c = customerById(inv.customerId);
      (inv.items||[]).forEach(it=>{
        state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + it.weight;
        if(c) c.balanceGold[it.karat] = (c.balanceGold[it.karat]||0) - it.weight;
        if(it.remainderToScrap>0.0005){ state.scrapStock[it.karat] = (state.scrapStock[it.karat]||0) - it.remainderToScrap; }
        const pc = state.pieces.find(x=>x.id===it.pieceId);
        if(pc){ pc.sold=false; delete pc.soldDate; delete pc.soldToCustomerId; delete pc.soldKind; }
      });
      state.treasury.cash -= (inv.amountPaidNow||0);
      if(c) c.balanceCash -= (((inv.totalAll!=null? inv.totalAll : (inv.totalCash||inv.totalMaking||0))) - (inv.amountPaidNow||0));
      state.customerSales = state.customerSales.filter(x=>x.id!==id);
    }, 'تم حذف الفاتورة وعكس قيدها');
    closeModal();
  }, {confirmLabel:'حذف الفاتورة'});
}

/* فتح فاتورة متسجلة تاني للتعديل: بنعكس قيدها ونرجّع بنودها في شاشة الفاتورة */
function reopenInvoice(kind, id){
  if(kind==='CS'){
    const inv = state.customerSales.find(x=>x.id===id);
    if(!inv) return;
    const sold = (inv.items||[]).filter(it=>{
      const pc = state.pieces.find(x=>x.id===it.pieceId);
      return pc && pc.sold && pc.soldToCustomerId!==inv.customerId;
    }).length;
    if(sold){ toast('مينفعش — فيه قطع من الفاتورة اتباعت في مكان تاني'); return; }
    showConfirmModal('هتفتح فاتورة العميل #'+inv.no+' تاني للتعديل. قيدها هيتشال دلوقتي، ولما تحفظ هيتسجل من جديد. تمام؟', ()=>{
      mutate(()=>{
        const c = customerById(inv.customerId);
        (inv.items||[]).forEach(it=>{
          state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + it.weight;
          if(c) c.balanceGold[it.karat] = (c.balanceGold[it.karat]||0) - it.weight;
          const pc = state.pieces.find(x=>x.id===it.pieceId);
          if(pc){ pc.sold=false; delete pc.soldDate; delete pc.soldToCustomerId; delete pc.soldKind; }
        });
        state.treasury.cash -= (inv.amountPaidNow||0);
        const grand = Number(inv.totalAll!=null? inv.totalAll : (inv.totalCash||inv.totalMaking||0))||0;
        if(c) c.balanceCash -= (grand - (inv.amountPaidNow||0));
        state.customerSales = state.customerSales.filter(x=>x.id!==id);
        csb = {
          customerId: inv.customerId,
          items: (inv.items||[]).map(it=>({
            pieceId:it.pieceId, no:it.pieceNo, code:it.productCode, itemName:it.itemName,
            classificationId:it.classificationId||null, itemTypeId:it.itemTypeId||null,
            karat:it.karat, weight:it.weight,
            goldRate: Number(it.goldRate)||0, rate: Number(it.makingPerGram!=null? it.makingPerGram : it.price)||0,
            goldValue: (Number(it.goldValue)||0) || (it.weight*(Number(it.goldRate)||0)),
            making: Number(it.making)||0,
            lineTotal: (it.weight*((Number(it.goldRate)||0)+(Number(it.makingPerGram!=null? it.makingPerGram : it.price)||0))),
            minRate: (function(){ const pcx = state.pieces.find(x=>x.id===it.pieceId); return pcx? pieceSellMakingRate(pcx) : 0; })(),
            barcodeValue:it.barcodeValue
          })),
          note: inv.note||'',
          manualTotal: (Number(inv.totalAll)||0) || null,
          price21: (function(){ const f=(inv.items||[])[0]; return f && f.goldRate? (Number(f.goldRate)*BASE_KARAT/(Number(f.karat)||BASE_KARAT)) : null; })()
        };
        state.drafts = state.drafts||{}; state.drafts.customerSale = JSON.parse(JSON.stringify(csb));
      }, 'اتفتحت الفاتورة #'+inv.no+' للتعديل');
      closeModal();
      uiState.qrResult = undefined;
      goto('customer-sale-builder');
    }, {confirmLabel:'افتحها للتعديل', danger:false});
    return;
  }
  toast('التعديل متاح دلوقتي لفواتير مبيعات العملاء');
}

/* عمل مرتجع لقطعة من فاتورة معيّنة — بيفتح شاشة المرتجع محمّلة بقطع الفاتورة */
function returnFromInvoice(kind, id){
  const isCust = kind==='CS';
  const inv = (isCust? state.customerSales : state.salesInvoices).find(x=>x.id===id);
  if(!inv) return;
  const rkind = isCust? 'customer' : 'merchant';
  const cfg = returnCfg(rkind);
  rb = { kind:rkind, partyId: isCust? inv.customerId : inv.merchantId, items: [], sourceInvoiceNo: inv.no };
  uiState.returnPickInvoice = {kind, id};
  uiState.qrResult = undefined;
  goto(cfg.builderView);
  toast('اختر القطع اللي هترجع من فاتورة #'+inv.no);
}
function rbAddFromSourceInvoice(pieceId){
  const src = uiState.returnPickInvoice;
  if(!src) return;
  const inv = (src.kind==='CS'? state.customerSales : state.salesInvoices).find(x=>x.id===src.id);
  if(!inv) return;
  const it = (inv.items||[]).find(x=>x.pieceId===pieceId);
  if(!it){ toast('القطعة مش في الفاتورة دي'); return; }
  if(rb.items.some(x=>x.pieceId===pieceId)){ toast('مضافة بالفعل'); return; }
  const piece = state.pieces.find(x=>x.id===pieceId);
  if(!piece || !piece.sold){ toast('القطعة دي مش متباعة حاليًا'); return; }
  rb.items.push({
    pieceId, no:it.pieceNo, code:it.productCode, itemName:it.itemName,
    classificationId:it.classificationId||null, itemTypeId:it.itemTypeId||null,
    karat:it.karat, weight:it.weight,
    rate: Number(it.makingPerGram!=null? it.makingPerGram : it.price)||0,
    making: Number(it.making)||0,
    barcodeValue:it.barcodeValue
  });
  render();
}
function renderReturnSourcePicker(){
  const src = uiState.returnPickInvoice;
  if(!src || !rb) return '';
  const inv = (src.kind==='CS'? state.customerSales : state.salesInvoices).find(x=>x.id===src.id);
  if(!inv) return '';
  return `
    <div class="card" style="margin-bottom:16px;border-color:var(--navy);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
        <div style="font-weight:800;color:var(--navy);">قطع فاتورة #${inv.no} — اضغط على القطعة عشان تضيفها للمرتجع</div>

      </div>
      <div class="kv-inline">

          const added = rb.items.some(x=>x.pieceId===it.pieceId);

        }).join('')}
      </div>
    </div>`;
}

/* ============================= تقارير الفواتير ============================= */
function invTotalOf(inv){
  return Number(inv.totalAll!=null? inv.totalAll : (inv.totalCash!=null? inv.totalCash : (inv.totalMaking||0)))||0;
}
function repRange(){
  return [uiState.repInvFrom||'', uiState.repInvTo||''];
}
function repInvFilter(list, partyFilter){
  const [from,to] = repRange();
  const q = (uiState.repInvSearch||'').trim().toLowerCase();
  return list.filter(inv=>{
    const d = String(inv.date).slice(0,10);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(partyFilter && partyFilter!=='all' && inv.__party!==partyFilter) return false;
    if(q){
      const hay = ('#'+inv.no+' '+(inv.__partyName||'')+' '+(inv.items||[]).map(i=>i.itemName||'').join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function repCollect(kind){
  // kind: 'sales' | 'returns'
  const out = [];
  if(kind==='sales'){
    state.customerSales.forEach(i=> out.push(Object.assign({}, i, {__kind:'CS', __party:'customer', __partyName:customerName(i.customerId), __label:'مبيعات عميل'})));
    state.salesInvoices.forEach(i=> out.push(Object.assign({}, i, {__kind:'MS', __party:'merchant', __partyName:merchantName(i.merchantId), __label:'مبيعات تاجر'})));
  } else {
    state.customerReturns.forEach(i=> out.push(Object.assign({}, i, {__kind:'CR', __party:'customer', __partyName:customerName(i.customerId), __label:'مرتجع عميل'})));
    state.merchantReturns.forEach(i=> out.push(Object.assign({}, i, {__kind:'MR', __party:'merchant', __partyName:merchantName(i.merchantId), __label:'مرتجع تاجر'})));
  }
  return out.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.no-a.no);
}
function renderInvoicesReport(kind){
  const isSales = kind==='sales';
  const pf = uiState.repInvParty||'all';
  const all = repCollect(kind);
  const rows = repInvFilter(all, pf);
  const [from,to] = repRange();

  const sum = f => rows.reduce((s,x)=>s+(Number(f(x))||0),0);
  const totalW = sum(x=>x.totalWeight);
  const totalGold = sum(x=>x.totalGoldValue||0);
  const totalMaking = sum(x=>x.totalMaking||0);
  const totalAll = sum(invTotalOf);
  const totalPaid = sum(x=>x.amountPaidNow||0);
  const totalDue = totalAll - totalPaid;
  const pieces = rows.reduce((s,x)=>s+((x.items||[]).length),0);

  // تجميع بالعميل/التاجر
  const byParty = {};
  rows.forEach(r=>{
    const k = r.__partyName||'—';
    if(!byParty[k]) byParty[k] = {n:0, w:0, total:0, paid:0};
    byParty[k].n++; byParty[k].w += Number(r.totalWeight)||0;
    byParty[k].total += invTotalOf(r); byParty[k].paid += Number(r.amountPaidNow)||0;
  });
  const partyRows = Object.entries(byParty).sort((a,b)=> b[1].total-a[1].total);

  const parties = [['all','الكل'],['customer','عملاء'],['merchant','تجار']];
  return `
    <div class="pagehead">
      <div><h1>${isSales? 'تقرير الفواتير المباعة' : 'تقرير فواتير المرتجعات'}</h1>
        <p>${isSales? 'كل فواتير المبيعات (عملاء وتجار) بفلتر بالفترة والجهة' : 'كل فواتير المرتجعات (عملاء وتجار) بفلتر بالفترة والجهة'}</p></div>
      <button class="btn" onclick="printReportEl('rep-inv-table','${isSales?'تقرير الفواتير المباعة':'تقرير فواتير المرتجعات'}')">🖶 طباعة</button>
    </div>

    <div class="filterbar">
      <div class="fb-row">
        <div class="f"><span>من تاريخ</span><input type="date" value="${esc(from)}" onchange="uiState.repInvFrom=this.value;render();"></div>
        <div class="f"><span>إلى تاريخ</span><input type="date" value="${esc(to)}" onchange="uiState.repInvTo=this.value;render();"></div>
        <div class="f"><span>الجهة</span>
          <select onchange="uiState.repInvParty=this.value;render();">
            ${parties.map(([k,l])=>`<option value="${k}" ${pf===k?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="f grow"><span>بحث (رقم / اسم / صنف)</span>
          <input id="rep-inv-q" value="${esc(uiState.repInvSearch||'')}" placeholder="ابحث..." oninput="uiState.repInvSearch=this.value;refocusAfterRender('rep-inv-q');render();"></div>
        <div class="f auto"><span>&nbsp;</span><button class="btn btn-ghost btn-sm" onclick="uiState.repInvFrom='';uiState.repInvTo='';uiState.repInvParty='all';uiState.repInvSearch='';render();">↺ كل الفترات</button></div>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="card stat"><div class="label"><span>عدد الفواتير</span></div><div class="value">${rows.length}</div></div>
      <div class="card stat"><div class="label"><span>عدد القطع</span></div><div class="value">${pieces}</div></div>
      <div class="card stat"><div class="label"><span>إجمالي الوزن</span></div><div class="value">${totalW.toFixed(3)} <small>جم</small></div></div>
      <div class="card stat ${isSales?'pos':'neg'}"><div class="label"><span>${isSales?'إجمالي المبيعات':'إجمالي المرتجعات'}</span></div>
        <div class="value" style="display:flex;align-items:center;gap:10px;">${Number(totalAll).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}${copyBtn(totalAll.toFixed(2))}</div></div>
    </div>

    <div class="kv-inline" style="margin-top:12px;">
      <div class="kv-chip">قيمة الذهب: <b>${fmtCash(totalGold)}</b></div>
      <div class="kv-chip">إجمالي الأجر: <b>${fmtCash(totalMaking)}</b></div>
      <div class="kv-chip">${isSales?'المحصّل نقدًا':'المدفوع نقدًا'}: <b>${fmtCash(totalPaid)}</b></div>
      <div class="kv-chip">الباقي على الحساب: <b>${fmtCash(totalDue)}</b></div>
    </div>

    <div class="section-title">تجميع حسب ${pf==='merchant'?'التاجر':pf==='customer'?'العميل':'الجهة'}<div class="line"></div></div>
    <div class="tbl-wrap" style="margin-bottom:18px;">
      <table class="grid-table">
        <thead><tr><th>الاسم</th><th class="right">عدد الفواتير</th><th class="right">الوزن</th><th class="right">الإجمالي</th><th class="right">المحصّل</th><th class="right">الباقي</th></tr></thead>
        <tbody>
          ${partyRows.length? partyRows.map(([name,t])=>`
            <tr>
              <td style="font-weight:700;">${esc(name)}</td>
              <td class="right num">${t.n}</td>
              <td class="right num">${t.w.toFixed(3)} جم</td>
              <td class="right num" style="font-weight:700;color:var(--navy);">${fmtCash(t.total)}</td>
              <td class="right num">${fmtCash(t.paid)}</td>
              <td class="right num" style="color:${(t.total-t.paid)>0?'var(--red)':'var(--muted-2)'};">${fmtCash(t.total-t.paid)}</td>
            </tr>`).join('') : `<tr class="empty-row"><td colspan="6">لا توجد فواتير في الفترة دي</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="section-title">تفاصيل الفواتير<div class="line"></div></div>
    <div class="tbl-wrap" id="rep-inv-table">
      <table class="tl-table">
        <thead><tr>
          <th style="width:55px;">رقم</th><th style="width:95px;">التاريخ</th><th style="width:120px;">النوع</th>
          <th style="width:180px;">الاسم</th><th style="width:240px;">الأصناف</th>
          <th class="right" style="width:100px;">الوزن</th>
          <th class="right" style="width:115px;">قيمة الذهب</th>
          <th class="right" style="width:105px;">الأجر</th>
          <th class="right total-col" style="width:140px;">الإجمالي</th>
          <th class="right" style="width:120px;">المحصّل</th>
          <th style="width:150px;"></th>
        </tr></thead>
        <tbody>
          ${rows.length? rows.map(inv=>{
            const pills = invItemsSummary(inv.items,'gold');
            const tot = invTotalOf(inv);
            return `<tr>
              <td class="mono">#${inv.no}</td>
              <td class="muted num">${fmtDateRep(inv.date)}</td>
              <td><span class="pill ${inv.__party==='customer'?'pill-gold':'pill-muted'}">${esc(inv.__label)}</span></td>
              <td>${esc(inv.__partyName)}</td>
              <td>${pills}</td>
              <td class="right num">${Number(inv.totalWeight||0).toFixed(3)} جم</td>
              <td class="right num muted">${(inv.totalGoldValue||0)? fmtCash(inv.totalGoldValue) : '—'}</td>
              <td class="right num">${fmtCash(inv.totalMaking||0)}</td>
              <td class="right total-col"><span class="valwrap" style="justify-content:flex-start;">
                <b class="num" style="color:var(--navy);">${Number(tot).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</b>${copyBtn(tot.toFixed(2))}</span></td>
              <td class="right num">${fmtCash(inv.amountPaidNow||0)}</td>
              <td><div style="display:flex;gap:6px;justify-content:flex-end;">
                <button class="btn btn-sm btn-ghost" onclick="openInvoiceView('${inv.__kind}','${inv.id}')">تفاصيل</button>
                <button class="btn btn-sm btn-ghost" onclick="printInvoiceWithQR('${inv.__kind}','${inv.id}')">🖶</button>
              </div></td>
            </tr>`;
          }).join('') : `<tr class="empty-row"><td colspan="11">لا توجد فواتير في الفترة دي</td></tr>`}
        </tbody>
        ${rows.length? `<tfoot><tr>
          <td colspan="5">الإجمالي</td>
          <td class="right num">${totalW.toFixed(3)} جم</td>
          <td class="right num">${fmtCash(totalGold)}</td>
          <td class="right num">${fmtCash(totalMaking)}</td>
          <td class="right total-col num">${fmtCash(totalAll)}</td>
          <td class="right num">${fmtCash(totalPaid)}</td>
          <td></td>
        </tr></tfoot>`:''}
      </table>
    </div>
  `;
}
function renderSalesReport(){ return renderInvoicesReport('sales'); }
function renderReturnsReport(){ return renderInvoicesReport('returns'); }

/* ---------- تقرير مخزون القطع ---------- */
function renderPiecesReport(){
  const clsF = uiState.repPieceClass||'';
  const karatF = uiState.repPieceKarat||'';
  const statusF = uiState.repPieceStatus||'stock';
  const [from,to] = repRange();
  let rows = state.pieces.filter(p=>{
    const d = String(p.date).slice(0,10);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(clsF && p.classificationId!==clsF) return false;
    if(karatF && String(p.karat)!==String(karatF)) return false;
    if(statusF==='stock' && p.sold) return false;
    if(statusF==='sold' && !p.sold) return false;
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date) || b.no-a.no);

  const sum = f => rows.reduce((s,x)=>s+(Number(f(x))||0),0);
  const totalW = sum(p=>p.weight);
  const totalW21 = rows.reduce((s,p)=>s+to21(p.weight,p.karat),0);
  const now = Date.now();
  const ageDays = p=> Math.floor((now - new Date(p.date).getTime())/(24*3600*1000));
  const buckets = {'0-30':0,'31-90':0,'91-180':0,'180+':0};
  rows.filter(p=>!p.sold).forEach(p=>{
    const a = ageDays(p);
    if(a<=30) buckets['0-30']+=to21(p.weight,p.karat);
    else if(a<=90) buckets['31-90']+=to21(p.weight,p.karat);
    else if(a<=180) buckets['91-180']+=to21(p.weight,p.karat);
    else buckets['180+']+=to21(p.weight,p.karat);
  });

  const byClass = {};
  rows.forEach(p=>{
    const k = classificationName(p.classificationId)||'—';
    if(!byClass[k]) byClass[k] = {n:0, w:0, w21:0};
    byClass[k].n++; byClass[k].w += Number(p.weight)||0; byClass[k].w21 += to21(p.weight,p.karat);
  });
  const classRows = Object.entries(byClass).sort((a,b)=> b[1].w21-a[1].w21);

  return `
    <div class="pagehead">
      <div><h1>تقرير مخزون القطع</h1><p>كل القطع المسجلة بالكيو آر — في المخزن أو المباعة، بفلتر بالتصنيف والعيار وتاريخ التسجيل</p></div>
      <button class="btn" onclick="printReportEl('rep-pieces-table','تقرير مخزون القطع')">🖶 طباعة</button>
    </div>

    <div class="filterbar">
      <div class="fb-row">
        <div class="f"><span>من تاريخ</span><input type="date" value="${esc(from)}" onchange="uiState.repInvFrom=this.value;render();"></div>
        <div class="f"><span>إلى تاريخ</span><input type="date" value="${esc(to)}" onchange="uiState.repInvTo=this.value;render();"></div>
        <div class="f"><span>الحالة</span>
          <select onchange="uiState.repPieceStatus=this.value;render();">
            <option value="stock" ${statusF==='stock'?'selected':''}>في المخزن</option>
            <option value="sold" ${statusF==='sold'?'selected':''}>مباعة</option>
            <option value="" ${statusF===''?'selected':''}>الكل</option>
          </select>
        </div>
        <div class="f"><span>التصنيف</span>
          <select onchange="uiState.repPieceClass=this.value;render();">
            <option value="">الكل</option>
            ${state.classifications.map(c=>`<option value="${c.id}" ${clsF===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="f"><span>العيار</span>
          <select onchange="uiState.repPieceKarat=this.value;render();">
            <option value="">الكل</option>
            ${state.karats.map(k=>`<option value="${k}" ${String(karatF)===String(k)?'selected':''}>عيار ${k}</option>`).join('')}
          </select>
        </div>
        <div class="f auto"><span>&nbsp;</span><button class="btn btn-ghost btn-sm" onclick="uiState.repInvFrom='';uiState.repInvTo='';uiState.repPieceClass='';uiState.repPieceKarat='';uiState.repPieceStatus='stock';render();">↺ مسح الفلاتر</button></div>
      </div>
    </div>

/* ---------- تقرير أرباح المحل (ذهب ونقدية) ---------- */
function renderProfitReport(){
  const [from,to] = repRange();
  const inRange = d => { const s=String(d).slice(0,10); return (!from||s>=from) && (!to||s<=to); };

  // إيرادات نقدية
  const csRows = state.customerSales.filter(i=>inRange(i.date));
  const msRows = state.salesInvoices.filter(i=>inRange(i.date));
  const csRevGold = csRows.reduce((s,i)=>s+(Number(i.totalGoldValue)||0),0);
  const csRevMaking = csRows.reduce((s,i)=>s+(Number(i.totalMaking)||0),0);
  const msRevMaking = msRows.reduce((s,i)=>s+(Number(i.totalMaking)||0),0);
  const totalRevenue = csRevGold + csRevMaking + msRevMaking;

  // مرتجعات (بتتخصم من الإيراد)
  const crRows = state.customerReturns.filter(i=>inRange(i.date));
  const mrRows = state.merchantReturns.filter(i=>inRange(i.date));
  const crTotal = crRows.reduce((s,i)=>s+(Number(i.totalMaking)||0),0);
  const mrTotal = mrRows.reduce((s,i)=>s+(Number(i.totalMaking)||0),0);

  // تكاليف نقدية
  const pbRows = state.purchaseInvoices.filter(i=>inRange(i.date));
  const pbTotal = pbRows.reduce((s,i)=>s+(Number(i.totalMaking)||0),0);
  const scRows = state.scrapPurchases.filter(i=>inRange(i.date));
  const scTotal = scRows.reduce((s,i)=>s+(Number(i.totalCash)||0),0);
  const totalCost = pbTotal + scTotal;

  const netCash = (totalRevenue - crTotal + mrTotal) - totalCost;

  // حركة الذهب (بعيار 21)
  const goldIn = pbRows.reduce((s,i)=>s+to21(i.totalWeight,i.karat),0)
               + scRows.reduce((s,i)=>s+to21(i.weight,i.karat),0)
               + mrRows.reduce((s,i)=>s+ (i.items||[]).reduce((a,it)=>a+to21(it.weight,it.karat),0),0);
  const goldOut = csRows.reduce((s,i)=>s+to21(i.totalWeight, (i.items&&i.items[0]?i.items[0].karat:BASE_KARAT)),0)
                + msRows.reduce((s,i)=>s+to21(i.totalWeight, (i.items&&i.items[0]?i.items[0].karat:BASE_KARAT)),0)
                + crRows.reduce((s,i)=>s+ (i.items||[]).reduce((a,it)=>a+to21(it.weight,it.karat),0),0);
  const mfgRows = state.manufactures.filter(m=>inRange(m.date));
  const mfgWaste21 = mfgRows.reduce((s,m)=>s+to21(m.waste||0, m.karat),0);
  const netGold = goldIn - goldOut - mfgWaste21;

  return `
    <div class="pagehead">
      <div><h1>تقرير أرباح المحل</h1><p>صافي الربح النقدي وصافي حركة الذهب (بعيار ${BASE_KARAT}) خلال الفترة المختارة</p></div>
      <button class="btn" onclick="printReportEl('rep-profit-sheet','تقرير أرباح المحل')">🖶 طباعة</button>
    </div>

    <div class="filterbar">
      <div class="fb-row">
        <div class="f"><span>من تاريخ</span><input type="date" value="${esc(from)}" onchange="uiState.repInvFrom=this.value;render();"></div>
        <div class="f"><span>إلى تاريخ</span><input type="date" value="${esc(to)}" onchange="uiState.repInvTo=this.value;render();"></div>
        <div class="spacer"></div>
        <div class="f auto"><span>&nbsp;</span><button class="btn btn-ghost btn-sm" onclick="uiState.repInvFrom='';uiState.repInvTo='';render();">↺ كل الفترات</button></div>
      </div>
    </div>

    <div class="grid grid-4" style="margin-bottom:16px;">
      <div class="card stat pos"><div class="label"><span>إجمالي الإيرادات</span></div><div class="value">${fmtCash(totalRevenue)}</div></div>
      <div class="card stat neg"><div class="label"><span>إجمالي التكاليف</span></div><div class="value">${fmtCash(totalCost)}</div></div>
      <div class="card stat ${netCash>=0?'pos':'neg'}"><div class="label"><span>صافي الربح النقدي</span></div><div class="value">${fmtCash(netCash)}</div></div>
      <div class="card stat ${netGold>=0?'pos':'neg'}"><div class="label"><span>صافي فرق الذهب (ع${BASE_KARAT})</span></div><div class="value">${netGold.toFixed(3)} <small>جم</small></div></div>
    </div>

    <div id="rep-profit-sheet">
      <div class="section-title" style="margin-top:0;">الجانب النقدي<div class="line"></div></div>
      <div class="tbl-wrap" style="margin-bottom:18px;">
        <table class="grid-table">
          <thead><tr><th>البند</th><th class="right">القيمة</th></tr></thead>
          <tbody>
            <tr><td>مبيعات عملاء — قيمة الذهب</td><td class="right num">${fmtCash(csRevGold)}</td></tr>
            <tr><td>مبيعات عملاء — أجر</td><td class="right num">${fmtCash(csRevMaking)}</td></tr>
            <tr><td>مبيعات لتجار — أجر</td><td class="right num">${fmtCash(msRevMaking)}</td></tr>
            <tr><td class="muted">(−) مرتجعات عملاء</td><td class="right num" style="color:var(--red);">${fmtCash(crTotal)}</td></tr>
            <tr><td class="muted">(+) مرتجعات تجار (بترجعلنا)</td><td class="right num" style="color:var(--green);">${fmtCash(mrTotal)}</td></tr>
            <tr><td>مشتريات من تجار — أجر مدفوع</td><td class="right num" style="color:var(--red);">${fmtCash(pbTotal)}</td></tr>
            <tr><td>شراء دهب كسر — نقدي مدفوع</td><td class="right num" style="color:var(--red);">${fmtCash(scTotal)}</td></tr>
            <tr style="background:#f3f7fc;">
              <td style="font-weight:800;">صافي الربح النقدي</td>
              <td class="right num" style="font-weight:800;color:${netCash>=0?'var(--green)':'var(--red)'};">${fmtCash(netCash)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="section-title">حركة الذهب (بعيار ${BASE_KARAT})<div class="line"></div></div>
      <div class="tbl-wrap">
        <table class="grid-table">
          <thead><tr><th>البند</th><th class="right">الوزن</th></tr></thead>
          <tbody>
            <tr><td>وارد — شراء من تجار</td><td class="right num">${pbRows.reduce((s,i)=>s+to21(i.totalWeight,i.karat),0).toFixed(3)} جم</td></tr>
            <tr><td>وارد — شراء دهب كسر</td><td class="right num">${scRows.reduce((s,i)=>s+to21(i.weight,i.karat),0).toFixed(3)} جم</td></tr>
            <tr><td>وارد — مرتجعات تجار</td><td class="right num">${mrRows.reduce((s,i)=>s+(i.items||[]).reduce((a,it)=>a+to21(it.weight,it.karat),0),0).toFixed(3)} جم</td></tr>
            <tr><td class="muted">(−) منصرف — مبيعات عملاء</td><td class="right num" style="color:var(--red);">${csRows.reduce((s,i)=>s+to21(i.totalWeight,(i.items&&i.items[0]?i.items[0].karat:BASE_KARAT)),0).toFixed(3)} جم</td></tr>
            <tr><td class="muted">(−) منصرف — مبيعات لتجار</td><td class="right num" style="color:var(--red);">${msRows.reduce((s,i)=>s+to21(i.totalWeight,(i.items&&i.items[0]?i.items[0].karat:BASE_KARAT)),0).toFixed(3)} جم</td></tr>
            <tr><td class="muted">(−) منصرف — مرتجعات عملاء</td><td class="right num" style="color:var(--red);">${crRows.reduce((s,i)=>s+(i.items||[]).reduce((a,it)=>a+to21(it.weight,it.karat),0),0).toFixed(3)} جم</td></tr>
            <tr><td class="muted">(−) فاقد تصنيع</td><td class="right num" style="color:var(--red);">${mfgWaste21.toFixed(3)} جم</td></tr>
            <tr style="background:#f3f7fc;">
              <td style="font-weight:800;">صافي فرق الذهب</td>
              <td class="right num" style="font-weight:800;color:${netGold>=0?'var(--green)':'var(--red)'};">${netGold.toFixed(3)} جم</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="hint" style="margin-top:12px;">ملحوظة: صافي الربح النقدي مبني على حركات النقدية الفعلية (أجور وقيم ذهب مقبوضة/مدفوعة) في الفترة، ومش شامل تقييم مخزون الذهب المتبقي بسعر السوق الحالي.</p>
    </div>
  `;
}

/* ---------- تقفيل ميزان سنوي ---------- */
function currentBalanceSnapshot(){
  const gold21 = goldTo21(state.treasury.gold);
  const scrap21 = scrapStock21();
  const merchGold = state.merchants.reduce((s,m)=>s+goldTo21(m.balanceGold),0);
  const merchCash = state.merchants.reduce((s,m)=>s+(m.balanceCash||0),0);
  const custGold = state.customers.reduce((s,c)=>s+goldTo21(c.balanceGold),0);
  const custCash = state.customers.reduce((s,c)=>s+(c.balanceCash||0),0);
  const piecesStock = state.pieces.filter(p=>!p.sold);
  const piecesW21 = piecesStock.reduce((s,p)=>s+to21(p.weight,p.karat),0);
  return {
    cash: state.treasury.cash||0, gold21, scrap21,
    merchGold, merchCash, custGold, custCash,
    piecesCount: piecesStock.length, piecesW21
  };
}

  const piece = findPieceByScan(raw);
  if(!piece){ toast('الباركود ده مش موجود في القطع'); if(input){input.value=''; input.focus();} return; }
  if(!piece.sold){ toast('القطعة دي مش متباعة أصلاً — مفيش حاجة ترجّعها'); if(input){input.value=''; input.focus();} return; }
  if(rb.items.some(x=>x.pieceId===piece.id)){ toast('القطعة دي مضافة بالفعل'); if(input){input.value=''; input.focus();} return; }
  if(!soldPieceMatches(rb.kind, rb.partyId, piece)){
    toast('تنبيه: القطعة دي مش متباعة للطرف المختار — اتضافت برضه');
  }
  // نجيب سعر الذهب وأجر الجرام من فاتورة البيع الأصلية لو موجودة (عشان المرتجع يبقى بإجمالي سعر القطعة زي ما اتباعت)
  let rate = pieceMakingRate(piece);
  let goldRate = 0;
  const buckets = rb.kind==='customer'? state.customerSales : state.salesInvoices;
  for(const inv of buckets){
    const li = (inv.items||[]).find(x=>x.pieceId===piece.id);
    if(li){ rate = li.makingPerGram||li.price||rate; goldRate = Number(li.goldRate)||0; break; }
  }
  const prod = piece.productId? state.products.find(x=>x.id===piece.productId) : null;
  rb.items.push({
    pieceId:piece.id, no:piece.no, code:pieceCode(piece), itemName:pieceLabel(piece),
    classificationId: piece.classificationId || (prod? prod.classificationId : null),
    itemTypeId: piece.itemTypeId || (prod? prod.itemTypeId : null),
    karat:piece.karat, weight:piece.weight, rate, goldRate, making:piece.weight*(rate+goldRate), barcodeValue:piece.barcodeValue
  });
  if(input) input.value='';
  refocusAfterRender('rb-scan');
  render();
}

  const it = rb.items.find(x=>x.pieceId===pieceId);

function renderMerchantReturnBuilder(){ return renderReturnBuilder('merchant'); }
function renderCustomerReturnBuilder(){ return renderReturnBuilder('customer'); }

function applyReturnEffect(kind, inv, sign){
  const party = kind==='customer'? customerById(inv.customerId) : merchantById(inv.merchantId);
  (inv.items||[]).forEach(it=>{
    state.treasury.gold[it.karat] = (state.treasury.gold[it.karat]||0) + sign*it.weight;
    if(party) party.balanceGold[it.karat] = (party.balanceGold[it.karat]||0) - sign*it.weight;
    const pc = state.pieces.find(x=>x.id===it.pieceId);
    if(pc){
      if(sign>0){ pc.sold=false; pc.returnedDate=todayStr(); }
      else { pc.sold=true; delete pc.returnedDate; }
    }
  });
  const paid = inv.amountPaidNow||0, total = inv.totalMaking||0;
  state.treasury.cash -= sign*paid;
  if(party) party.balanceCash -= sign*(total - paid);
}
function submitReturnInvoice(){
  if(!rb || !rb.items.length){ toast('امسح قطعة واحدة على الأقل'); return; }
  const cfg = returnCfg(rb.kind);
  const totalWeight = rb.items.reduce((s,i)=>s+i.weight,0);
  const totalMaking = rb.items.reduce((s,i)=>s+i.making,0);
  let paid = parseFloat(document.getElementById('rb-paid').value)||0;
  paid = Math.max(0, Math.min(paid, totalMaking));
  const kind = rb.kind, partyId = rb.partyId, items = rb.items;
  let savedId=null;
  mutate(()=>{
    const invItems = items.map(it=>({pieceId:it.pieceId, pieceNo:it.no, karat:it.karat, weight:it.weight,
      price:it.rate, makingPerGram:it.rate, goldRate:it.goldRate||0, making:it.making, total:it.making, productCode:it.code,
      itemName:it.itemName, barcodeValue:it.barcodeValue, classificationId:it.classificationId||null, itemTypeId:it.itemTypeId||null}));
    savedId = uid(cfg.idPrefix);
    const rec = {id:savedId, no:state.counters[cfg.counter]++, date:todayStr(), createdAt:new Date().toISOString(),
      items:invItems, totalCash:totalMaking, totalMaking, totalWeight, amountPaidNow:paid};
    if(kind==='customer') rec.customerId = partyId; else rec.merchantId = partyId;
    (kind==='customer'? state.customerReturns : state.merchantReturns).push(rec);
    applyReturnEffect(kind, rec, +1);
  }, 'تم حفظ فاتورة المرتجع');
  rb = null;
  goto(cfg.listView);
  if(savedId) setTimeout(()=>showInvoiceQR(cfg.qrKind, savedId), 120);
}
function deleteReturnInvoice(kind, id){
  const cfg = returnCfg(kind);
  const inv = cfg.list().find(x=>x.id===id);
  if(!inv) return;
  showConfirmModal('حذف فاتورة المرتجع #'+inv.no+'؟ هيتعكس قيدها بالكامل.', ()=>{
    mutate(()=>{
      applyReturnEffect(kind, inv, -1);
      if(kind==='customer') state.customerReturns = state.customerReturns.filter(x=>x.id!==id);
      else state.merchantReturns = state.merchantReturns.filter(x=>x.id!==id);
    }, 'تم حذف فاتورة المرتجع');
    closeModal();
  }, {confirmLabel:'حذف الفاتورة'});
}

function mfbAfterChange(inModal){
  if(inModal) refreshMfbModal(); else render();
}
function addMfbItem(inModal){
  const prefix = inModal? 'mfbm':'mfb';
  const pid = document.getElementById(prefix+'-product').value;
  const pieceWeight = parseFloat(document.getElementById(prefix+'-weight').value)||0;
  const scrapWeight = pieceWeight;
  if(pieceWeight<=0){ toast('اكتب وزن القطعة الناتجة'); return; }
  const prod = state.products.find(x=>x.id===pid);
  if(!prod){ toast('اختار الكود الأول'); return; }
  const it = state.itemTypes.find(x=>x.id===prod.itemTypeId);
  mfb.items.push({ productId:prod.id, code:prod.code, itemName: it? it.name : '—',
    classificationId: prod.classificationId, classificationName: classificationName(prod.classificationId),
    itemTypeId: prod.itemTypeId, priceCategoryId: prod.priceCategoryId,
    scrapWeight, pieceWeight });
  saveMfbDraft();
  if(!inModal) refocusAfterRender(prefix+'-weight');
  mfbAfterChange(inModal);
  if(inModal){ const e=document.getElementById(prefix+'-weight'); if(e){ e.value=''; e.focus(); } }
}
function setMfbWeight(idx, field, val, inModal){
  const it = mfb.items[idx];
  if(!it) return;
  const v = parseFloat(val)||0;
  if(v<=0){ toast('الوزن لازم يكون أكبر من صفر'); mfbAfterChange(inModal); return; }
  it.pieceWeight = v;
  it.scrapWeight = v;
  saveMfbDraft(); mfbAfterChange(inModal);
}
function removeMfbItem(idx, inModal){ mfb.items.splice(idx,1); saveMfbDraft(); mfbAfterChange(inModal); }
function saveMfbDraft(){
  state.drafts = state.drafts || {};
  state.drafts.manufacture = mfb? JSON.parse(JSON.stringify(mfb)) : null;
  persist();
}
function discardMfb(){
  if(!mfb || !mfb.items.length){ resetManufactureBuilder(); goto('manufacture'); return; }
  showConfirmModal('إلغاء فاتورة التصنيع وكل القطع اللي فيها؟', ()=>{
    resetManufactureBuilder(); saveMfbDraft(); closeModal(); goto('manufacture');
  }, {confirmLabel:'إلغاء الفاتورة'});
}
function submitManufactureBuilder(inModal){
  if(!mfb.items.length){ toast('ضيف قطعة واحدة على الأقل'); return; }
  const empEl = document.getElementById('mfb-emp');
  const employee = (empEl? empEl.value : (mfb.employee||'')).trim();
  if(!employee){ toast('اكتب اسم الموظف الأول'); if(empEl){ empEl.style.borderColor='var(--red)'; empEl.focus(); } return; }
  const karat = mfb.karat;
  const items = mfb.items.slice();
  const madePieces = [];
  mutate(()=>{
    items.forEach(row=>{
      const waste = Math.max(0, row.scrapWeight - row.pieceWeight);
      state.scrapStock[karat] = scrapStockOf(karat) - row.scrapWeight;
      if(waste>0) state.treasury.gold[karat] = (state.treasury.gold[karat]||0) - waste;
      const serial = state.counters.mfgPiece++;
      const clsBc = classificationBarcode(row.classificationId);
      const barcodeValue = 'M'+clsBc+'-'+String(serial);
      const pieceId = uid('pc');
      const piece = {id:pieceId, uid:newPieceUid(), no:serial, date:todayStr(), origin:'manufacture', invoiceId:null, merchantId:null,
        productId: row.productId, itemTypeId: row.itemTypeId, classificationId: row.classificationId,
        priceCategoryId: row.priceCategoryId, karat, weight:row.pieceWeight, barcodeValue};
      state.pieces.push(piece);
      madePieces.push(pieceId);
      state.manufactures.push({id:uid('mfg'), no:state.counters.mfg++, date:todayStr(), createdAt:new Date().toISOString(),
        karat, scrapWeight:row.scrapWeight, pieceWeight:row.pieceWeight, waste, productId:row.productId,
        itemName: row.itemName, classificationId: row.classificationId, pieceId, barcodeValue, employee});
    });
    state.employees = state.employees||[]; if(!state.employees.includes(employee)) state.employees.push(employee);
  }, 'اتصنّعت '+items.length+' قطعة وضافت للمخزن');
  resetManufactureBuilder(); saveMfbDraft();
  if(inModal){ mfbModalMode = false; closeModal(); } else { goto('manufacture'); }
  if(madePieces.length) setTimeout(()=>showPieceQRModal(madePieces), 150);
}

function classificationBarcode(cid){
  const c = state.classifications.find(x=>x.id===cid);
  return c && c.barcode? c.barcode : '00';
}
function deleteManufacture(id){
  const m = state.manufactures.find(x=>x.id===id);
  if(!m) return;
  const pc = state.pieces.find(p=>p.id===m.pieceId);
  if(pc && pc.sold){ toast('مينفعش تحذف — القطعة دي اتباعت بالفعل'); return; }
  showConfirmModal('حذف عملية التصنيع #'+m.no+'؟ الوزن هيرجع لمخزون الكسر والقطعة هتتشال.', ()=>{
    mutate(()=>{
      state.scrapStock[m.karat] = scrapStockOf(m.karat) + m.scrapWeight;
      if(m.waste>0) state.treasury.gold[m.karat] = (state.treasury.gold[m.karat]||0) + m.waste;
      state.pieces = state.pieces.filter(p=>p.id!==m.pieceId);
      state.manufactures = state.manufactures.filter(x=>x.id!==id);
    }, 'تم حذف عملية التصنيع');

}
