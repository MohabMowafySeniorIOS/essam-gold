<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الصائغ | إدارة حسابات محل الذهب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f5f9;
    --panel:#ffffff;
    --panel-2:#f5f7fa;
    --line:#dfe4ea;
    --gold:#17406e;          /* اللون الأساسي (كحلي) */
    --gold-bright:#1b5aa0;   /* كحلي فاتح للعناوين والأرقام */
    --gold-dim:#9fb4cc;
    --navy:#17406e;
    --navy-dark:#102c4d;
    --text:#1f2937;
    --muted:#5f6b7a;
    --muted-2:#98a2b3;
    --red:#c0392b;
    --red-bg:#fdecea;
    --green:#1e7e46;
    --green-bg:#e7f4ec;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    font-size:14px;
  }
  h1,h2,h3,.disp{font-family:'Almarai',sans-serif;}
  ::selection{background:#cfe0f2;color:#102c4d;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c6d0dc;border-radius:8px;}
  ::-webkit-scrollbar-track{background:#eef1f5;}

  #shell{display:flex;min-height:100vh;}

  /* SIDEBAR */
  #sidebar{
    width:250px;flex:none;
    background:#17406e;
    border-left:1px solid #0d2440;
    padding:20px 12px 24px;
    position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:3px;
    overflow-y:auto;overscroll-behavior:contain;
  }
  #sidebar::-webkit-scrollbar{width:7px;}
  #sidebar::-webkit-scrollbar-track{background:transparent;}
  #sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:8px;}
  #sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.35);}
  #sidebar{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;}
  .brand{
    display:flex;align-items:center;gap:10px;flex:none;
    padding:0 8px 16px 8px;margin-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  a.brand-link{display:flex;align-items:center;gap:10px;flex:1;text-decoration:none;
    border-radius:8px;padding:6px 6px;margin:-6px -6px;transition:.15s;cursor:pointer;}
  a.brand-link:hover{background:rgba(255,255,255,.10);}
  a.brand-link:hover .name{color:#fff;}
  .brand .mark{
    width:38px;height:38px;border-radius:8px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Almarai',sans-serif;font-weight:800;color:#17406e;font-size:18px;
  }
  .brand .name{font-family:'Almarai',sans-serif;font-weight:800;font-size:16px;color:#fff;line-height:1.1;}
  .brand .sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;}

  .navgroup-label{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);
    font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.5px;
    margin:10px 6px 4px;padding:6px 8px;border-radius:6px;flex:none;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    text-align:start;font-family:inherit;transition:.15s;}
  .navgroup-label:hover{background:rgba(255,255,255,.12);color:#fff;}
  .navgroup-label .gchev{margin-inline-start:auto;font-size:10px;opacity:.8;transition:transform .18s;}
  .navgroup-label.closed .gchev{transform:rotate(-90deg);}
  .navgroup-label .gcount{background:rgba(255,255,255,.14);border-radius:20px;padding:0 6px;font-size:9.5px;}
  .navgroup-label.hasactive{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.14);}
  .navgroup-label.hasactive .gcount{background:#fff;color:#17406e;font-weight:800;}
  .navitem{
    display:flex;align-items:center;gap:10px;flex:none;
    padding:8px 12px;border-radius:6px;cursor:pointer;
    color:rgba(255,255,255,.78);font-size:13px;font-weight:500;
    transition:.15s;border:1px solid transparent;
    user-select:none;white-space:nowrap;text-decoration:none;
  }
  a.navitem,a.navitem:visited{color:rgba(255,255,255,.78);}
  a.navitem.active,a.navitem.active:visited{color:#17406e;}
  a.btn,a.btn:visited{text-decoration:none;color:var(--text);}
  a.btn-gold,a.btn-gold:visited{color:#fff;}
  a.btn-danger,a.btn-danger:visited{color:#a5281c;}
  .navitem .ic{width:18px;text-align:center;font-size:15px;opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,.09);color:#fff;}
  .navitem.active{
    background:#fff;color:#17406e;border-color:#fff;font-weight:700;
  }
  .nav-version{margin-top:auto;padding:14px 12px 2px;font-size:10.5px;color:rgba(255,255,255,.42);
    text-align:center;letter-spacing:.3px;flex:none;}
  .navitem.parent{cursor:pointer;}
  .nav-chev{margin-inline-start:auto;font-size:11px;opacity:.75;transition:transform .18s;}
  .navitem.parent.open .nav-chev{transform:rotate(180deg);}
  .navsub{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px;
    border-inline-start:2px solid rgba(255,255,255,.16);padding-inline-start:6px;margin-inline-start:14px;}
  .navitem.navchild{font-size:12.5px;padding:7px 10px;}
  .navitem .badge{
    margin-inline-start:auto;background:var(--red);color:#fff;font-size:10.5px;
    padding:1px 7px;border-radius:20px;font-weight:700;
  }

  /* MAIN */
  #main{flex:1;padding:26px 30px 60px;max-width:1500px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .pagehead h1{font-size:22px;margin:0 0 4px;color:var(--text);}
  .pagehead p{margin:0;color:var(--muted);font-size:13px;}

  .btn{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    padding:9px 16px;border-radius:8px;font-family:'Tajawal';font-weight:700;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--navy);color:var(--navy);}
  .btn-gold{
    background:var(--navy);color:#fff;border:1px solid var(--navy);
  }
  .btn-gold:hover{background:var(--navy-dark);border-color:var(--navy-dark);}
  .btn-danger{background:var(--red-bg);color:#a5281c;border:1px solid #f0c2bc;}
  .btn-danger:hover{border-color:var(--red);}
  .btn-ghost{background:transparent;border:1px solid var(--line);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* CARDS / GRID */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

  .card{
    background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;
    box-shadow:0 1px 2px rgba(16,44,77,.05);
  }
  .stat .label{color:var(--muted);font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .stat .value{font-family:'Almarai';font-size:24px;font-weight:800;color:var(--gold-bright);}
  .stat .value small{font-size:13px;color:var(--muted);font-weight:400;}
  .stat.neg .value{color:var(--red);}
  .stat.pos .value{color:var(--green);}

  .section-title{font-family:'Almarai';font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;color:var(--text);}
  .section-title .line{flex:1;height:1px;background:var(--line);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:right;color:#43536a;font-weight:700;font-size:11.5px;
    padding:10px;border-bottom:1px solid #d3dae3;background:#eef2f7;
  }
  tbody td{padding:10px;border-bottom:1px solid #eef1f5;color:var(--text);}
  tbody tr:hover{background:#f6f9fd;}
  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;box-shadow:0 1px 2px rgba(16,44,77,.05);}
  .empty-row td{text-align:center;color:var(--muted-2);padding:30px;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill-gold{background:#e8f0fa;color:var(--navy);border:1px solid #c3d7ee;}
  .pill-green{background:var(--green-bg);color:var(--green);border:1px solid #bfe0cc;}
  .pill-red{background:var(--red-bg);color:#a5281c;border:1px solid #f0c2bc;}
  .pill-muted{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);}

  .mono{font-family:'Almarai';}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .right{text-align:left;}

  /* FORMS */
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  input,select,textarea{
    width:100%;background:#fff;border:1px solid #cbd3dd;color:var(--text);
    padding:9px 11px;border-radius:6px;font-family:'Tajawal';font-size:13.5px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,64,110,.10);}
  input::placeholder{color:#a9b2be;}
  .field{margin-bottom:13px;}
  .row{display:flex;gap:12px;}
  .row>*{flex:1;}

  .modal-bg{
    position:fixed;inset:0;background:rgba(16,32,52,.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px;
    box-shadow:0 20px 60px rgba(16,44,77,.22);
  }
  .modal.wide{max-width:760px;}
  .modal h2{margin:0 0 4px;font-size:17px;}
  .modal .hint{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

  .item-row{
    display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;
    padding:10px;background:var(--panel-2);border-radius:8px;margin-bottom:8px;border:1px solid var(--line);
  }
  .item-row .rm{color:var(--red);cursor:pointer;font-size:18px;padding:8px;text-align:center;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted-2);}
  .empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.6;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy);border:1px solid var(--navy-dark);color:#fff;
    padding:11px 20px;border-radius:8px;font-size:13px;z-index:100;
    box-shadow:0 8px 24px rgba(16,44,77,.3);animation:up .25s ease;
  }
  @keyframes up{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .kv-inline{display:flex;gap:6px;flex-wrap:wrap;}
  .kv-chip{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;}
  .kv-chip b{color:var(--navy);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy);border-color:var(--navy);}

  .searchbar{display:flex;gap:10px;margin-bottom:14px;}
  .searchbar input{max-width:280px;}

  /* ============ فلاتر + جداول عريضة ============ */
  .filterbar{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 1px 2px rgba(16,44,77,.05);
  }
  .fb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .filterbar .f{display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .filterbar .f.auto{min-width:auto;flex:0 0 auto;}
  .filterbar .f > span{font-size:10.5px;color:var(--muted-2);letter-spacing:.3px;}
  .filterbar input,.filterbar select{padding:7px 10px;font-size:12.5px;}
  .filterbar .spacer{flex:1;}

  table.tl-table{min-width:900px;}
  table.tl-table td,table.tl-table th{white-space:nowrap;}
  table.tl-table td:nth-child(4){white-space:normal;}
  tfoot td{
    padding:11px 10px;font-weight:800;font-family:'Almarai';font-size:13px;
    border-top:2px solid #cbd5e1;background:#eef2f7;color:var(--navy);
  }

  /* ============ تقرير حسابات النقدية (شكل التقرير الأبيض) ============ */
  .report-sheet{
    background:#fff;color:#333;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 24px;box-shadow:0 1px 2px rgba(16,44,77,.05);
    font-family:'Tajawal',sans-serif;direction:rtl;
  }
  .report-sheet .rep-filters{display:flex;flex-direction:column;align-items:flex-start;gap:9px;margin-bottom:20px;}
  .report-sheet .rep-frow{display:flex;align-items:center;gap:12px;}
  .report-sheet .rep-frow > label{
    order:2;width:90px;margin:0;font-size:13.5px;color:#444;font-weight:500;text-align:right;
  }
  .report-sheet .rep-frow > input,
  .report-sheet .rep-frow > select{
    order:1;width:200px;background:#fff;border:1px solid #ccc;border-radius:4px;
    color:#333;font-size:13px;padding:6px 9px;font-family:'Tajawal',sans-serif;
  }
  .report-sheet .rep-frow > input[readonly]{background:#f7f7f7;color:#555;text-align:left;}
  .report-sheet .rep-frow > input:focus,.report-sheet .rep-frow > select:focus{border-color:#17406e;}

  .report-sheet .rep-bar{
    background:#17406e;color:#fff;font-size:14.5px;font-weight:700;
    padding:11px 16px;margin:0 0 10px;font-family:'Almarai',sans-serif;
  }
  .report-sheet .rep-colsbar{position:relative;margin-bottom:8px;}
  .report-sheet .rep-colsbtn{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#777;cursor:pointer;user-select:none;
  }
  .report-sheet .rep-colsbtn:hover{color:#17406e;}
  .report-sheet .rep-colsmenu{
    position:absolute;top:22px;right:0;z-index:20;background:#fff;border:1px solid #ccc;
    border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:8px 10px;min-width:150px;
  }
  .report-sheet .rep-colsmenu label{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:#333;margin:0;padding:4px 0;cursor:pointer;font-weight:400;
  }
  .report-sheet .rep-colsmenu input{width:auto;margin:0;}

  .report-sheet table.rep-table{width:100%;border-collapse:collapse;font-size:13px;}
  .report-sheet table.rep-table thead th{
    background:#fff;color:#555;font-weight:700;font-size:12.5px;text-align:right;
    padding:9px 10px;border-bottom:1px solid #d5d5d5;white-space:nowrap;
  }
  .report-sheet table.rep-table tbody td{
    padding:8px 10px;border-bottom:1px solid #ececec;color:#333;white-space:nowrap;
  }
  .report-sheet table.rep-table tbody td.stmt{white-space:normal;}
  .report-sheet table.rep-table tbody tr:hover{background:#f6f9fd;}
  .report-sheet table.rep-table .no{color:#2563a8;}
  .report-sheet table.rep-table .amt{font-variant-numeric:tabular-nums;text-align:right;}
  .report-sheet .rep-empty{text-align:center;color:#999;padding:34px;font-size:13px;}

  .report-sheet .rep-totals{display:flex;justify-content:flex-start;margin-top:16px;}
  .report-sheet .rep-totbox{display:flex;flex-direction:column;gap:4px;}
  .report-sheet .rep-totrow{display:flex;align-items:center;gap:10px;}
  .report-sheet .rep-totrow > span{order:2;width:95px;font-size:13px;color:#444;text-align:right;}
  .report-sheet .rep-totrow > b{
    order:1;width:190px;border:1px solid #ccc;border-radius:4px;background:#fff;
    padding:5px 9px;font-size:13px;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;color:#222;
  }
  @media print{
    .report-sheet{margin:0;padding:0;}
    .report-sheet .rep-filters,.report-sheet .rep-colsbar{display:none;}
  }


  /* ====== أرصدة ملوّنة ====== */
  .balbox{display:inline-block;font-family:'Almarai';font-weight:800;font-size:13.5px;
    padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums;}

  /* ====== لوحة التحكم: كولكشن فيو ====== */
  .homeswitch{display:flex;gap:10px;justify-content:center;margin:4px 0 22px;flex-wrap:wrap;}
  .hs-btn{background:#eef2f7;color:var(--navy);border:1px solid #d7e0ea;padding:10px 22px;border-radius:8px;
    font-family:'Tajawal';font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
  .hs-btn:hover{background:#e2eaf4;}
  .hs-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .sc-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-right:4px solid var(--navy);border-radius:10px;padding:16px 14px;text-decoration:none;
    color:var(--text);box-shadow:0 1px 3px rgba(16,44,77,.07);transition:.15s;}
  .sc-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,44,77,.14);border-right-color:var(--gold-bright);}
  .sc-jiggle{animation:sc-jiggle-kf .28s ease-in-out infinite;cursor:pointer;}
  .sc-jiggle:nth-child(even){animation-delay:.07s;}
  @keyframes sc-jiggle-kf{0%{transform:rotate(-1deg);}50%{transform:rotate(1deg);}100%{transform:rotate(-1deg);}}
  .sc-ic{font-size:22px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:#eef2f7;border-radius:9px;flex:none;}
  .sc-lbl{font-weight:700;font-size:13.5px;}

  /* ====== المربعات (شاشة مكثّفة) ====== */
  .sq-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;}
  .sq-topbar{background:#fdf1f3;border:1px solid #f0d6da;border-radius:6px;padding:8px 10px;margin-bottom:8px;}
  .sq-title{font-family:'Almarai';font-weight:800;font-size:17px;color:var(--navy);text-align:center;margin-bottom:8px;}
  .sq-fields,.sq-addbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .sq-f{display:flex;flex-direction:column;gap:3px;min-width:120px;}
  .sq-f.grow{flex:1;min-width:200px;}
  .sq-f.auto{min-width:auto;}
  .sq-f > span{font-size:10.5px;color:#8a6b70;font-weight:700;}
  .sq-f input,.sq-f select{padding:6px 9px;font-size:12.5px;border-radius:4px;}
  .sq-ro{background:#f7f7f7;font-family:'Almarai';font-weight:800;text-align:left;}
  .sq-ro.pos{color:var(--green);} .sq-ro.neg{color:var(--red);}
  .sq-sub{background:#17406e;color:#fff;font-family:'Almarai';font-weight:800;font-size:14px;
    text-align:center;padding:7px;border-radius:4px;margin-bottom:8px;}
  .sq-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .sq-stat{flex:1;min-width:150px;background:#f5f8fc;border:1px solid #dde6f0;border-radius:6px;padding:7px 10px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .sq-stat span{font-size:11.5px;color:var(--muted);}
  .sq-stat b{font-family:'Almarai';font-size:14px;color:var(--navy);font-variant-numeric:tabular-nums;}
  .sq-addbar{background:#fffbe6;border:1px solid #f0e2a8;border-radius:6px;padding:8px 10px;}
  .sq-addlbl{font-family:'Almarai';font-weight:800;font-size:13px;color:#8a6d00;align-self:center;padding:0 4px;}
  table.sq-table thead th{background:#eef2f7;font-size:11px;}
  table.sq-table tbody td{padding:7px 8px;font-size:12.5px;}
  tr.sq-open td{background:#fffdf3;}

  /* ====== شاشة المرتجعات ====== */
  .ret-head h1{color:var(--red);}
  .ret-card{border-right:4px solid var(--red);}


  /* ================= الموبايل والتابلت ================= */
  #mobile-bar{display:none;}
  #sidebar-overlay{display:none;}
  .nav-close{display:none;}

  @media (max-width: 980px){

<script>
/* ============================= STATE ============================= */
const APP_VERSION = 'v2.7';
const APP_BUILD = '2026-08-19';
const DEFAULT_KARATS = [24,22,21,18,14,9];
let state = null;
let currentView = 'home';
let uiState = { pendingTab:'pending', txtSearch:'', cpTab:'all', summaryKarat: 21, catalogTab:'classifications', pbShowNewCode:false,
  repFrom:'', repTo:'', repKind:'', repColsOpen:false,
  stmtMerchantId:null, stmtFrom:'', stmtTo:'', stmtOpen:{},
  navOpen:{},
  navSections:(function(){ try{ return JSON.parse(localStorage.getItem('navSections'))||{}; }catch(e){ return {}; } })(),
  repCols:{date:true, in:true, out:true, bal:true, kind:true, merchant:true, stmt:true, no:true} };

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function emptyGoldMap(){ const m={}; DEFAULT_KARATS.forEach(k=>m[k]=0); return m; }

const COUNTERS_DEF = { merchant:1, customer:1, purchase:1, sale:1, pending:1, settlement:1, transfer:1, scrap:1, collection:1, payment:1,
  itemType:1, classification:1, priceCategory:1, product:1, piece:1,
  lot:1, custSale:1, custReturn:1, merReturn:1, mfg:1, mfgPiece:90001, square:1,
  pieceUid:1 };

/* ============================= الكود الفريد للقطعة (QR) =============================
   كل قطعة بتاخد كود فريد لا يتكرر أبدًا. السجل بيفضل محتفظ بكل الأكواد اللي اتولدت
   حتى بعد حذف القطعة، فالكود المحذوف مش بيترجع يتستخدم تاني. */
const PIECE_UID_PREFIX = 'GS';
function uidRegistry(){
  if(!Array.isArray(state.pieceUidRegistry)) state.pieceUidRegistry = [];
  return state.pieceUidRegistry;
}
let _uidSet = null, _uidSetLen = -1;
function uidRegistrySet(){
  if(!_uidSet || _uidSetLen !== uidRegistry().length){
    _uidSet = new Set(uidRegistry());
    _uidSetLen = uidRegistry().length;
  }
  return _uidSet;
}
function isPieceUidTaken(u){ return uidRegistrySet().has(String(u||'').trim().toUpperCase()); }
function rand36(n){
  let out='';
  const alphabet='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // من غير I و O عشان ما تتلخبطش مع 1 و 0
  const buf = new Uint32Array(n);
  (window.crypto||window.msCrypto).getRandomValues(buf);
  for(let i=0;i<n;i++) out += alphabet[buf[i] % alphabet.length];
  return out;
}
/* بيسجّل الكود في السجل — بيرجع false لو الكود متسجل قبل كده */
function claimPieceUid(u){
  u = String(u||'').trim().toUpperCase();
  if(!u) return false;
  if(isPieceUidTaken(u)) return false;
  uidRegistrySet().add(u);
  uidRegistry().push(u);
  _uidSetLen = uidRegistry().length;
  return true;
}
/* بيولّد كود فريد جديد ويسجّله: تسلسل تصاعدي ما بيرجعش لورا + جزء عشوائي */
function newPieceUid(){
  for(let guard=0; guard<10000; guard++){
    const seq = state.counters.pieceUid++;
    const cand = PIECE_UID_PREFIX + '-' + String(seq).padStart(6,'0') + '-' + rand36(5);
    if(claimPieceUid(cand)) return cand;
  }
  throw new Error('تعذّر توليد كود فريد للقطعة');
}
/* بيدي القطعة كود فريد لو مالهاش — وبيرفض لو الكود المطلوب مستخدم */
function assignPieceUid(piece, wanted){
  if(wanted){
    const w = String(wanted).trim().toUpperCase();
    if(isPieceUidTaken(w)) return {ok:false, error:'الكود ' + w + ' مستخدم بالفعل — اختر كود تاني'};
    claimPieceUid(w);
    piece.uid = w;
    return {ok:true, uid:w};
  }
  if(piece.uid && isPieceUidTaken(piece.uid) && state.pieces.some(x=>x!==piece && x.uid===piece.uid)){
    return {ok:false, error:'الكود ' + piece.uid + ' مستخدم بالفعل — اختر كود تاني'};
  }
  if(!piece.uid){ piece.uid = newPieceUid(); }
  else if(!isPieceUidTaken(piece.uid)) claimPieceUid(piece.uid);
  return {ok:true, uid:piece.uid};
}
/* القطع القديمة اللي مالهاش كود بتاخد واحد، وأي تكرار بيتصلّح بكود جديد */
function ensurePieceUids(){
  let changed = false;
  const seen = new Set();
  (state.pieces||[]).forEach(p=>{
    let u = p.uid? String(p.uid).trim().toUpperCase() : '';
    if(u && !seen.has(u)){
      p.uid = u; seen.add(u);
      if(!isPieceUidTaken(u)) { claimPieceUid(u); changed = true; }
      return;
    }
    p.uid = newPieceUid();       // مفيش كود، أو الكود متكرر مع قطعة تانية
    seen.add(p.uid); changed = true;
  });
  return changed;
}
function findPieceByUid(u){
  u = String(u||'').trim().toUpperCase();
  if(!u) return null;
  return state.pieces.find(x=> String(x.uid||'').toUpperCase() === u) || null;
}
function pieceQRPayload(p){ return String(p.uid||''); }

function defaultState(){
  return {
    karats: [...DEFAULT_KARATS],
    treasury: { cash:0, gold: emptyGoldMap() },
    scrapStock: emptyGoldMap(),
    merchants: [],
    customers: [],
    purchaseInvoices: [],
    salesInvoices: [],
    merchantReturns: [],
    customerSales: [],
    customerReturns: [],
    goldLots: [],
    manufactures: [],
    pendingSales: [],
    settlements: [],
    yearClosings: [],
    goldLosses: [],
    transfers: [],
    scrapPurchases: [],
    cashMoves: [],
    collections: [],
    payments: [],
    itemTypes: [],
    classifications: [],
    priceCategories: [],
    products: [],
    pieces: [],
    pieceUidRegistry: [],
    settings: { shopName:'دفتر الصائغ', goldPrices:{} },
    employees: [],
    counters: Object.assign({}, COUNTERS_DEF)
  };
}

async function loadState(){
  try{
    const r = await fetch('/api/state');
    const data = await r.json();
    if(data && data.state){
      const parsed = data.state;
      state = Object.assign(defaultState(), parsed);
      if(!state.karats || !state.karats.length) state.karats=[...DEFAULT_KARATS];
      state.karats.forEach(k=>{ if(state.treasury.gold[k]===undefined) state.treasury.gold[k]=0; });
      if(!state.collections) state.collections=[];
      if(!state.payments) state.payments=[];
      if(!state.itemTypes) state.itemTypes=[];
      if(!state.classifications) state.classifications=[];
      if(!state.priceCategories) state.priceCategories=[];
      if(!state.products) state.products=[];
      if(!state.pieces) state.pieces=[];
      state.settings = Object.assign({shopName:'دفتر الصائغ', goldPrices:{}}, state.settings||{});
      state.settings.goldPrices = state.settings.goldPrices||{};
      if(!state.settings.gold){
        const legacy21 = Number(state.settings.goldPrices[21]||0);
        state.settings.gold = {buy21: legacy21, sell21: legacy21, overrides:{}, updatedAt: legacy21? new Date().toISOString():''};
        Object.keys(state.settings.goldPrices).forEach(k=>{
          const v = Number(state.settings.goldPrices[k])||0;
          const auto = legacy21 * (Number(k)/21);
          if(v && Math.abs(v-auto)>0.005) state.settings.gold.overrides[k] = {buy:v};
        });
      }
      if(!state.settings.gold.overrides) state.settings.gold.overrides = {};
      if(!state.employees) state.employees=[];
      state.drafts = state.drafts || {};
      if(state.drafts.customerSale) csb = state.drafts.customerSale;
      if(state.drafts.manufacture) mfb = state.drafts.manufacture;
      ['customers','merchantReturns','customerSales','customerReturns','goldLots','manufactures'].forEach(k=>{ if(!state[k]) state[k]=[]; });
      if(!state.scrapStock) state.scrapStock = emptyGoldMap();
      state.karats.forEach(k=>{ if(state.scrapStock[k]===undefined) state.scrapStock[k]=0; });
      state.counters = Object.assign({}, COUNTERS_DEF, state.counters||{});
      if(!state.counters.mfgPiece || state.counters.mfgPiece < 90001) state.counters.mfgPiece = 90001;
      // ترقيم التصنيفات بباركود خاص لكل تصنيف (للتصنيفات القديمة اللي مالهاش كود)
      state.classifications.forEach((c,i)=>{ if(!c.barcode) c.barcode = String(i+1).padStart(2,'0'); });
      (state.customers||[]).forEach(c=>{ if(!c.balanceGold) c.balanceGold = emptyGoldMap(); if(c.balanceCash==null) c.balanceCash=0; });
      if(!Array.isArray(state.pieceUidRegistry)) state.pieceUidRegistry = [];
      _uidSet = null; _uidSetLen = -1;
      if(ensurePieceUids()) setTimeout(()=>persist(), 300);
    } else {
      state = defaultState();
    }
  }catch(e){
    console.error('load failed, starting fresh', e);
    state = defaultState();
  }
}
let saveTimer=null;
let saveIndicatorTimer=null;
function setSaveIndicator(text){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.textContent = text;
  clearTimeout(saveIndicatorTimer);
  if(text) saveIndicatorTimer = setTimeout(()=>{ el.textContent=''; }, 1600);
}
function persist(){
  clearTimeout(saveTimer);
  setSaveIndicator('جارِ الحفظ...');
  saveTimer=setTimeout(async ()=>{
    try{
      const r = await fetch('/api/state', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state)
      });
      if(!r.ok) throw new Error('save failed: '+r.status);
      setSaveIndicator('تم الحفظ ✓');
    }catch(e){
      console.error('save failed', e);
      setSaveIndicator('تعذر الحفظ! تحقق من تشغيل السيرفر');
    }
  }, 250);
}
function mutate(fn, msg){
  fn();
  persist();
  render();
  if(msg) toast(msg);
}

/* ============================= باركود CODE128 (مولّد داخلي بدون أي مكتبة خارجية) ============================= */
const CODE128_PATTERNS = [
'212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
'221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
'221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
'212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
'231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
'231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
'314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
'112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
'111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
'214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
'114131','311141','411131',
'211412','211214','211232','2331112'
];

/* ترميز CODE128-B: بيدعم كل الحروف والأرقام والرموز من ASCII 32 لـ 126 */
function code128Encode(text){
  text = String(text==null? '' : text);
  if(!text.length) return null;
  const codes = [104]; // Start B
  for(let i=0;i<text.length;i++){
    const c = text.charCodeAt(i);
    if(c<32 || c>126) return null;
    codes.push(c-32);
  }
  let sum = 104;
  for(let i=1;i<codes.length;i++) sum += codes[i]*i;
  codes.push(sum % 103);   // checksum
  codes.push(106);         // Stop
  return codes;
}

/* بيرجع SVG جاهز للطباعة أو العرض */
function code128SVG(text, opts){
  opts = opts||{};
  const mod = opts.moduleWidth || 2;
  const barH = opts.height || 55;
  const fontSize = opts.fontSize || 12;
  const showText = opts.displayValue !== false;
  const quiet = (opts.quietModules||10) * mod;
  const codes = code128Encode(text);
  if(!codes) return null;

  let widths = '';
  for(const c of codes) widths += CODE128_PATTERNS[c];

  let x = quiet, isBar = true, rects = '';
  for(let i=0;i<widths.length;i++){
    const w = parseInt(widths[i],10)*mod;
    if(isBar) rects += '<rect x="'+x+'" y="0" width="'+w+'" height="'+barH+'"/>';
    x += w; isBar = !isBar;
  }
  const totalW = x + quiet;
  const textH = showText? fontSize+5 : 0;
  const totalH = barH + textH;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+totalW+'" height="'+totalH+'" viewBox="0 0 '+totalW+' '+totalH+'" shape-rendering="crispEdges">'
    + '<rect width="'+totalW+'" height="'+totalH+'" fill="#fff"/>'
    + '<g fill="#000">'+rects+'</g>'
    + (showText? '<text x="'+(totalW/2)+'" y="'+(barH+fontSize)+'" text-anchor="middle" font-family="Courier New,monospace" font-size="'+fontSize+'" letter-spacing="1.2" fill="#000">'+esc(text)+'</text>' : '')
    + '</svg>';
}

function fmtCash(n){
  n = Number(n)||0;
  const s = Math.abs(n).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'') + s + ' جنيه';
}
function fmtW(n){
  n = Number(n)||0;
  return n.toLocaleString('ar-EG',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' جم';
}
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'});
}

function copyBtn(value){
  return `<button class="copy-btn" title="نسخ الرقم" onclick="copyVal(this, '${String(value).replace(/'/g,"\\'")}')">⧉</button>`;
}
function copyVal(btn, value){
  const done = ()=>{ const old = btn.textContent; btn.textContent='✓'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent=old; btn.classList.remove('ok'); }, 1200); toast('تم نسخ الرقم: '+value); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(value).then(done).catch(()=>fallbackCopy(value, done));
  } else fallbackCopy(value, done);
}
function fallbackCopy(value, done){
  const ta = document.createElement('textarea');
  ta.value = value; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('تعذر النسخ'); }
  ta.remove();
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderSidebar(){
  const pendingCount = state.pendingSales.filter(p=>p.status==='pending').length;
  let html = `
    <div class="brand">
      <a class="brand-link" href="${viewHref('home')}" title="ارجع للوحة التحكم" onclick="return navClick(event,'home')">
        <div class="mark">ذ</div>
        <div>
          <div class="name">دفتر الصائغ</div>
          <div class="sub">إدارة حسابات محل الذهب</div>
        </div>
      </a>
      <button class="nav-close" onclick="closeNav()" aria-label="إغلاق">✕</button>
    </div>`;
  NAV.forEach(g=>{
    const hasActive = g.items.some(it=> it.id===currentView || (it.children||[]).some(c=>c.id===currentView));
    const gOpen = navGroupOpen(g.group);
    html += `<button type="button" class="navgroup-label ${gOpen?'':'closed'} ${(hasActive&&!gOpen)?'hasactive':''}" onclick="toggleNavSection('${esc(g.group)}')">
      <span>${esc(g.group)}</span><span class="gcount">${g.items.length}</span><span class="gchev">▾</span></button>`;
    if(!gOpen) return;
    g.items.forEach(it=>{
      const badge = it.badgeKey==='pendingCount' && pendingCount>0 ? `<span class="badge">${pendingCount}</span>` : '';
      if(it.children && it.children.length){
        const childActive = it.children.some(c=>c.id===currentView);
        const open = uiState.navOpen[it.id] || childActive || currentView===it.id;
        const active = (currentView===it.id) ? 'active':'';
        html += `<div class="navitem parent ${active} ${open?'open':''}" onclick="toggleNavGroup('${it.id}')">
          <span class="ic">${it.icon}</span><span>${esc(it.label)}</span><span class="nav-chev">▾</span>
        </div>`;
        if(open){
          html += `<div class="navsub">` + it.children.map(c=>`
            <a class="navitem navchild ${currentView===c.id?'active':''}" href="${viewHref(c.id)}" onclick="return navClick(event,'${c.id}')">
              <span class="ic">${c.icon}</span><span>${esc(c.label)}</span>
            </a>`).join('') + `</div>`;
        }
        return;
      }
      const active = currentView===it.id ? 'active':'';
      html += `<a class="navitem ${active}" href="${viewHref(it.id)}" onclick="return navClick(event,'${it.id}')">
        <span class="ic">${it.icon}</span><span>${esc(it.label)}</span>${badge}
      </a>`;
    });
  });
  html += `<div class="nav-version">الإصدار ${APP_VERSION} · ${APP_BUILD}</div>`;
  document.getElementById('sidebar').innerHTML = html;
  updateMobileTitle();
}

/* أقسام السايدبار: العنوان بقى زرار بيفتح/بيقفل القسم */
function navGroupOpen(group){
  uiState.navSections = uiState.navSections || {};
  return uiState.navSections[group] !== false;   // مفتوح افتراضيًا
}
function saveNavSections(){
  try{ localStorage.setItem('navSections', JSON.stringify(uiState.navSections||{})); }catch(e){}
}
function toggleNavSection(group){
  uiState.navSections = uiState.navSections || {};
  uiState.navSections[group] = !navGroupOpen(group);
  saveNavSections();
  renderSidebar();
}
/* لما تفتح صفحة، القسم بتاعها يفتح لوحده — بس تفضل قادر تقفله بإيدك */
function openNavSectionOf(view){
  const g = NAV.find(g=> g.items.some(it=> it.id===view || (it.children||[]).some(c=>c.id===view)));
  if(!g) return;
  uiState.navSections = uiState.navSections || {};
  if(uiState.navSections[g.group] === false){ uiState.navSections[g.group] = true; saveNavSections(); }
}

/* ====== الراوتنج: كل زرار بيودي لصفحة بقى لينك حقيقي — كليك يمين → فتح في تاب جديد ====== */
function viewHref(view){ return '#/'+view; }
function navClick(ev, view){
  // لو المستخدم ضغط بزرار أوسط أو Ctrl/Cmd سيب المتصفح يفتح تاب جديد
  if(ev && (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button===1)) return true;
  if(ev) ev.preventDefault();
  closeNav();
  goto(view);
  return false;
}
/* زرار شكله زرار بس بيشتغل كلينك — عشان open in new tab يشتغل عليه */
function navBtn(view, label, cls){
  return `<a class="btn ${cls||'btn-ghost'}" href="${viewHref(view)}" onclick="return navClick(event,'${view}')" style="display:inline-block;text-decoration:none;">${label}</a>`;
}
function goto(view){
  if(currentView!==view && window.innerWidth<=980) window.scrollTo({top:0});
  currentView=view;
  openNavSectionOf(view);
  const h = viewHref(view);
  if(location.hash !== h){ suppressHashRender = true; location.hash = h; }
  render();
}
let suppressHashRender = false;
function applyHash(){
  const v = (location.hash||'').replace(/^#\/?/, '').trim();
  if(v && v!==currentView){ currentView = v; render(); }
}
window.addEventListener('hashchange', ()=>{
  if(suppressHashRender){ suppressHashRender=false; return; }
  applyHash();
});

/* ====== Enter = إضافة/حفظ في أي مودال أو أي كارت فيه زرار إضافة ====== */
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' || e.shiftKey) return;
  const t = e.target;
  if(!t || !t.tagName) return;
  const tag = t.tagName.toUpperCase();
  if(tag==='TEXTAREA' || tag==='BUTTON' || tag==='A') return;
  if(tag!=='INPUT' && tag!=='SELECT') return;
  if(t.getAttribute('onkeydown')) return; // الحقول اللي ليها منطق Enter خاص بيها
  let btn = null;
  const modal = t.closest('.modal');
  if(modal){
    btn = modal.querySelector('.modal-actions .btn-gold') || modal.querySelector('.modal-actions .btn:last-child');
  } else {
    const scope = t.closest('[data-enter-scope]') || t.closest('.card') || t.closest('.filterbar');
    if(scope) btn = scope.querySelector('[data-enter-submit]') || scope.querySelector('.btn-gold');
  }
  if(btn){ e.preventDefault(); btn.click(); }
});

/* ============ تقرير حسابات النقدية ============ */
function fmtDateRep(d){
  const dt = new Date(d);
  if(isNaN(dt)) return '';
  return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+dt.getFullYear();
}
function fmtNum2(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function cashReportEntries(){
  const items = [];
  const add = (date, kind, merchant, statement, amount)=>{
    amount = Number(amount)||0;
    if(amount<=0) return;
    items.push({date:String(date).slice(0,10), kind, merchant:merchant||'', statement, amount});
  };
  state.cashMoves.forEach(i=>{
    if(i.dir==='in') add(i.date,'in','', i.note? ('ايداع نقديه — '+i.note) : 'ايداع نقديه بالخزينه', i.amount);
    else add(i.date,'out','', i.note? ('سحب نقدي — '+i.note) : 'سحب نقدي من الخزينه', i.amount);
  });
  state.salesInvoices.forEach(i=> add(i.date,'in', merchantName(i.merchantId), 'فاتوره بيع مدفوعه كاش رقم '+i.no, i.amountPaidNow));
  state.purchaseInvoices.forEach(i=> add(i.date,'out', merchantName(i.merchantId), 'أجر فاتوره مشتريات رقم '+i.no, i.amountPaidNow));
  state.scrapPurchases.forEach(i=> add(i.date,'out','', 'شراء دهب كسر — '+(i.customerName||'عميل'), i.totalCash));
  state.collections.forEach(i=>{ if(i.cashMode==='treasury') add(i.date,'in', i.partyKind==='customer'? customerName(i.customerId):merchantName(i.merchantId), (i.partyKind==='customer'?'تحصيل نقدي من عميل':'تحصيل نقدي من تاجر')+(i.note? ' — '+i.note:''), i.cash); });
  state.payments.forEach(i=>{ if(i.cashMode==='treasury') add(i.date,'out', i.partyKind==='customer'? customerName(i.customerId):merchantName(i.merchantId), (i.partyKind==='customer'?'تسديد نقدي لعميل':'تسديد نقدي لتاجر')+(i.note? ' — '+i.note:''), i.cash); });
  (state.customerSales||[]).forEach(i=> add(i.date,'in', customerName(i.customerId), 'فاتوره مبيعات عميل رقم '+i.no, i.amountPaidNow));
  (state.customerReturns||[]).forEach(i=> add(i.date,'out', customerName(i.customerId), 'مرتجع عميل رقم '+i.no, i.amountPaidNow));
  (state.merchantReturns||[]).forEach(i=> add(i.date,'out', merchantName(i.merchantId), 'مرتجع من تاجر رقم '+i.no, i.amountPaidNow));
  (state.goldLots||[]).forEach(l=>{
    if(!l.cashNow) return;
    const nm = lotPartyName(l);
    if(l.dir==='buy') add(l.date,'out', nm, 'شراء قطع ذهب رقم '+l.no, l.cashNow);
    else add(l.date,'in', nm, 'بيع قطع ذهب رقم '+l.no, l.cashNow);
  });
  return items
    .map((e,i)=>Object.assign(e,{_i:i}))
    .sort((a,b)=>{ const d=new Date(a.date)-new Date(b.date); return d!==0? d : a._i-b._i; });
}

/* ============================= لوحة التحكم (الرئيسية) ============================= */
function saleItemClassificationId(it){
  if(it.classificationId) return it.classificationId;
  if(it.pieceId){
    const pc = state.pieces.find(x=>x.id===it.pieceId);
    if(pc){
      if(pc.classificationId) return pc.classificationId;
      const pr = pc.productId? state.products.find(x=>x.id===pc.productId) : null;
      if(pr) return pr.classificationId;
    }
  }
  if(it.productCode){
    const pr = state.products.find(x=>x.code===it.productCode);
    if(pr) return pr.classificationId;
  }
  return null;
}
function topClassifications(fromISO){
  const map = {};
  state.salesInvoices.forEach(inv=>{
    const d = String(inv.date).slice(0,10);
    if(fromISO && d < fromISO) return;
    (inv.items||[]).forEach(it=>{
      const cid = saleItemClassificationId(it);
      const key = cid || '__none__';
      if(!map[key]) map[key] = {id:cid, pieces:0, weight:0, making:0};
      map[key].pieces += 1;
      map[key].weight += Number(it.weight)||0;
      map[key].making += Number(it.making!=null? it.making : (it.total||0))||0;
    });
  });
  return Object.values(map).sort((a,b)=> b.pieces-a.pieces || b.weight-a.weight);
}
function classificationName(id){
  if(!id) return 'غير مصنّف';
  const c = state.classifications.find(x=>x.id===id);
  return c? c.name : 'غير مصنّف';
}

/* جرد ذهب أعداد: عدد القطع الموجودة بالمخزن لكل تصنيف × عيار */
function goldCountInventory(){
  const karats = [...state.karats].sort((a,b)=>b-a);
  const rows = {};
  const totals = {}; karats.forEach(k=>totals[k]=0);
  let grand = 0;
  state.pieces.filter(pc=>!pc.sold).forEach(pc=>{
    const cid = pieceClassificationId(pc);
    const key = cid || '__none__';
    if(!rows[key]){ rows[key] = {id:cid, counts:{}, total:0}; karats.forEach(k=>rows[key].counts[k]=0); }
    const k = Number(pc.karat);
    if(rows[key].counts[k]===undefined) rows[key].counts[k]=0;
    rows[key].counts[k]++; rows[key].total++;
    totals[k] = (totals[k]||0)+1; grand++;
  });
  const list = Object.values(rows).sort((a,b)=> b.total-a.total);
  return {karats, list, totals, grand};
}

/* ============================= الكسر: رصيد كل عيار + حركة يومية ============================= */
function scrapDailyMovement(){
  const days = {};
  function add(date, karat, delta){
    const d = String(date||todayStr()).slice(0,10);
    days[d] = days[d] || {};
    days[d][karat] = (days[d][karat]||0) + delta;
  }
  state.scrapPurchases.forEach(sp=> add(sp.date, sp.karat, Number(sp.weight)||0));
  state.pieces.filter(p=>p.returned && p.returnedKind==='melt').forEach(p=> add(p.returnedDate, p.karat, Number(p.weight)||0));
  state.manufactures.forEach(m=> add(m.date, m.karat, -(Number(m.scrapWeight)||0)));
  return days;
}

    karats.forEach(k=> running[k] += (movement[d][k]||0));
    return { date:d, day:{...movement[d]}, cum:{...running} };

  const currentTotal21 = karats.reduce((s,k)=> s+to21(scrapStockOf(k),k), 0);

  return `

/* بنشيل أثر العملية من الخزينة قبل ما نعدلها أو نحذفها */
function revertScrapEffect(sc){
  state.treasury.cash += (Number(sc.totalCash)||0);
  state.treasury.gold[sc.karat] = (state.treasury.gold[sc.karat]||0) - (Number(sc.weight)||0);
  state.scrapStock = state.scrapStock||{};
  state.scrapStock[sc.karat] = (Number(state.scrapStock[sc.karat])||0) - (Number(sc.weight)||0);
}
function deleteScrap(id){
  const sc = state.scrapPurchases.find(x=>x.id===id);
  if(!sc) return;
  showConfirmModal('حذف عملية شراء الكسر #'+(sc.no||'')+'؟ هيترجع المبلغ للخزينة ويتشال الوزن من مخزون الذهب.', ()=>{
    mutate(()=>{
      revertScrapEffect(sc);
      state.scrapPurchases = state.scrapPurchases.filter(x=>x.id!==id);
    }, 'اتحذفت عملية الشراء');
    closeModal();
  }, {confirmLabel:'حذف العملية', danger:true});
}
function setGoldPrice(karat, val){
  mutate(()=>{
    state.settings = state.settings||{}; state.settings.goldPrices = state.settings.goldPrices||{};
    state.settings.goldPrices[karat] = parseFloat(val)||0;
  }, 'تم حفظ سعر عيار '+karat);
}
function applyScrapKaratPrice(){
  const k = parseFloat(document.getElementById('sc-karat').value);
  const el = document.getElementById('sc-price');
  const set = goldBuyPrice(k);   // شراء الكسر بيتم بسعر الشراء المحدد في System Code
  if(el) el.value = set? set.toFixed(2) : '';
  const hint = document.getElementById('sc-price-src');
  if(hint) hint.textContent = set? ('سعر الشراء المحدد لعيار '+k+' = '+fmtCash(set)+' — تقدر تعدله للعملية دي بس')
                                 : 'مفيش سعر محدد لعيار '+k+' — حدده من System Code → أسعار الذهب';
  recalcScrapTotal();
}
/* الوزن × سعر الجرام ← الإجمالي */
function recalcScrapTotal(){
  const w = parseFloat(document.getElementById('sc-weight').value)||0;
  const p = parseFloat(document.getElementById('sc-price').value)||0;
  const totalEl = document.getElementById('sc-total');
  if(totalEl && document.activeElement!==totalEl) totalEl.value = (w*p).toFixed(2);
  updateScrap21();
}
/* الإجمالي ← سعر الجرام (لما تكتب الإجمالي بإيدك) */
function recalcScrapFromTotal(){
  const w = parseFloat(document.getElementById('sc-weight').value)||0;
  const total = parseFloat(document.getElementById('sc-total').value)||0;
  const priceEl = document.getElementById('sc-price');
  const hint = document.getElementById('sc-total-hint');
  if(w>0){
    if(priceEl) priceEl.value = (total/w).toFixed(2);
    if(hint) hint.textContent = 'سعر الجرام اتحسب من الإجمالي: ' + fmtCash(total/w);
  } else if(hint){
    hint.textContent = 'اكتب الوزن الأول عشان أقدر أحسب سعر الجرام من الإجمالي';
  }
  updateScrap21();
}
function updateScrap21(){
  const w = parseFloat(document.getElementById('sc-weight').value)||0;
  const total = parseFloat(document.getElementById('sc-total').value)||0;
  const k = parseFloat(document.getElementById('sc-karat').value)||BASE_KARAT;
  const el21 = document.getElementById('sc-price21');
  if(el21) el21.value = (w>0? (total/w)*(BASE_KARAT/k) : 0).toFixed(2);
}
document.addEventListener('input', (e)=>{
  if(e.target && e.target.id==='sc-weight') recalcScrapTotal();
});
function submitScrap(){
  const karat = parseFloat(document.getElementById('sc-karat').value);
  const weight = parseFloat(document.getElementById('sc-weight').value)||0;
  let price = parseFloat(document.getElementById('sc-price').value)||0;
  const name = document.getElementById('sc-name').value.trim();
  const employee = document.getElementById('sc-employee').value.trim();
  const typedTotal = parseFloat(document.getElementById('sc-total').value)||0;
  if(weight<=0){ toast('أدخل وزن الكسر'); return; }
  if(price<=0 && typedTotal<=0){ toast('أدخل سعر الجرام أو الإجمالي'); return; }
  if(!employee){
    toast('اكتب اسم الموظف الأول — العملية مش هتتقفل من غيره');
    const e = document.getElementById('sc-employee'); if(e){ e.style.borderColor='var(--red)'; e.focus(); }
    return;
  }
  // لو كتبت الإجمالي بإيدك بيبقى هو المرجع، وسعر الجرام بيتحسب منه
  const total = typedTotal>0? typedTotal : weight*price;
  price = total/weight;
  const price21 = (total/weight)*(BASE_KARAT/karat);
  const editing = scrapEditId? state.scrapPurchases.find(x=>x.id===scrapEditId) : null;
  mutate(()=>{
    if(editing) revertScrapEffect(editing);
    state.treasury.cash -= total;
    state.treasury.gold[karat] = (state.treasury.gold[karat]||0) + weight;
    state.scrapStock = state.scrapStock||{};
    state.scrapStock[karat] = (Number(state.scrapStock[karat])||0) + weight;
    if(editing){
      Object.assign(editing, {customerName:name, karat, weight, pricePerGram:price, pricePerGram21:price21, totalCash:total, employee,
        updatedAt:new Date().toISOString()});
    } else {
      state.scrapPurchases.push({id:uid('scrap'), no:state.counters.scrap++, date:todayStr(), createdAt:new Date().toISOString(),
        customerName:name, karat, weight, pricePerGram:price, pricePerGram21:price21, totalCash:total, employee});
    }
    state.employees = state.employees||[]; if(!state.employees.includes(employee)) state.employees.push(employee);
  }, editing? 'تم حفظ التعديل' : 'تم تسجيل عملية الشراء');
  scrapEditId = null;
  closeModal();
}

/* ---------- ملصق QR للقطعة ---------- */
function pieceQRInfo(p){
  const prod = p.productId? state.products.find(x=>x.id===p.productId) : null;
  return {
    uid: p.uid||'—',
    name: pieceLabel(p),                                  // اسم المنتج / الصنف
    type: (state.itemTypes.find(x=>x.id===(p.itemTypeId||(prod?prod.itemTypeId:null)))||{}).name || pieceLabel(p),
    classification: classificationName(pieceClassificationId(p)),   // التصنيف (اللون/النوع)
    karat: p.karat,                                       // العيار (المقاس)
    weight: Number(p.weight)||0,
    code: pieceCode(p),
    makingRate: pieceMakingRate(p),
    sellRate: (typeof pieceSellMakingRate==='function')? pieceSellMakingRate(p) : pieceMakingRate(p),
    date: p.date||'',
    sold: !!p.sold
  };
}
function tplFieldValue(type, p){
  switch(type){
    case 'shopName': return shopName();
    case 'itemType': return pieceLabel(p);
    case 'karat': return p.karat+'K';
    case 'weight': return Number(p.weight).toFixed(3);
    case 'code': return pieceCode(p);
    case 'merchantName': return p.merchantId? merchantName(p.merchantId) : '';
    case 'uid': return p.uid||tagBarcodeValue(p);
    default: return '';
  }
}
function pieceThermalQRCellHTML(p, flip){
  const tpl = state.settings && state.settings.thermalTemplate;
  if(tpl && tpl.elements && tpl.elements.length){
    const elsHTML = tpl.elements.map(el=>{
      if(el.type==='qr'){
        const svg = qrSVG(pieceQRPayload(p), {scale:3, quiet:0}) || '';
        return `<div style="position:absolute;left:${el.x}mm;top:${el.y}mm;width:${el.w}mm;height:${el.h}mm;transform:rotate(${el.rotate||0}deg);">${svg}</div>`;
      }
      if(el.type==='image'){
        return el.img? `<img src="${esc(el.img)}" style="position:absolute;left:${el.x}mm;top:${el.y}mm;width:${el.w}mm;height:${el.h}mm;object-fit:contain;transform:rotate(${el.rotate||0}deg);">` : '';
      }
      const txt = el.type==='text'? (el.text||'') : tplFieldValue(el.type, p);
      return `<div style="position:absolute;left:${el.x}mm;top:${el.y}mm;width:${el.w}mm;height:${el.h}mm;font-size:${el.fontSize}pt;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-family:'Tajawal',sans-serif;transform:rotate(${el.rotate||0}deg);">${esc(txt)}</div>`;
    }).join('');
    return `<div class="ticket-cell${flip?' flip':''}" style="position:relative;">${elsHTML}</div>`;
  }
  const svg = qrSVG(pieceQRPayload(p), {scale:3, quiet:1}) || '';
  return `<div class="ticket-cell${flip?' flip':''}">
    <div class="ticket-shop">${esc(shopName())}</div>
    <div class="ticket-type">${esc(pieceLabel(p))}</div>
    <div class="ticket-line"><span>${p.karat}K</span><span>${Number(p.weight).toFixed(3)}</span></div>
    <div class="ticket-qr">${svg}</div>
    <div class="ticket-sn">${esc(p.uid||tagBarcodeValue(p))}</div>
  </div>`;
}
function pieceThermalQREmptyCellHTML(flip){
  return `<div class="ticket-cell empty${flip?' flip':''}"></div>`;
}
function pieceThermalQRPairHTML(p1, p2){
  return `<div class="ticket-pair">
    ${pieceThermalQRCellHTML(p1,false)}
    <div class="ticket-gap"></div>
    ${p2? pieceThermalQRCellHTML(p2,true) : pieceThermalQREmptyCellHTML(true)}
  </div>`;
}
/* ---------- تيكت اختبار (مسطرة ملم) لمعايرة مقاس الطباعة الحرارية ---------- */
function thermalTestTicketSVG(wMM,hMM){
  const w=Number(wMM), h=Number(hMM);
  let ticks='';
  for(let x=0;x<=w;x+=5){
    const major = (Math.round(x)%10===0);
    ticks += `<line x1="${x}" y1="0" x2="${x}" y2="${major?3:1.5}" stroke="#000" stroke-width="0.15"/>`;
    if(major) ticks += `<text x="${x}" y="5.6" font-size="2" text-anchor="middle" font-family="monospace">${x}</text>`;
  }
  for(let y=0;y<=h;y+=5){
    const major = (Math.round(y)%10===0);
    ticks += `<line x1="0" y1="${y}" x2="${major?3:1.5}" y2="${y}" stroke="#000" stroke-width="0.15"/>`;
    if(major) ticks += `<text x="4" y="${y+0.8}" font-size="2" text-anchor="start" font-family="monospace">${y}</text>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}">
    <rect x="0.3" y="0.3" width="${Math.max(0,w-0.6)}" height="${Math.max(0,h-0.6)}" fill="none" stroke="#000" stroke-width="0.4"/>
    <line x1="0" y1="0" x2="${w}" y2="${h}" stroke="#000" stroke-width="0.15" stroke-dasharray="1,1"/>
    <line x1="${w}" y1="0" x2="0" y2="${h}" stroke="#000" stroke-width="0.15" stroke-dasharray="1,1"/>
    <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="#000" stroke-width="0.2" stroke-dasharray="0.6,0.6"/>
    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#000" stroke-width="0.2" stroke-dasharray="0.6,0.6"/>
    ${ticks}
    <text x="${w/2}" y="${h/2-2}" font-size="2.6" text-anchor="middle" font-family="sans-serif" font-weight="bold">تيكت اختبار</text>
    <text x="${w/2}" y="${h/2+2}" font-size="2.4" text-anchor="middle" font-family="monospace">${w} x ${h} mm</text>
  </svg>`;
}
function printThermalTestTicket(){
  const {w,h} = thermalLabelSize();
  let area = document.getElementById('print-area');
  if(!area){ area = document.createElement('div'); area.id='print-area'; document.body.appendChild(area); }

    window.print();
    setTimeout(()=>{ document.body.classList.remove('print-barcodes'); clearThermalPageStyle(); }, 500);

}
function setThermalPageStyle(wMM,hMM){

  if(s) s.textContent = `@page{ size:${wMM}mm ${hMM}mm; margin:0; }
    #print-area .test-ticket{ width:${wMM}mm; height:${hMM}mm; }

}
function clearThermalPageStyle(){
  const s = document.getElementById('thermal-page-style');

}
function printPiecesThermalQR(idsOrPieces){
  const pieces = resolvePiecesArg(idsOrPieces);
  if(!pieces.length){ toast('اختار قطعة واحدة على الأقل'); return; }
  const {w,h} = thermalLabelSize();

/* ============================= قالب تصميم التيكت (Templates) ============================= */
const TPL_SCALE = 7; // px لكل مم في شاشة التصميم
let tplEditor = null; // {elements:[{id,type,x,y,w,h,fontSize,text,rotate,img}], selectedId}
let tplDrag = null;

const TPL_TYPE_NAMES = {
  qr:'QR Code', shopName:'اسم المحل', itemType:'اسم الصنف', karat:'عيار الذهب',
  weight:'وزن الذهب', code:'كود القطعة', merchantName:'اسم التاجر', uid:'الكود الفريد',
  text:'نص حر', image:'صورة'
};

function newTplElement(type){
  const defaults = {
    qr:{w:16,h:16,fontSize:0}, shopName:{w:26,h:5,fontSize:2.6}, itemType:{w:22,h:5,fontSize:2.4},
    karat:{w:12,h:4,fontSize:2.4}, weight:{w:14,h:4,fontSize:2.4}, code:{w:18,h:4,fontSize:2},
    merchantName:{w:22,h:4,fontSize:2}, uid:{w:24,h:3.5,fontSize:1.8}, text:{w:20,h:4,fontSize:2.2},
    image:{w:12,h:12,fontSize:0}
  };
  const d = defaults[type]||{w:16,h:5,fontSize:2.2};
  return {id:'el'+Math.random().toString(36).slice(2,9), type, x:2, y:2, w:d.w, h:d.h, fontSize:d.fontSize,
    text: type==='text'? 'نص' : '', rotate:0, img: type==='image'? '' : undefined};
}
function openThermalTemplateEditor(){
  const saved = state.settings && state.settings.thermalTemplate;
  tplEditor = { elements: saved && saved.elements? JSON.parse(JSON.stringify(saved.elements)) : [], selectedId:null };
  goto('thermal-template');
}
function tplSampleFieldText(type){
  const p = state.pieces && state.pieces[0];
  switch(type){
    case 'shopName': return shopName();
    case 'itemType': return p? pieceLabel(p) : 'خاتم';
    case 'karat': return (p? p.karat : 21)+'K';
    case 'weight': return p? Number(p.weight).toFixed(3) : '5.250';
    case 'code': return p? pieceCode(p) : 'P-001';
    case 'merchantName': return (p && p.merchantId)? merchantName(p.merchantId) : 'اسم التاجر';
    case 'uid': return p? (p.uid||tagBarcodeValue(p)) : 'GS-000001-ABCD';
    default: return '';
  }
}
function tplElementHTML(el){
  const x=el.x*TPL_SCALE, y=el.y*TPL_SCALE, w=el.w*TPL_SCALE, h=el.h*TPL_SCALE;
  const sel = tplEditor.selectedId===el.id;
  let inner='';
  if(el.type==='qr'){
    inner = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#eee,#eee 4px,#fff 4px,#fff 8px);font-size:11px;color:#888;font-weight:800;">QR</div>`;
  } else if(el.type==='image'){
    inner = el.img? `<img src="${esc(el.img)}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f2f2f2;font-size:10px;color:#888;">صورة</div>`;
  } else {
    const txt = el.type==='text'? (el.text||'نص') : tplSampleFieldText(el.type);
    inner = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${(el.fontSize*TPL_SCALE/2.2).toFixed(1)}px;font-family:'Tajawal',sans-serif;white-space:nowrap;overflow:hidden;pointer-events:none;">${esc(txt)}</div>`;
  }
  return `<div class="tpl-el" data-id="${el.id}" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;
    border:1px ${sel?'solid #d4af37':'dashed #999'};box-sizing:border-box;cursor:move;background:${sel?'rgba(212,175,55,.08)':'transparent'};
    transform:rotate(${el.rotate||0}deg);" onmousedown="tplElMouseDown(event,'${el.id}')">
    ${inner}
    ${sel? `<div onmousedown="tplResizeMouseDown(event,'${el.id}')" style="position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:#d4af37;border-radius:2px;cursor:nwse-resize;"></div>` : ''}

function renderThermalTemplateEditor(){
  if(!tplEditor) openThermalTemplateEditor();

        <button class="btn btn-sm btn-ghost" onclick="tplAddElement('itemType')">＋ اسم الصنف</button>
        <button class="btn btn-sm btn-ghost" onclick="tplAddElement('karat')">＋ عيار الذهب</button>
        <button class="btn btn-sm btn-ghost" onclick="tplAddElement('weight')">＋ وزن الذهب</button>
        <button class="btn btn-sm btn-ghost" onclick="tplAddElement('code')">＋ كود القطعة</button>
        <button class="btn btn-sm btn-ghost" onclick="tplAddElement('merchantName')">＋ اسم التاجر</button>
        <button class="btn btn-sm btn-ghost" onclick="tplAddElement('uid')">＋ الكود الفريد</button>

        overflow:hidden;flex:none;" onmousedown="tplCanvasMouseDown(event)">${els}</div>
      <div class="card" style="min-width:230px;flex:none;">
        ${tplSelectedPanelHTML()}
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-gold" onclick="saveThermalTemplate()">💾 حفظ القالب</button>

        </div>
        <div style="margin-top:10px;">
          <button class="btn btn-sm btn-ghost" style="color:#c0392b;" onclick="clearThermalTemplate()">مسح القالب والرجوع للتصميم الافتراضي</button>

function tplSelect(id){ tplEditor.selectedId=id; render(); }
function tplCanvasMouseDown(e){ if(e.target && e.target.id==='tpl-canvas'){ tplEditor.selectedId=null; render(); } }
function tplAddElement(type){
  if(!tplEditor) tplEditor={elements:[],selectedId:null};
  const el = newTplElement(type);
  tplEditor.elements.push(el);
  tplEditor.selectedId = el.id;
  render();
}
function tplAddImageElement(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const el = newTplElement('image');
      el.img = reader.result;
      tplEditor.elements.push(el);
      tplEditor.selectedId = el.id;
      render();
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}
function tplDeleteSelected(){
  if(!tplEditor.selectedId) return;
  tplEditor.elements = tplEditor.elements.filter(x=>x.id!==tplEditor.selectedId);
  tplEditor.selectedId = null;
  render();
}
function tplUpdateSelected(field, val){
  const el = tplEditor.elements.find(x=>x.id===tplEditor.selectedId);
  if(!el) return;
  if(field==='text') el.text = val;
  else el[field] = parseFloat(val)||0;
  render();
}
function tplElMouseDown(e, id){
  e.stopPropagation();
  if(tplEditor.selectedId!==id){ tplEditor.selectedId=id; render(); }
  const el = tplEditor.elements.find(x=>x.id===id);
  if(!el) return;
  tplDrag = {id, mode:'move', startX:e.clientX, startY:e.clientY, origX:el.x, origY:el.y};
  document.addEventListener('mousemove', tplMouseMove);
  document.addEventListener('mouseup', tplMouseUp);
}
function tplResizeMouseDown(e, id){
  e.stopPropagation();
  const el = tplEditor.elements.find(x=>x.id===id);
  if(!el) return;
  tplDrag = {id, mode:'resize', startX:e.clientX, startY:e.clientY, origW:el.w, origH:el.h};
  document.addEventListener('mousemove', tplMouseMove);
  document.addEventListener('mouseup', tplMouseUp);
}
function tplMouseMove(e){
  if(!tplDrag) return;
  const el = tplEditor.elements.find(x=>x.id===tplDrag.id);
  if(!el) return;
  const dxMM = (e.clientX - tplDrag.startX)/TPL_SCALE;
  const dyMM = (e.clientY - tplDrag.startY)/TPL_SCALE;
  const domEl = document.querySelector(`.tpl-el[data-id="${tplDrag.id}"]`);
  if(tplDrag.mode==='move'){
    el.x = Math.max(0, tplDrag.origX + dxMM);
    el.y = Math.max(0, tplDrag.origY + dyMM);
    if(domEl){ domEl.style.left=(el.x*TPL_SCALE)+'px'; domEl.style.top=(el.y*TPL_SCALE)+'px'; }
  } else {
    el.w = Math.max(3, tplDrag.origW + dxMM);
    el.h = Math.max(3, tplDrag.origH + dyMM);
    if(domEl){ domEl.style.width=(el.w*TPL_SCALE)+'px'; domEl.style.height=(el.h*TPL_SCALE)+'px'; }
  }
}
function tplMouseUp(){
  tplDrag = null;
  document.removeEventListener('mousemove', tplMouseMove);
  document.removeEventListener('mouseup', tplMouseUp);
  render();
}
function saveThermalTemplate(){
  mutate(()=>{
    state.settings = state.settings||{};
    state.settings.thermalTemplate = { elements: tplEditor.elements.map(e=>({...e})) };
  }, 'تم حفظ قالب التيكت');
}
function clearThermalTemplate(){
  mutate(()=>{
    state.settings = state.settings||{};
    delete state.settings.thermalTemplate;
  }, 'تم مسح القالب — هيرجع للتصميم الافتراضي');
  tplEditor = { elements:[], selectedId:null };

}
function tplPreview(){

/* تحويل كل أوزان الذهب لعيار 21 المكافئ: وزن × (العيار ÷ 21) */
const BASE_KARAT = 21;
function goldTo21(balanceGold){
  let total = 0;
  state.karats.forEach(k=>{
    const w = Number(balanceGold[k])||0;
    if(w) total += w * (k / BASE_KARAT);
  });
  return total;
}

        <tbody>
        ${rows.length? rows.map(m=>`
          <tr>

              return g.length? `<div class="kv-inline">${g.map(x=>`<span class="kv-chip">ع${x.k}: <b>${x.w.toFixed(3)}</b></span>`).join('')}</div>` : `<span class="muted" style="font-size:12px;">—</span>`;

function submitMerchant(id){
  const name = document.getElementById('mc-name').value.trim();
  const code = document.getElementById('mc-code').value.trim();
  const phone = document.getElementById('mc-phone').value.trim();
  const defaultKarat = parseFloat(document.getElementById('mc-karat').value);
  if(!name || !code){ toast('أدخل الاسم والكود'); return; }
  if(state.merchants.some(m=>m.code===code && m.id!==id)){ toast('هذا الكود مستخدم بالفعل'); return; }
  mutate(()=>{
    if(id){
      const m = merchantById(id);
      m.name=name; m.code=code; m.phone=phone; m.defaultKarat=defaultKarat;
    } else {
      state.merchants.push({id:uid('mer'), code, name, phone, defaultKarat, balanceCash:0, balanceGold: emptyGoldMap()});
      state.counters.merchant++;
    }
  }, id?'تم حفظ بيانات التاجر':'تمت إضافة التاجر');

}

function goldMapLabel(map){

  if(!rows.length) return '';

/* كل حركة بتأثر على حساب التاجر: cash = التغير في رصيده النقدي، gold = خريطة تغير أوزانه */
function merchantStatementEntries(merchantId){
  const out = [];
  const g = (k,w)=>{ const m={}; if(k && w) m[k]=w; return m; };

  state.purchaseInvoices.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const making = (i.totalMaking!=null? i.totalMaking : i.totalCash)||0;
    const weight = (i.totalWeight!=null? i.totalWeight : (i.items||[]).reduce((s,x)=>s+x.weight,0))||0;
    const byKarat = {};
    (i.items||[]).forEach(x=>{ byKarat[x.karat] = (byKarat[x.karat]||0) - x.weight; });
    out.push({
      date:i.date, kind:'purchase', key:'pi_'+i.id, ref:'#'+i.no,
      type:'فاتورة مشتريات', desc:'شراء بالوزن — '+((i.items||[]).length)+' قطعة، إجمالي '+weight.toFixed(3)+' جم',
      cash: -(making - (i.amountPaidNow||0)),
      gold: i.settleMode==='weight'? byKarat : {},
      inv: i
    });
  });
  state.salesInvoices.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const byKarat = {};
    if(i.settleMode==='weight') (i.items||[]).forEach(x=>{ byKarat[x.karat] = (byKarat[x.karat]||0) + x.weight; });
    const w = (i.totalWeight!=null? i.totalWeight : (i.items||[]).reduce((s,x)=>s+x.weight,0))||0;
    out.push({date:i.date, kind:'sale', key:'si_'+i.id, ref:'#'+i.no, type:'فاتورة مبيعات',
      desc: i.settleMode==='weight'
        ? ('بيع بالوزن — '+((i.items||[]).length)+' قطعة، إجمالي '+w.toFixed(3)+' جم، أجر '+fmtCash(i.totalMaking||i.totalCash||0))
        : ('بيع لتاجر — إجمالي '+fmtCash(i.totalCash)+(i.amountPaidNow? ' · مدفوع '+fmtCash(i.amountPaidNow):'')),
      cash: (i.totalCash||0) - (i.amountPaidNow||0), gold: byKarat, inv:i, isSale:true});
  });
  state.collections.filter(i=>i.partyKind!=='customer' && i.merchantId===merchantId).forEach(i=>{
    const gold={}; (i.items||[]).forEach(x=>{ gold[x.karat]=(gold[x.karat]||0)-x.weight; });
    out.push({date:i.date, kind:'collect', key:'co_'+i.id, ref:'#'+i.no, type:'تحصيل من تاجر',
      desc:[(i.cash? 'نقدية '+fmtCash(i.cash)+(i.cashMode==='treasury'?' (خزينة)':' (على الحساب)') : ''), (goldMapLabel(gold)? 'ذهب '+goldMapLabel(gold):''), (i.note||'')].filter(Boolean).join(' · '),
      cash: -(i.cash||0), gold});
  });
  state.payments.filter(i=>i.partyKind!=='customer' && i.merchantId===merchantId).forEach(i=>{
    const gold={}; (i.items||[]).forEach(x=>{ gold[x.karat]=(gold[x.karat]||0)+x.weight; });
    out.push({date:i.date, kind:'pay', key:'pa_'+i.id, ref:'#'+i.no, type:'تسديد لتاجر',
      desc:[(i.cash? 'نقدية '+fmtCash(i.cash)+(i.cashMode==='treasury'?' (خزينة)':' (على الحساب)') : ''), (goldMapLabel(gold)? 'ذهب '+goldMapLabel(gold):''), (i.note||'')].filter(Boolean).join(' · '),
      cash: (i.cash||0), gold});
  });
  state.settlements.filter(i=>i.partyKind!=='customer' && i.merchantId===merchantId).forEach(i=>{
    const sign = i.type==='debit'? 1 : -1;
    out.push({date:i.date, kind:'settle', key:'st_'+i.id, ref:'#'+i.no, type:'تسوية حساب',
      desc:(i.type==='debit'?'قيد علي التاجر':'قيد لصالح التاجر')+(i.note? ' · '+i.note:''),
      cash: sign*(i.cash||0), gold: g(i.karat, sign*(i.weight||0))});
  });
  state.transfers.filter(i=>i.partyKind!=='customer' && (i.fromMerchantId===merchantId || i.toMerchantId===merchantId)).forEach(i=>{
    const isFrom = i.fromMerchantId===merchantId;
    const sign = isFrom? -1 : 1;
    out.push({date:i.date, kind:'transfer', key:'tr_'+i.id, ref:'#'+i.no, type:'تحويل رصيد',
      desc: isFrom? ('تحويل إلى '+merchantName(i.toMerchantId)) : ('تحويل من '+merchantName(i.fromMerchantId)),
      cash: sign*(i.cash||0), gold: g(i.karat, sign*(i.weight||0))});
  });
  state.merchantReturns.filter(i=>i.merchantId===merchantId).forEach(i=>{
    const byKarat = {};
    (i.items||[]).forEach(x=>{ byKarat[x.karat] = (byKarat[x.karat]||0) - x.weight; });
    out.push({date:i.date, kind:'mreturn', key:'mr_'+i.id, ref:'#'+i.no, type:'فاتورة مرتجعات',
      desc:'مرتجع '+((i.items||[]).length)+' قطعة، إجمالي '+Number(i.totalWeight||0).toFixed(3)+' جم، أجر '+fmtCash(i.totalMaking||0),
      cash: -((i.totalMaking||0) - (i.amountPaidNow||0)), gold: byKarat});
  });
  state.goldLots.filter(l=>l.partyKind!=='customer' && l.partyId===merchantId).forEach(l=>{
    const gold={}; gold[l.karat] = l.dir==='buy'? -l.weight : l.weight;
    out.push({date:l.date, kind:'lot', key:'lt_'+l.id, ref:'#'+l.no,
      type: l.dir==='buy'? 'شراء قطع منه' : 'بيع قطع له',
      desc:'عيار '+l.karat+' · '+fmtW(l.weight)+' (ع'+BASE_KARAT+': '+l.weight21.toFixed(3)+') × '+fmtCash(l.pricePerGram21)+' = '+fmtCash(l.value)+(l.cashNow? ' · نقدي '+fmtCash(l.cashNow):''),
      cash: (l.dir==='buy'? -1:1) * ((l.value||0) - (l.cashNow||0)), gold});
  });
  state.pendingSales.filter(p=>p.partyKind!=='customer' && p.merchantId===merchantId && p.status==='confirmed').forEach(p=>{
    out.push({date:p.confirmedDate||p.date, kind:'pending', key:'pd_'+p.id, ref:'#'+p.no, type:'قطعة معلّقة مؤكدة',
      desc:'عيار '+p.karat+' · '+p.weight+' جم × '+fmtCash(p.pricePerGram), cash:(p.totalCash||0), gold:{}});
  });

  return out.map((e,i)=>Object.assign(e,{date:String(e.date).slice(0,10), _i:i}))
    .sort((a,b)=>{ const d=new Date(a.date)-new Date(b.date); return d!==0? d : a._i-b._i; });
}

function printMerchantStatement(){
  const m = merchantById(uiState.stmtMerchantId);
  if(!m){ toast('اختر تاجرًا أولاً'); return; }
  const from = uiState.stmtFrom||'', to = uiState.stmtTo||'';
  const all = merchantStatementEntries(m.id);
  let openCash = 0;
  if(from) all.forEach(e=>{ if(e.date<from) openCash += e.cash; });
  let bal = openCash; const rows=[];
  all.forEach(e=>{
    if(from && e.date<from) return;
    if(to && e.date>to) return;
    bal += e.cash;
    rows.push(Object.assign({},e,{bal}));
  });
  if(!rows.length){ toast('لا توجد حركات لطباعتها'); return; }
  const nf = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const period = (!from && !to)? 'كل الفترات' : ('من '+(from? fmtDateRep(from):'البداية')+' إلى '+(to? fmtDateRep(to):'اليوم'));
  const totalDr = rows.reduce((s,r)=>s+(r.cash>0?r.cash:0),0);
  const totalCr = rows.reduce((s,r)=>s+(r.cash<0?-r.cash:0),0);
  const area = document.getElementById('report-print-area');
  area.innerHTML = `
    <div class="rp">
      <h1>كشف حساب — ${esc(m.name)} (${esc(m.code)})</h1>
      <div class="rp-sub">${esc(period)} • عدد الحركات: ${rows.length} • تاريخ الطباعة: ${fmtDateRep(todayStr())}</div>
      <div class="rp-cards">
        <div class="rp-card"><b>رصيد أول المدة</b><span>${nf(Math.abs(openCash))} ${openCash>=0?'(لنا)':'(علينا)'}</span></div>
        <div class="rp-card"><b>إجمالي مدين</b><span>${nf(totalDr)}</span></div>
        <div class="rp-card"><b>إجمالي دائن</b><span>${nf(totalCr)}</span></div>
        <div class="rp-card"><b>الرصيد آخر المدة</b><span>${nf(Math.abs(bal))} ${bal>=0?'(لنا)':'(علينا)'}</span></div>
      </div>
      <table>
        <thead><tr><th>التاريخ</th><th>رقم</th><th>نوع الحركة</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th><th>حركة الذهب</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td>${fmtDateRep(r.date)}</td><td>${esc(r.ref)}</td><td>${esc(r.type)}</td><td>${esc(r.desc)}</td>
            <td>${r.cash>0? nf(r.cash):'—'}</td><td>${r.cash<0? nf(-r.cash):'—'}</td>
            <td>${nf(Math.abs(r.bal))} ${r.bal>=0?'(لنا)':'(علينا)'}</td>
            <td>${esc(goldMapLabel(r.gold)||'—')}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr><td colspan="4">الإجمالي</td><td>${nf(totalDr)}</td><td>${nf(totalCr)}</td><td>${nf(Math.abs(bal))} ${bal>=0?'(لنا)':'(علينا)'}</td><td></td></tr></tfoot>
      </table>
      <div class="rp-foot"><span>دفتر الصائغ — كشف حساب تاجر</span><span>التوقيع: ................................</span></div>
    </div>`;
  document.body.classList.add('print-report');
  setTimeout(()=>{ window.print(); setTimeout(()=>{ document.body.classList.remove('print-report'); area.innerHTML=''; },500); }, 80);
}

/* ============================= فواتير مشتريات / مبيعات (مشترك) ============================= */
function invoiceItemsTemplate(prefix, items){
  items = items && items.length? items : [{karat:state.karats[0], weight:'', price:'', making:'', productId:''}];
  const withProduct = prefix==='purchase';
  const cols = withProduct? '1.3fr .8fr 1fr 1fr 1fr auto' : '1fr 1fr 1fr 1fr auto';
  return items.map((it,idx)=>`
    <div class="item-row" data-idx="${idx}" style="grid-template-columns:${cols};">
      ${withProduct? `
      <div><label>المنتج (اختياري)</label>
        <select class="${prefix}-product">
          <option value="">بدون منتج محدد</option>
          ${state.products.map(p=>`<option value="${p.id}" ${it.productId===p.id?'selected':''}>${esc(productLabel(p))}</option>`).join('')}
        </select>
      </div>` : ''}
      <div><label>العيار</label>
        <select class="${prefix}-karat">${state.karats.map(k=>`<option value="${k}" ${it.karat==k?'selected':''}>ع${k}</option>`).join('')}</select>
      </div>
      <div><label>الوزن (جم)</label><input type="number" step="0.001" class="${prefix}-weight" value="${it.weight||''}" oninput="recalcInvoiceTotal('${prefix}')"></div>
      <div><label>سعر الجرام</label><input type="number" step="0.01" class="${prefix}-price" value="${it.price||''}" oninput="recalcInvoiceTotal('${prefix}')"></div>
      <div><label>مصنعية</label><input type="number" step="0.01" class="${prefix}-making" value="${it.making||''}" oninput="recalcInvoiceTotal('${prefix}')"></div>
      <div class="rm" onclick="removeItemRow('${prefix}', this)">✕</div>
    </div>
  `).join('');
}
function addItemRow(prefix){
  const wrap = document.getElementById(prefix+'-items');
  const div = document.createElement('div');
  div.innerHTML = invoiceItemsTemplate(prefix, [{karat:state.karats[0]}]);
  wrap.appendChild(div.firstElementChild);
}
function removeItemRow(prefix, el){
  const wrap = document.getElementById(prefix+'-items');
  if(wrap.children.length>1) el.closest('.item-row').remove();
  recalcInvoiceTotal(prefix);
}
function collectItems(prefix){
  const rows = document.querySelectorAll('#'+prefix+'-items .item-row');
  const items=[];
  rows.forEach(r=>{
    const karat = parseFloat(r.querySelector('.'+prefix+'-karat').value);
    const weight = parseFloat(r.querySelector('.'+prefix+'-weight').value)||0;
    const price = parseFloat(r.querySelector('.'+prefix+'-price').value)||0;
    const making = parseFloat(r.querySelector('.'+prefix+'-making').value)||0;
    const productSel = r.querySelector('.'+prefix+'-product');
    const productId = productSel && productSel.value? productSel.value : null;
    if(weight>0 && price>0) items.push({karat, weight, price, making, total: weight*price+making, productId});
  });
  return items;
}
function recalcInvoiceTotal(prefix){
  const items = collectItems(prefix);
  const total = items.reduce((s,i)=>s+i.total,0);
  const totalEl = document.getElementById(prefix+'-total');
  if(totalEl) totalEl.value = total.toFixed(2);
  const paidEl = document.getElementById(prefix+'-paid');
  if(paidEl && paidEl.dataset.auto==='1') paidEl.value = total.toFixed(2);
}

function filteredCatalogProducts(){

    return name.toLowerCase().includes(q);
  });

let pbEditId=null, pbEditNo=null, pbEditDate=null, pbEditCreatedAt=null;

const EDIT_WINDOW_MS = 24*60*60*1000;
function invoiceCreatedMs(inv){
  const t = Date.parse(inv.createdAt || (String(inv.date).slice(0,10)+'T00:00:00'));
  return isNaN(t)? 0 : t;
}
function invoiceHoursLeft(inv){
  return (EDIT_WINDOW_MS - (Date.now() - invoiceCreatedMs(inv))) / 3600000;
}
function invoiceWithinWindow(inv){ return invoiceHoursLeft(inv) > 0; }
function invItemsSummary(items, tone){
  const arr = items||[];
  if(!arr.length) return '<span class="muted">—</span>';
  const full = arr.map((i,n)=>`${n+1}. ${i.itemName||''} ع${i.karat} · ${Number(i.weight).toFixed(3)}جم`).join(' | ');
  const cls = tone==='red'? 'pill-red' : 'pill-gold';
  const first = arr[0];
  return `<div class="items-sum" title="${esc(full)}">`
    + `<span class="pill ${cls}" style="white-space:nowrap;">${arr.length} صنف</span>`
    + `<span class="muted items-sum-txt">${esc(first.itemName||'')} ع${first.karat}${arr.length>1? ' + '+(arr.length-1)+' غيره' : ''}</span>`
    + `</div>`;
}
function invoiceLockChip(inv){
  if(invoiceWithinWindow(inv)){
    const h = Math.max(0, invoiceHoursLeft(inv));
    return `<span class="pill pill-green" title="متبقي ${h.toFixed(1)} ساعة على قفل التعديل">✎ ${h<1? Math.round(h*60)+' د' : h.toFixed(0)+' س'}</span>`;
  }
  return `<span class="pill pill-muted" title="عدّى 24 ساعة — التعديل بقى بالكيو آر كود بس">🔒 مقفولة</span>`;
}
function tryReopenInvoice(kind, id){
  const inv = invoiceBucket(kind).find(x=>x.id===id);
  if(!inv) return;
  if(!invoiceWithinWindow(inv)){
    promptSuperPassword('فتح الفاتورة للتعديل', ()=> reopenInvoice(kind, id));
    return;
  }
  reopenInvoice(kind, id);
}
function invoiceSoldPieces(inv){
  return state.pieces.filter(p=> p.invoiceId===inv.id && p.sold).length;
}

/* عكس قيد فاتورة الشراء بالكامل (يستخدم في الحذف والتعديل) */
function revertPurchaseInvoice(inv){
  const m = merchantById(inv.merchantId);
  const making = (inv.totalMaking!=null? inv.totalMaking : inv.totalCash)||0;
  const paid = inv.amountPaidNow||0;
  const byKarat = {};
  (inv.items||[]).forEach(it=>{ byKarat[it.karat] = (byKarat[it.karat]||0) + (Number(it.weight)||0); });
  Object.keys(byKarat).forEach(k=>{
    state.treasury.gold[k] = (state.treasury.gold[k]||0) - byKarat[k];
    if(m && inv.settleMode==='weight') m.balanceGold[k] = (m.balanceGold[k]||0) + byKarat[k];
  });
  state.treasury.cash += paid;
  if(m) m.balanceCash += (making - paid);
  state.pieces = state.pieces.filter(p=> p.invoiceId !== inv.id);
  state.purchaseInvoices = state.purchaseInvoices.filter(x=> x.id !== inv.id);
}

function guardInvoiceChange(inv, action, onGranted){
  const sold = invoiceSoldPieces(inv);
  if(sold){
    toast('مينفعش '+action+' — فيه '+sold+' قطعة من الفاتورة دي اتباعت بالفعل');
    return;
  }
  if(invoiceWithinWindow(inv)){ onGranted(); return; }
  promptSuperPassword(action, onGranted);
}

function deletePurchaseInvoice(id){
  const inv = state.purchaseInvoices.find(x=>x.id===id);
  if(!inv) return;
  guardInvoiceChange(inv,'الحذف', ()=>{
    const w = (inv.totalWeight!=null? inv.totalWeight : (inv.items||[]).reduce((a,b)=>a+b.weight,0))||0;
    showConfirmModal('حذف فاتورة الشراء رقم #'+inv.no+'؟ هيترجع '+w.toFixed(3)+' جم من المخزون ويتلغي قيدها على حساب التاجر، والقطع بتاعتها هتتشال.', ()=>{
      mutate(()=>{ revertPurchaseInvoice(inv); }, 'تم حذف الفاتورة وإلغاء قيدها');
      closeModal();
    }, {confirmLabel:'حذف الفاتورة'});
  });
}
